<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow183" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box-bad { fill: #ffffff; stroke: #b23b3b; stroke-width: 1.2; }
    .box-mid { fill: #ffffff; stroke: #b8860b; stroke-width: 1.2; }
    .box-good { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-title { font-size: 12px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 9.5px; fill: #555555; }
    .t-axis { font-size: 12px; font-weight: 700; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.4; fill: none; }
  </style>

  <line class="line" x1="40" y1="220" x2="860" y2="220" marker-end="url(#arrow183)"/>
  <text class="t-axis" x="450" y="248" text-anchor="middle">안전성 · 권장도 증가 →</text>

  <!-- 1 Git 직접 -->
  <rect class="box-bad" x="20" y="90" width="150" height="110" rx="4"/>
  <text class="t-title" x="95" y="116" text-anchor="middle">Git에 평문 저장</text>
  <text class="t-sub" x="95" y="138" text-anchor="middle">가장 단순, 가장 위험</text>
  <text class="t-sub" x="95" y="154" text-anchor="middle">프라이빗 리포라도</text>
  <text class="t-sub" x="95" y="168" text-anchor="middle">유출 위험 그대로</text>
  <line class="line" x1="95" y1="200" x2="95" y2="216"/>

  <!-- 2 이미지에 내장 -->
  <rect class="box-bad" x="190" y="90" width="150" height="110" rx="4"/>
  <text class="t-title" x="265" y="116" text-anchor="middle">이미지에 내장</text>
  <text class="t-sub" x="265" y="138" text-anchor="middle">로테이션마다 재빌드</text>
  <text class="t-sub" x="265" y="154" text-anchor="middle">이미지 접근권 =</text>
  <text class="t-sub" x="265" y="168" text-anchor="middle">시크릿 접근권</text>
  <line class="line" x1="265" y1="200" x2="265" y2="216"/>

  <!-- 3 K8s Secret -->
  <rect class="box-mid" x="360" y="90" width="150" height="110" rx="4"/>
  <text class="t-title" x="435" y="116" text-anchor="middle">쿠버네티스 Secret</text>
  <text class="t-sub" x="435" y="138" text-anchor="middle">가장 쉽게 시작</text>
  <text class="t-sub" x="435" y="154" text-anchor="middle">base64는 암호화가</text>
  <text class="t-sub" x="435" y="168" text-anchor="middle">아님 (1·4장 복습)</text>
  <line class="line" x1="435" y1="200" x2="435" y2="216"/>

  <!-- 4 Sealed Secrets -->
  <rect class="box-good" x="530" y="90" width="150" height="110" rx="4"/>
  <text class="t-title" x="605" y="116" text-anchor="middle">Sealed Secrets</text>
  <text class="t-sub" x="605" y="138" text-anchor="middle">클러스터 공개키로</text>
  <text class="t-sub" x="605" y="154" text-anchor="middle">암호화해 Git에 커밋</text>
  <text class="t-sub" x="605" y="168" text-anchor="middle">그 클러스터만 복호화</text>
  <line class="line" x1="605" y1="200" x2="605" y2="216"/>

  <!-- 5 외부 시크릿 -->
  <rect class="box-good" x="700" y="90" width="160" height="110" rx="4"/>
  <text class="t-title" x="780" y="116" text-anchor="middle">외부 시크릿 프로바이더</text>
  <text class="t-sub" x="780" y="138" text-anchor="middle">Vault·클라우드 매니저가</text>
  <text class="t-sub" x="780" y="154" text-anchor="middle">원본 보관, Git엔 참조만</text>
  <text class="t-sub" x="780" y="168" text-anchor="middle">4장 ESO와 직결</text>

  <text class="t-cap" x="450" y="300" text-anchor="middle">18.7절 모범 사례: Sealed Secrets 또는 외부 시크릿 프로바이더 중 하나를 쓴다.</text>
  <text class="t-cap" x="450" y="322" text-anchor="middle">넷째·다섯째 방법의 공통점 — Git에는 "암호화된 값" 또는 "참조"만 남고, 진짜 비밀은 다른 곳에 있다.</text>
</svg>
