<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow43" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrow43b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-title { font-size: 13.5px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 11px; fill: #555555; }
    .t-lbl { font-size: 12px; font-weight: 600; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
    .line-alt { stroke: #2456c4; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  </style>

  <!-- 주체 -->
  <rect class="box" x="20" y="120" width="230" height="110" rx="4"/>
  <text class="t-title" x="135" y="150" text-anchor="middle">주체 (Subject)</text>
  <text class="t-sub" x="135" y="172" text-anchor="middle">User — 사람 (외부 신원 시스템)</text>
  <text class="t-sub" x="135" y="190" text-anchor="middle">Group — 사람의 묶음</text>
  <text class="t-sub" x="135" y="208" text-anchor="middle">ServiceAccount — 워크로드의 신원</text>

  <!-- RoleBinding -->
  <rect class="box-accent" x="340" y="130" width="220" height="90" rx="4"/>
  <text class="t-title" x="450" y="162" text-anchor="middle">RoleBinding</text>
  <text class="t-sub" x="450" y="182" text-anchor="middle">"누구에게 어떤 롤을" 잇는 접착제</text>
  <text class="t-sub" x="450" y="200" text-anchor="middle">네임스페이스 범위로 부여</text>

  <!-- Role -->
  <rect class="box" x="660" y="50" width="220" height="110" rx="4"/>
  <text class="t-title" x="770" y="80" text-anchor="middle">Role — 권한 묶음</text>
  <text class="t-sub" x="770" y="102" text-anchor="middle">rules: 리소스 × 동사(verb)</text>
  <text class="t-sub" x="770" y="120" text-anchor="middle">예: pods에 get · list · watch</text>
  <text class="t-sub" x="770" y="138" text-anchor="middle">해당 네임스페이스 안에서만 정의</text>

  <!-- ClusterRole -->
  <rect class="box" x="660" y="220" width="220" height="100" rx="4"/>
  <text class="t-title" x="770" y="250" text-anchor="middle">ClusterRole</text>
  <text class="t-sub" x="770" y="272" text-anchor="middle">클러스터 전체 범위의 권한 묶음</text>
  <text class="t-sub" x="770" y="290" text-anchor="middle">내장: view · edit · admin ·</text>
  <text class="t-sub" x="770" y="306" text-anchor="middle">cluster-admin</text>

  <!-- 주체 → RoleBinding -->
  <line class="line" x1="250" y1="175" x2="336" y2="175" marker-end="url(#arrow43)"/>

  <!-- RoleBinding → Role -->
  <polyline class="line" points="560,155 610,155 610,105 656,105" marker-end="url(#arrow43)"/>

  <!-- RoleBinding ⇢ ClusterRole (참조) -->
  <polyline class="line-alt" points="560,195 610,195 610,270 656,270" marker-end="url(#arrow43b)"/>
  <text class="t-lbl" x="600" y="240" text-anchor="end">공용 정의를 네임스페이스</text>
  <text class="t-lbl" x="600" y="258" text-anchor="end">범위로 빌려 바인딩 가능</text>

  <!-- 캡션 -->
  <text class="t-cap" x="450" y="352" text-anchor="middle">RBAC의 문장 구조: "주체가 — (RoleBinding을 통해) — 이 롤의 권한을 갖는다."</text>
  <text class="t-cap" x="450" y="374" text-anchor="middle">실무 정석은 내장 ClusterRole(view·edit)을 RoleBinding으로 좁혀 빌려 쓰는 파란 점선 경로다 (2장에서 이미 사용).</text>
</svg>
