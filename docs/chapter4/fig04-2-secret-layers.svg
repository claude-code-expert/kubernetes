<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .group { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .t-title { font-size: 13.5px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 11px; fill: #555555; }
    .t-lbl { font-size: 12px; font-weight: 600; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <!-- 외부 시크릿 매니저 -->
  <rect class="box" x="20" y="60" width="230" height="86" rx="4"/>
  <text class="t-title" x="135" y="90" text-anchor="middle">외부 시크릿 매니저</text>
  <text class="t-sub" x="135" y="110" text-anchor="middle">Vault/OpenBao · AWS Secrets Manager</text>
  <text class="t-sub" x="135" y="128" text-anchor="middle">Azure Key Vault · GCP Secret Manager</text>

  <line class="line" x1="135" y1="146" x2="135" y2="196" marker-end="url(#arrow42)"/>

  <!-- ESO -->
  <rect class="box-accent" x="20" y="200" width="230" height="80" rx="4"/>
  <text class="t-title" x="135" y="230" text-anchor="middle">External Secrets Operator</text>
  <text class="t-sub" x="135" y="250" text-anchor="middle">외부 값을 읽어 쿠버네티스</text>
  <text class="t-sub" x="135" y="266" text-anchor="middle">Secret으로 자동 동기화</text>

  <!-- 클러스터 프레임 -->
  <rect class="group" x="320" y="40" width="560" height="336" rx="6"/>
  <text class="t-sub" x="336" y="62">클러스터</text>

  <!-- Secret 오브젝트 -->
  <rect class="box" x="350" y="80" width="220" height="64" rx="4"/>
  <text class="t-title" x="460" y="106" text-anchor="middle">Secret 오브젝트</text>
  <text class="t-sub" x="460" y="126" text-anchor="middle">base64 인코딩 (≠ 암호화)</text>

  <!-- etcd -->
  <rect class="box" x="630" y="80" width="220" height="64" rx="4"/>
  <text class="t-title" x="740" y="106" text-anchor="middle">etcd 저장</text>
  <text class="t-sub" x="740" y="126" text-anchor="middle">EncryptionConfiguration · KMS v2</text>

  <!-- 파드 -->
  <rect class="box" x="350" y="270" width="220" height="64" rx="4"/>
  <text class="t-title" x="460" y="296" text-anchor="middle">파드에서 소비</text>
  <text class="t-sub" x="460" y="316" text-anchor="middle">tmpfs 볼륨(메모리)으로 마운트</text>

  <!-- ESO → Secret -->
  <polyline class="line" points="250,240 300,240 300,112 346,112" marker-end="url(#arrow42)"/>

  <!-- Secret → etcd -->
  <line class="line" x1="570" y1="112" x2="626" y2="112" marker-end="url(#arrow42)"/>

  <!-- Secret → 파드 (RBAC 게이트) -->
  <line class="line" x1="460" y1="144" x2="460" y2="266" marker-end="url(#arrow42)"/>
  <text class="t-lbl" x="474" y="196">RBAC로 읽기 권한 최소화</text>
  <text class="t-sub" x="474" y="214">(get·list·watch를 좁게)</text>

  <!-- 캡션 -->
  <text class="t-cap" x="450" y="402" text-anchor="middle">시크릿 보안은 한 겹이 아니라 층이다 — 원본은 외부 매니저에, 저장은 암호화로, 접근은 RBAC으로, 소비는 메모리로.</text>
  <text class="t-cap" x="450" y="424" text-anchor="middle">Git에는 어떤 형태로든 평문 시크릿을 두지 않는다 (대안: 외부 매니저 참조, Sealed Secrets, SOPS — 18장).</text>
</svg>
