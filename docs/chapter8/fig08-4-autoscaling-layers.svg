<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow84" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .layer { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-layer { font-size: 13px; font-weight: 700; fill: #333333; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
    .line-trig { stroke: #2456c4; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>

  <!-- Layer 1: HPA -->
  <rect class="layer" x="20" y="20" width="860" height="110" rx="6"/>
  <text class="t-layer" x="36" y="42">① 수평(HPA) — 8.3.9 · "파드 몇 개?"</text>

  <rect class="box" x="40" y="56" width="180" height="58" rx="4"/>
  <text class="t-title" x="130" y="80" text-anchor="middle">metrics-server</text>
  <text class="t-sub" x="130" y="98" text-anchor="middle">CPU·메모리 (4장)</text>

  <rect class="box" x="240" y="56" width="180" height="58" rx="4"/>
  <text class="t-title" x="330" y="80" text-anchor="middle">Prometheus Adapter</text>
  <text class="t-sub" x="330" y="98" text-anchor="middle">커스텀 메트릭 (8.3.10)</text>

  <line class="line" x1="420" y1="85" x2="466" y2="85" marker-end="url(#arrow84)"/>
  <line class="line" x1="220" y1="85" x2="466" y2="85"/>

  <rect class="box-accent" x="470" y="56" width="180" height="58" rx="4"/>
  <text class="t-title" x="560" y="80" text-anchor="middle">HorizontalPodAutoscaler</text>
  <text class="t-sub" x="560" y="98" text-anchor="middle">autoscaling/v2</text>

  <line class="line" x1="650" y1="85" x2="696" y2="85" marker-end="url(#arrow84)"/>

  <rect class="box" x="700" y="56" width="160" height="58" rx="4"/>
  <text class="t-title" x="780" y="80" text-anchor="middle">replicas 조정</text>
  <text class="t-sub" x="780" y="98" text-anchor="middle">Deployment</text>

  <!-- Layer 2: VPA -->
  <rect class="layer" x="20" y="150" width="860" height="110" rx="6"/>
  <text class="t-layer" x="36" y="172">② 수직(VPA) — 8.3.11 · "파드 하나가 얼마나?"</text>

  <rect class="box" x="40" y="186" width="220" height="58" rx="4"/>
  <text class="t-title" x="150" y="210" text-anchor="middle">과거 사용량 관찰</text>
  <text class="t-sub" x="150" y="228" text-anchor="middle">Recommender</text>

  <line class="line" x1="260" y1="215" x2="306" y2="215" marker-end="url(#arrow84)"/>

  <rect class="box-accent" x="310" y="186" width="220" height="58" rx="4"/>
  <text class="t-title" x="420" y="210" text-anchor="middle">VerticalPodAutoscaler</text>
  <text class="t-sub" x="420" y="228" text-anchor="middle">requests·limits 추천</text>

  <line class="line" x1="530" y1="215" x2="576" y2="215" marker-end="url(#arrow84)"/>

  <rect class="box" x="580" y="186" width="280" height="58" rx="4"/>
  <text class="t-title" x="720" y="206" text-anchor="middle">InPlaceOrRecreate</text>
  <text class="t-sub" x="720" y="224" text-anchor="middle">가능하면 재시작 없이 즉시 반영</text>
  <text class="t-sub" x="720" y="238" text-anchor="middle">(2026 기준 GA — 아래 갱신 주석)</text>

  <!-- Layer 3: Cluster -->
  <rect class="layer" x="20" y="280" width="860" height="110" rx="6"/>
  <text class="t-layer" x="36" y="302">③ 노드(클러스터 오토스케일러/Karpenter) · "노드 몇 대?"</text>

  <rect class="box" x="40" y="316" width="220" height="58" rx="4"/>
  <text class="t-title" x="150" y="340" text-anchor="middle">Pending 파드 감지</text>
  <text class="t-sub" x="150" y="358" text-anchor="middle">①②의 결과로 자원이 모자라면</text>

  <line class="line" x1="260" y1="345" x2="306" y2="345" marker-end="url(#arrow84)"/>

  <rect class="box-accent" x="310" y="316" width="240" height="58" rx="4"/>
  <text class="t-title" x="430" y="340" text-anchor="middle">Cluster Autoscaler / Karpenter</text>
  <text class="t-sub" x="430" y="358" text-anchor="middle">클라우드에 노드 요청</text>

  <line class="line" x1="550" y1="345" x2="596" y2="345" marker-end="url(#arrow84)"/>

  <rect class="box" x="600" y="316" width="260" height="58" rx="4"/>
  <text class="t-title" x="730" y="340" text-anchor="middle">새 노드 합류</text>
  <text class="t-sub" x="730" y="358" text-anchor="middle">Pending 파드가 스케줄됨</text>

  <!-- 계층 간 트리거 화살표 -->
  <path class="line-trig" d="M 780 114 C 780 145, 420 145, 420 182" marker-end="url(#arrow84)"/>
  <path class="line-trig" d="M 720 244 C 720 278, 420 278, 420 312" marker-end="url(#arrow84)"/>

  <text class="t-cap" x="450" y="420" text-anchor="middle">세 계층은 독립적이지만 서로를 촉발한다 — HPA가 파드를 늘리면(①) 자리가 없어져 노드가 늘고(③),</text>
  <text class="t-cap" x="450" y="442" text-anchor="middle">VPA가 파드 하나의 몫을 키우면(②) 마찬가지로 남는 자리가 줄어 노드 증설을 촉발할 수 있다.</text>
</svg>
