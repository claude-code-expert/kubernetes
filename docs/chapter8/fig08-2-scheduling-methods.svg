<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <style>
    .row { fill: none; stroke: #d8d8d8; stroke-width: 1; }
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .box-taint { fill: #ffffff; stroke: #b23b3b; stroke-width: 1.2; }
    .t-row { font-size: 14px; font-weight: 700; fill: #111111; }
    .t-title { font-size: 12.5px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .t-note { font-size: 11.5px; fill: #555555; }
  </style>

  <!-- Row 1: nodeSelector -->
  <rect class="row" x="20" y="20" width="860" height="120" rx="6"/>
  <text class="t-row" x="36" y="44">① 노드셀렉터 — 가장 단순, 파드 쪽에서 "이 레이블 노드만"</text>
  <rect class="box" x="36" y="58" width="160" height="66" rx="4"/>
  <text class="t-title" x="116" y="84" text-anchor="middle">파드 스펙</text>
  <text class="t-sub" x="116" y="102" text-anchor="middle">nodeSelector:</text>
  <text class="t-sub" x="116" y="116" text-anchor="middle">disktype: ssd</text>

  <rect class="box-accent" x="240" y="58" width="160" height="66" rx="4"/>
  <text class="t-title" x="320" y="84" text-anchor="middle">노드 A</text>
  <text class="t-sub" x="320" y="102" text-anchor="middle">disktype=ssd</text>
  <text class="t-sub" x="320" y="116" text-anchor="middle">→ 배치 가능</text>

  <rect class="box" x="440" y="58" width="160" height="66" rx="4"/>
  <text class="t-title" x="520" y="84" text-anchor="middle">노드 B</text>
  <text class="t-sub" x="520" y="102" text-anchor="middle">disktype=hdd</text>
  <text class="t-sub" x="520" y="116" text-anchor="middle">→ 배치 불가</text>

  <text class="t-note" x="640" y="90">동등 조건 매칭만 가능. 세밀한 규칙은 다음 두 방식으로.</text>

  <!-- Row 2: affinity/anti-affinity -->
  <rect class="row" x="20" y="160" width="860" height="130" rx="6"/>
  <text class="t-row" x="36" y="184">② 어피니티 / 안티-어피니티 — 파드 간 상대적 배치, 선호(soft) 또는 필수(hard)</text>

  <rect class="box-accent" x="36" y="200" width="180" height="72" rx="4"/>
  <text class="t-title" x="126" y="226" text-anchor="middle">캐시 파드</text>
  <text class="t-sub" x="126" y="244" text-anchor="middle">podAffinity:</text>
  <text class="t-sub" x="126" y="258" text-anchor="middle">"app=web과 같은 노드"</text>

  <rect class="box" x="260" y="200" width="180" height="72" rx="4"/>
  <text class="t-title" x="350" y="226" text-anchor="middle">web 파드</text>
  <text class="t-sub" x="350" y="248" text-anchor="middle">이미 배치됨</text>

  <rect class="box-accent" x="480" y="200" width="200" height="72" rx="4"/>
  <text class="t-title" x="580" y="226" text-anchor="middle">레플리카 파드끼리</text>
  <text class="t-sub" x="580" y="244" text-anchor="middle">podAntiAffinity:</text>
  <text class="t-sub" x="580" y="258" text-anchor="middle">"서로 다른 가용 영역"</text>

  <text class="t-note" x="720" y="240">고가용성 확보에</text>
  <text class="t-note" x="720" y="256">가장 흔히 쓰임</text>

  <!-- Row 3: taint/toleration -->
  <rect class="row" x="20" y="308" width="860" height="130" rx="6"/>
  <text class="t-row" x="36" y="332">③ 테인트 / 톨러레이션 — 노드 쪽에서 "허가된 파드만" (①②와 반대 방향)</text>

  <rect class="box-taint" x="36" y="348" width="200" height="72" rx="4"/>
  <text class="t-title" x="136" y="374" text-anchor="middle">GPU 노드</text>
  <text class="t-sub" x="136" y="392" text-anchor="middle">taint: gpu=true:NoSchedule</text>
  <text class="t-sub" x="136" y="406" text-anchor="middle">기본적으로 모든 파드 거부</text>

  <rect class="box" x="270" y="348" width="200" height="72" rx="4"/>
  <text class="t-title" x="370" y="374" text-anchor="middle">일반 파드</text>
  <text class="t-sub" x="370" y="392" text-anchor="middle">톨러레이션 없음</text>
  <text class="t-sub" x="370" y="406" text-anchor="middle">→ 이 노드에 못 감</text>

  <rect class="box-accent" x="504" y="348" width="220" height="72" rx="4"/>
  <text class="t-title" x="614" y="374" text-anchor="middle">GPU 학습 파드</text>
  <text class="t-sub" x="614" y="392" text-anchor="middle">toleration: gpu=true</text>
  <text class="t-sub" x="614" y="406" text-anchor="middle">→ 이 노드에 배치 가능</text>

  <text class="t-note" x="760" y="388">노드를 "특별한</text>
  <text class="t-note" x="760" y="404">용도로 예약"할 때</text>

  <text class="t-cap" x="450" y="452" text-anchor="middle">①②는 파드가 노드를 고르는 것, ③은 노드가 파드를 고르는 것 — 방향이 반대다.</text>
</svg>
