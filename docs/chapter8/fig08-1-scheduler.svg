<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow81" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .box-out { fill: #fafaf8; stroke: #d8d8d8; stroke-width: 1; }
    .t-title { font-size: 13.5px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 11px; fill: #555555; }
    .t-old { font-size: 11px; fill: #888888; font-style: italic; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <!-- 노드 후보 입력 -->
  <rect class="box-out" x="20" y="150" width="130" height="100" rx="4"/>
  <text class="t-title" x="85" y="178" text-anchor="middle">노드 5개</text>
  <text class="t-sub" x="85" y="198" text-anchor="middle">클러스터의</text>
  <text class="t-sub" x="85" y="214" text-anchor="middle">모든 노드</text>

  <line class="line" x1="150" y1="200" x2="196" y2="200" marker-end="url(#arrow81)"/>

  <!-- Filter 단계 -->
  <rect class="box-accent" x="200" y="120" width="240" height="160" rx="4"/>
  <text class="t-title" x="320" y="148" text-anchor="middle">Filter 단계</text>
  <text class="t-old" x="320" y="166" text-anchor="middle">(구 명칭: 프레디킷 Predicate)</text>
  <text class="t-sub" x="320" y="192" text-anchor="middle">true/false — 강한 제약조건</text>
  <text class="t-sub" x="320" y="212" text-anchor="middle">CPU·메모리 부족, 포트 충돌,</text>
  <text class="t-sub" x="320" y="230" text-anchor="middle">테인트 불허용 등</text>
  <text class="t-sub" x="320" y="256" text-anchor="middle">→ 못 쓸 노드는 여기서 탈락</text>

  <line class="line" x1="440" y1="200" x2="486" y2="200" marker-end="url(#arrow81)"/>

  <!-- Score 단계 -->
  <rect class="box-accent" x="490" y="120" width="240" height="160" rx="4"/>
  <text class="t-title" x="610" y="148" text-anchor="middle">Score 단계</text>
  <text class="t-old" x="610" y="166" text-anchor="middle">(구 명칭: 우선순위 Priority)</text>
  <text class="t-sub" x="610" y="192" text-anchor="middle">통과한 노드에 점수 매기기</text>
  <text class="t-sub" x="610" y="212" text-anchor="middle">여유 자원 많은 순, 분산 배치</text>
  <text class="t-sub" x="610" y="230" text-anchor="middle">선호도(affinity) 반영 등</text>
  <text class="t-sub" x="610" y="256" text-anchor="middle">→ 최고 점수 노드 선택</text>

  <line class="line" x1="730" y1="200" x2="776" y2="200" marker-end="url(#arrow81)"/>

  <!-- 결과 -->
  <rect class="box" x="780" y="150" width="100" height="100" rx="4"/>
  <text class="t-title" x="830" y="192" text-anchor="middle">배치</text>
  <text class="t-sub" x="830" y="212" text-anchor="middle">확정</text>

  <text class="t-cap" x="450" y="340" text-anchor="middle">쿠버네티스 스케줄러는 두 단계를 거친다 — 먼저 못 쓸 노드를 걸러내고(Filter), 남은 노드 중 최선을 고른다(Score).</text>
  <text class="t-cap" x="450" y="362" text-anchor="middle">원서의 "프레디킷·우선순위"는 옛 이름이다. 현재는 이 두 단계를 포함한 11개 확장점을 가진 스케줄링 프레임워크로 재구성되어 있다.</text>
</svg>
