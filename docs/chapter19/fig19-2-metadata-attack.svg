<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow192" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b23b3b"/>
    </marker>
    <marker id="arrow192-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-bad { fill: #ffffff; stroke: #b23b3b; stroke-width: 1.5; }
    .box-good { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-h { font-size: 13px; font-weight: 700; fill: #333333; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #b23b3b; stroke-width: 1.2; fill: none; }
    .line-block { stroke: #2456c4; stroke-width: 1.4; fill: none; }
  </style>

  <text class="t-h" x="20" y="28">공격 경로 — kubelet 미인증 API에서 클라우드 크리덴셜까지</text>

  <rect class="box-bad" x="20" y="42" width="200" height="70" rx="4"/>
  <text class="t-title" x="120" y="68" text-anchor="middle">공격자</text>
  <text class="t-sub" x="120" y="88" text-anchor="middle">파드 안에서 코드 실행 권한 획득</text>

  <line class="line" x1="220" y1="77" x2="266" y2="77" marker-end="url(#arrow192)"/>

  <rect class="box-bad" x="270" y="42" width="220" height="70" rx="4"/>
  <text class="t-title" x="380" y="68" text-anchor="middle">kubelet 미인증 API</text>
  <text class="t-sub" x="380" y="88" text-anchor="middle">기본값이 인증 없이 열려 있음</text>

  <line class="line" x1="490" y1="77" x2="536" y2="77" marker-end="url(#arrow192)"/>

  <rect class="box-bad" x="540" y="42" width="230" height="70" rx="4"/>
  <text class="t-title" x="655" y="68" text-anchor="middle">클라우드 메타데이터 API</text>
  <text class="t-sub" x="655" y="88" text-anchor="middle">169.254.169.254 — 노드 프로비저닝</text>
  <text class="t-sub" x="655" y="102" text-anchor="middle">크리덴셜 표출</text>

  <line class="line" x1="655" y1="112" x2="655" y2="150" marker-end="url(#arrow192)"/>

  <rect class="box-bad" x="540" y="154" width="230" height="60" rx="4"/>
  <text class="t-title" x="655" y="182" text-anchor="middle">클러스터 밖 클라우드 권한 탈취</text>
  <text class="t-sub" x="655" y="200" text-anchor="middle">파드 하나가 뚫려 클라우드 계정까지</text>

  <!-- 방어 -->
  <text class="t-h" x="20" y="252">방어 지점 두 곳</text>

  <rect class="box-good" x="270" y="266" width="220" height="70" rx="4"/>
  <text class="t-title" x="380" y="292" text-anchor="middle">① kubelet 인증·인가 강제</text>
  <text class="t-sub" x="380" y="312" text-anchor="middle">직접 구축 시 반드시 확인</text>
  <line class="line-block" x1="380" y1="266" x2="380" y2="118"/>

  <rect class="box-good" x="540" y="266" width="230" height="70" rx="4"/>
  <text class="t-title" x="655" y="292" text-anchor="middle">② 네트워크 정책으로 메타데이터</text>
  <text class="t-title" x="655" y="308" text-anchor="middle">엔드포인트 접근 차단</text>
  <polyline class="line-block" points="770,290 830,290 830,132 776,132" marker-end="url(#arrow192-blue)"/>

  <text class="t-cap" x="450" y="352" text-anchor="middle">파드 하나가 뚫리는 것과 클라우드 계정 전체가 뚫리는 것 사이의 유일한 방벽이 이 두 설정이다.</text>
</svg>
