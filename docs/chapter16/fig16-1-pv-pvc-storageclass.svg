<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow161" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .lane { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-lane { font-size: 13px; font-weight: 700; fill: #333333; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <!-- 정적 프로비저닝 -->
  <rect class="lane" x="20" y="20" width="860" height="150" rx="6"/>
  <text class="t-lane" x="36" y="44">정적(Static) 프로비저닝 — 관리자가 미리 만들어 둔다</text>

  <rect class="box" x="40" y="60" width="220" height="80" rx="4"/>
  <text class="t-title" x="150" y="86" text-anchor="middle">관리자가 직접</text>
  <text class="t-title" x="150" y="104" text-anchor="middle">PersistentVolume 생성</text>
  <text class="t-sub" x="150" y="124" text-anchor="middle">tier: silver 레이블</text>

  <line class="line" x1="260" y1="100" x2="316" y2="100" marker-end="url(#arrow161)"/>
  <text class="t-sub" x="288" y="88" text-anchor="middle">매칭</text>

  <rect class="box-accent" x="320" y="60" width="240" height="80" rx="4"/>
  <text class="t-title" x="440" y="86" text-anchor="middle">PersistentVolumeClaim</text>
  <text class="t-sub" x="440" y="106" text-anchor="middle">selector: tier=silver</text>
  <text class="t-sub" x="440" y="122" text-anchor="middle">요청 크기·접근 모드로 매칭</text>

  <line class="line" x1="560" y1="100" x2="616" y2="100" marker-end="url(#arrow161)"/>

  <rect class="box" x="620" y="60" width="220" height="80" rx="4"/>
  <text class="t-title" x="730" y="86" text-anchor="middle">파드에 마운트</text>
  <text class="t-sub" x="730" y="106" text-anchor="middle">클레임 크기·모드·레이블이</text>
  <text class="t-sub" x="730" y="122" text-anchor="middle">전부 일치해야 바인딩</text>

  <!-- 동적 프로비저닝 -->
  <rect class="lane" x="20" y="190" width="860" height="150" rx="6"/>
  <text class="t-lane" x="36" y="214">동적(Dynamic) 프로비저닝 — StorageClass가 그때그때 만든다</text>

  <rect class="box" x="40" y="230" width="220" height="80" rx="4"/>
  <text class="t-title" x="150" y="256" text-anchor="middle">StorageClass 정의</text>
  <text class="t-sub" x="150" y="276" text-anchor="middle">볼륨 플러그인(CSI 드라이버)</text>
  <text class="t-sub" x="150" y="292" text-anchor="middle">마운트 옵션 미리 지정</text>

  <line class="line" x1="260" y1="270" x2="316" y2="270" marker-end="url(#arrow161)"/>
  <text class="t-sub" x="288" y="258" text-anchor="middle">참조</text>

  <rect class="box-accent" x="320" y="230" width="240" height="80" rx="4"/>
  <text class="t-title" x="440" y="256" text-anchor="middle">PersistentVolumeClaim</text>
  <text class="t-sub" x="440" y="276" text-anchor="middle">storageClassName: fast-ssd</text>
  <text class="t-sub" x="440" y="292" text-anchor="middle">PV가 없으면 자동 생성 트리거</text>

  <line class="line" x1="560" y1="270" x2="616" y2="270" marker-end="url(#arrow161)"/>

  <rect class="box" x="620" y="230" width="220" height="80" rx="4"/>
  <text class="t-title" x="730" y="256" text-anchor="middle">PV 즉석 생성 + 마운트</text>
  <text class="t-sub" x="730" y="276" text-anchor="middle">관리자가 PV를 손으로</text>
  <text class="t-sub" x="730" y="292" text-anchor="middle">만들 필요 없음</text>

  <text class="t-cap" x="450" y="368" text-anchor="middle">클레임(PVC)은 두 경로 모두에서 파드가 실제로 참조하는 유일한 오브젝트다 —</text>
  <text class="t-cap" x="450" y="390" text-anchor="middle">개발자는 정적이든 동적이든 신경 쓸 필요 없이 "이만큼, 이런 모드로"만 선언한다.</text>
</svg>
