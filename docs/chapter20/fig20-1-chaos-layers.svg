<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow201" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-h { font-size: 13px; font-weight: 700; fill: #333333; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <text class="t-h" x="20" y="26">카오스 테스팅 3계층 (20.1.3~20.1.5) — 목표는 "실패를 기대하며 관찰"</text>

  <rect class="box" x="20" y="40" width="270" height="80" rx="4"/>
  <text class="t-title" x="155" y="66" text-anchor="middle">① 통신 카오스</text>
  <text class="t-sub" x="155" y="88" text-anchor="middle">레이턴시·연결 끊김 주입</text>
  <text class="t-sub" x="155" y="104" text-anchor="middle">클라이언트-서비스 사이</text>

  <rect class="box" x="315" y="40" width="270" height="80" rx="4"/>
  <text class="t-title" x="450" y="66" text-anchor="middle">② 작동 카오스</text>
  <text class="t-sub" x="450" y="88" text-anchor="middle">노드 장애·자원 과부하</text>
  <text class="t-sub" x="450" y="104" text-anchor="middle">인프라 층 (5장 Chaos Mesh)</text>

  <rect class="box" x="610" y="40" width="270" height="80" rx="4"/>
  <text class="t-title" x="745" y="66" text-anchor="middle">③ 퍼즈 테스팅</text>
  <text class="t-sub" x="745" y="88" text-anchor="middle">무작위 입력으로 보안·복원성</text>
  <text class="t-sub" x="745" y="104" text-anchor="middle">장애가 아니라 취약점 발견</text>

  <line x1="20" y1="146" x2="880" y2="146" stroke="#d8d8d8" stroke-dasharray="2 4"/>

  <text class="t-h" x="20" y="174">① 통신 카오스를 주입하는 두 가지 방식</text>

  <rect class="box" x="20" y="190" width="410" height="200" rx="6"/>
  <text class="t-title" x="225" y="214" text-anchor="middle">수동 프록시 교체 (원서 방식 — Toxiproxy)</text>
  <rect class="box" x="40" y="230" width="150" height="46" rx="4"/>
  <text class="t-sub" x="115" y="252" text-anchor="middle">서비스명 변경</text>
  <text class="t-sub" x="115" y="266" text-anchor="middle">backend→backend-real</text>
  <line class="line" x1="190" y1="253" x2="216" y2="253" marker-end="url(#arrow201)"/>
  <rect class="box" x="220" y="230" width="190" height="46" rx="4"/>
  <text class="t-sub" x="315" y="252" text-anchor="middle">toxiproxy 파드를</text>
  <text class="t-sub" x="315" y="266" text-anchor="middle">backend 이름으로 새로 배치</text>
  <text class="t-sub" x="225" y="302" text-anchor="middle">서비스마다 이름 바꾸기 + 프록시 파드 배포</text>
  <text class="t-sub" x="225" y="320" text-anchor="middle">반복 필요 — 세밀한 제어(정확히 2000ms</text>
  <text class="t-sub" x="225" y="336" text-anchor="middle">지연 같은)엔 여전히 유용</text>
  <text class="t-sub" x="225" y="358" text-anchor="middle">서비스 메시가 없는 환경에 적합</text>

  <rect class="box-accent" x="460" y="190" width="420" height="200" rx="6"/>
  <text class="t-title" x="670" y="214" text-anchor="middle">서비스 메시 네이티브 (2026 기준 우선 검토)</text>
  <rect class="box" x="480" y="230" width="380" height="46" rx="4"/>
  <text class="t-sub" x="670" y="252" text-anchor="middle">HTTPRoute / VirtualService에 fault 필드 선언</text>
  <text class="t-sub" x="670" y="266" text-anchor="middle">서비스명 변경도, 별도 파드도 불필요</text>
  <text class="t-sub" x="670" y="302" text-anchor="middle">9장의 앰비언트 메시가 이미 있다면</text>
  <text class="t-sub" x="670" y="320" text-anchor="middle">선언 한 줄로 지연·중단을 주입</text>
  <text class="t-sub" x="670" y="342" text-anchor="middle">서비스 늘어나도 관리 부담 그대로</text>
  <text class="t-sub" x="670" y="364" text-anchor="middle">(수동 방식은 서비스 수만큼 반복)</text>

  <text class="t-cap" x="450" y="410" text-anchor="middle">둘 다 "네트워크를 일부러 망가뜨린다"는 목적은 같다 — 이미 메시가 있다면 그 기능을 먼저 쓰는 게 합리적이다.</text>
</svg>
