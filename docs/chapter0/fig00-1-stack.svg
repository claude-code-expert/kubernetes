<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .outer { fill: #ffffff; stroke: #444444; stroke-width: 1.2; }
    .vm { fill: #fafaf8; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .node { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-h { font-size: 13px; font-weight: 700; fill: #333333; }
    .t-title { font-size: 13.5px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 11px; fill: #555555; }
    .t-lbl { font-size: 12px; font-weight: 600; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <!-- macOS -->
  <rect class="outer" x="20" y="20" width="860" height="370" rx="6"/>
  <text class="t-h" x="40" y="46">macOS (Apple Silicon / Intel)</text>

  <!-- kubectl -->
  <rect class="box-accent" x="50" y="141" width="150" height="64" rx="4"/>
  <text class="t-title" x="125" y="167" text-anchor="middle">kubectl</text>
  <text class="t-sub" x="125" y="185" text-anchor="middle">명령 · YAML 제출</text>

  <!-- 컨테이너 런타임 VM -->
  <rect class="vm" x="260" y="66" width="590" height="304" rx="6"/>
  <text class="t-h" x="276" y="92">컨테이너 런타임 VM — OrbStack / Docker Desktop / Colima</text>

  <!-- kind 노드 1: control-plane -->
  <rect class="node" x="290" y="108" width="530" height="118" rx="4"/>
  <text class="t-sub" x="302" y="128">kind 노드 ① control-plane — 실체는 도커 컨테이너 1개</text>
  <rect class="box" x="310" y="142" width="170" height="62" rx="4"/>
  <text class="t-title" x="395" y="168" text-anchor="middle">API 서버</text>
  <text class="t-sub" x="395" y="186" text-anchor="middle">모든 요청의 관문</text>
  <rect class="box" x="500" y="142" width="140" height="62" rx="4"/>
  <text class="t-title" x="570" y="168" text-anchor="middle">etcd</text>
  <text class="t-sub" x="570" y="186" text-anchor="middle">상태 저장소</text>
  <rect class="box" x="660" y="142" width="140" height="62" rx="4"/>
  <text class="t-title" x="730" y="168" text-anchor="middle">스케줄러 등</text>
  <text class="t-sub" x="730" y="186" text-anchor="middle">컨트롤 플레인</text>

  <!-- kind 노드 2: worker -->
  <rect class="node" x="290" y="244" width="530" height="112" rx="4"/>
  <text class="t-sub" x="302" y="264">kind 노드 ② worker — 역시 도커 컨테이너 1개</text>
  <rect class="box" x="310" y="278" width="150" height="60" rx="4"/>
  <text class="t-title" x="385" y="302" text-anchor="middle">파드 hello-1</text>
  <text class="t-sub" x="385" y="320" text-anchor="middle">nginx 컨테이너</text>
  <rect class="box" x="480" y="278" width="150" height="60" rx="4"/>
  <text class="t-title" x="555" y="302" text-anchor="middle">파드 hello-2</text>
  <text class="t-sub" x="555" y="320" text-anchor="middle">nginx 컨테이너</text>
  <rect class="box" x="650" y="278" width="150" height="60" rx="4"/>
  <text class="t-title" x="725" y="302" text-anchor="middle">kubelet</text>
  <text class="t-sub" x="725" y="320" text-anchor="middle">노드 에이전트</text>

  <!-- kubectl → API 서버 -->
  <line class="line" x1="200" y1="173" x2="306" y2="173" marker-end="url(#arrow01)"/>
  <text class="t-lbl" x="228" y="160" text-anchor="middle">API 호출</text>

  <!-- 캡션 -->
  <text class="t-cap" x="450" y="420" text-anchor="middle">kind에서는 "노드"조차 컨테이너다. 클러스터 전체가 도커 컨테이너 몇 개로 내 맥 안에서 돌아간다.</text>
</svg>
