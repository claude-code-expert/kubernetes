<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .row { fill: none; stroke: #d8d8d8; stroke-width: 1; }
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-row { font-size: 13.5px; font-weight: 700; fill: #111111; }
    .t-title { font-size: 12.5px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <!-- ClusterIP -->
  <rect class="row" x="20" y="20" width="860" height="90" rx="6"/>
  <text class="t-row" x="36" y="44">ClusterIP (기본값) — 클러스터 내부에서만</text>
  <rect class="box" x="36" y="56" width="140" height="42" rx="4"/>
  <text class="t-sub" x="106" y="81" text-anchor="middle">클러스터 밖</text>
  <text class="t-sub" x="106" y="94" text-anchor="middle" fill="#b23b3b">접근 불가</text>
  <line class="line" x1="176" y1="77" x2="216" y2="77" marker-end="url(#arrow91)" stroke-dasharray="3 3"/>
  <rect class="box-accent" x="220" y="56" width="160" height="42" rx="4"/>
  <text class="t-title" x="300" y="81" text-anchor="middle">가상 IP (내부 전용)</text>
  <line class="line" x1="380" y1="77" x2="420" y2="77" marker-end="url(#arrow91)"/>
  <rect class="box" x="424" y="56" width="140" height="42" rx="4"/>
  <text class="t-sub" x="494" y="81" text-anchor="middle">파드</text>
  <text class="t-sub" x="660" y="81" text-anchor="middle">1장 부록 A에서 내부 동작 상세</text>

  <!-- NodePort -->
  <rect class="row" x="20" y="122" width="860" height="90" rx="6"/>
  <text class="t-row" x="36" y="146">NodePort — 모든 노드의 고정 포트(30000~32767) 개방</text>
  <rect class="box" x="36" y="158" width="140" height="42" rx="4"/>
  <text class="t-sub" x="106" y="183" text-anchor="middle">외부 클라이언트</text>
  <line class="line" x1="176" y1="179" x2="216" y2="179" marker-end="url(#arrow91)"/>
  <rect class="box-accent" x="220" y="158" width="160" height="42" rx="4"/>
  <text class="t-title" x="300" y="176" text-anchor="middle">노드IP:30080</text>
  <text class="t-sub" x="300" y="192" text-anchor="middle">모든 노드 동일 포트</text>
  <line class="line" x1="380" y1="179" x2="420" y2="179" marker-end="url(#arrow91)"/>
  <rect class="box" x="424" y="158" width="140" height="42" rx="4"/>
  <text class="t-sub" x="494" y="183" text-anchor="middle">파드</text>
  <text class="t-sub" x="660" y="183" text-anchor="middle">노드 IP 노출 — 보통 프로덕션 진입점 X</text>

  <!-- LoadBalancer -->
  <rect class="row" x="20" y="224" width="860" height="90" rx="6"/>
  <text class="t-row" x="36" y="248">LoadBalancer — 클라우드가 실제 LB를 대신 만들어 줌</text>
  <rect class="box" x="36" y="260" width="140" height="42" rx="4"/>
  <text class="t-sub" x="106" y="285" text-anchor="middle">외부 클라이언트</text>
  <line class="line" x1="176" y1="281" x2="216" y2="281" marker-end="url(#arrow91)"/>
  <rect class="box-accent" x="220" y="260" width="160" height="42" rx="4"/>
  <text class="t-title" x="300" y="278" text-anchor="middle">클라우드 LB</text>
  <text class="t-sub" x="300" y="294" text-anchor="middle">외부 IP 자동 할당</text>
  <line class="line" x1="380" y1="281" x2="420" y2="281" marker-end="url(#arrow91)"/>
  <rect class="box" x="424" y="260" width="140" height="42" rx="4"/>
  <text class="t-sub" x="494" y="285" text-anchor="middle">파드</text>
  <text class="t-sub" x="660" y="285" text-anchor="middle">서비스마다 LB 1개 — 여러 개면 비용 급증</text>

  <!-- ExternalName -->
  <rect class="row" x="20" y="326" width="860" height="90" rx="6"/>
  <text class="t-row" x="36" y="350">ExternalName — 프록시 없이 DNS만 바꿔치기 (CNAME)</text>
  <rect class="box" x="36" y="362" width="140" height="42" rx="4"/>
  <text class="t-sub" x="106" y="387" text-anchor="middle">클러스터 내부 파드</text>
  <line class="line" x1="176" y1="383" x2="216" y2="383" marker-end="url(#arrow91)"/>
  <rect class="box-accent" x="220" y="362" width="160" height="42" rx="4"/>
  <text class="t-title" x="300" y="380" text-anchor="middle">DNS CNAME 응답</text>
  <text class="t-sub" x="300" y="396" text-anchor="middle">IP·프록시 개입 없음</text>
  <line class="line" x1="380" y1="383" x2="420" y2="383" marker-end="url(#arrow91)" stroke-dasharray="3 3"/>
  <rect class="box" x="424" y="362" width="180" height="42" rx="4"/>
  <text class="t-sub" x="514" y="387" text-anchor="middle">클러스터 밖 DB 등</text>
  <text class="t-sub" x="700" y="383" text-anchor="middle">실사용은 드묾</text>

  <text class="t-cap" x="450" y="450" text-anchor="middle">넷 다 "안정적인 이름"이라는 목표는 같다 — 무엇을 노출하고, 누가 그 노출을 대신 만들어 주는지가 다르다.</text>
</svg>
