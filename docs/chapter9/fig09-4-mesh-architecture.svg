<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow94" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .lane { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-app { fill: #ffffff; stroke: #3a8a5c; stroke-width: 1.2; }
    .box-proxy { fill: #fafaf8; stroke: #2456c4; stroke-width: 1.2; }
    .box-node { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 3 3; }
    .t-lane { font-size: 13px; font-weight: 700; fill: #111111; }
    .t-old { font-size: 11px; fill: #888888; }
    .t-title { font-size: 12px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10px; fill: #555555; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.1; fill: none; }
  </style>

  <!-- 왼쪽: 사이드카 모델 -->
  <rect class="lane" x="20" y="20" width="410" height="330" rx="6"/>
  <text class="t-lane" x="36" y="44">사이드카 모델 (전통 방식)</text>
  <text class="t-old" x="36" y="60">원서 서술: Mixer·Pilot·Galley·Citadel</text>

  <!-- 노드 1 -->
  <rect class="box-node" x="40" y="76" width="180" height="130" rx="4"/>
  <text class="t-sub" x="52" y="94">노드 1</text>
  <rect class="box-app" x="52" y="102" width="150" height="42" rx="4"/>
  <text class="t-title" x="127" y="126" text-anchor="middle">파드: 앱 A</text>
  <rect class="box-proxy" x="52" y="150" width="150" height="42" rx="4"/>
  <text class="t-title" x="127" y="174" text-anchor="middle">Envoy 사이드카</text>

  <!-- 노드 2 -->
  <rect class="box-node" x="240" y="76" width="180" height="130" rx="4"/>
  <text class="t-sub" x="252" y="94">노드 2</text>
  <rect class="box-app" x="252" y="102" width="150" height="42" rx="4"/>
  <text class="t-title" x="327" y="126" text-anchor="middle">파드: 앱 B</text>
  <rect class="box-proxy" x="252" y="150" width="150" height="42" rx="4"/>
  <text class="t-title" x="327" y="174" text-anchor="middle">Envoy 사이드카</text>

  <text class="t-sub" x="230" y="230" text-anchor="middle">파드마다 프록시 컨테이너 1개 — 파드 수만큼 자원 소모</text>
  <text class="t-sub" x="230" y="248" text-anchor="middle">주입 시점(재시작)에만 사이드카 적용 가능</text>

  <!-- istiod -->
  <rect class="box" x="140" y="270" width="180" height="50" rx="4"/>
  <text class="t-title" x="230" y="292" text-anchor="middle">istiod (통합 컨트롤 플레인)</text>
  <text class="t-sub" x="230" y="308" text-anchor="middle">Mixer는 폐지, Pilot·Galley·Citadel 통합됨</text>

  <!-- 오른쪽: 앰비언트 모델 -->
  <rect class="lane" x="460" y="20" width="420" height="330" rx="6"/>
  <text class="t-lane" x="476" y="44">앰비언트 모드 (Istio 1.24 GA, 2026 기본 권장)</text>
  <text class="t-old" x="476" y="60">ztunnel(L4) + 선택적 waypoint(L7)</text>

  <!-- 노드 1 (ambient) -->
  <rect class="box-node" x="480" y="76" width="200" height="150" rx="4"/>
  <text class="t-sub" x="492" y="94">노드 1</text>
  <rect class="box-app" x="492" y="102" width="80" height="42" rx="4"/>
  <text class="t-title" x="532" y="126" text-anchor="middle">앱 A</text>
  <rect class="box-app" x="584" y="102" width="80" height="42" rx="4"/>
  <text class="t-title" x="624" y="126" text-anchor="middle">앱 A'</text>
  <text class="t-sub" x="578" y="160" text-anchor="middle">사이드카 없음 — 순수 앱 컨테이너만</text>
  <rect class="box-proxy" x="492" y="176" width="172" height="38" rx="4"/>
  <text class="t-title" x="578" y="200" text-anchor="middle">ztunnel (노드당 1개, DaemonSet)</text>

  <!-- 노드 2 (ambient) -->
  <rect class="box-node" x="700" y="76" width="160" height="150" rx="4"/>
  <text class="t-sub" x="712" y="94">노드 2</text>
  <rect class="box-app" x="712" y="102" width="136" height="42" rx="4"/>
  <text class="t-title" x="780" y="126" text-anchor="middle">앱 B</text>
  <rect class="box-proxy" x="712" y="176" width="136" height="38" rx="4"/>
  <text class="t-title" x="780" y="200" text-anchor="middle">ztunnel</text>

  <line class="line" x1="664" y1="195" x2="700" y2="195" marker-end="url(#arrow94)"/>
  <text class="t-sub" x="682" y="185" text-anchor="middle" font-size="9">mTLS</text>

  <!-- waypoint (선택) -->
  <rect class="box-proxy" x="580" y="236" width="180" height="40" rx="4" stroke-dasharray="3 3"/>
  <text class="t-title" x="670" y="254" text-anchor="middle">waypoint (선택, 네임스페이스당)</text>
  <text class="t-sub" x="670" y="268" text-anchor="middle">L7 라우팅·재시도·세밀한 인가가 필요할 때만</text>

  <!-- istiod -->
  <rect class="box" x="580" y="290" width="180" height="40" rx="4"/>
  <text class="t-title" x="670" y="308" text-anchor="middle">istiod</text>
  <text class="t-sub" x="670" y="322" text-anchor="middle">동일 컨트롤 플레인</text>

  <text class="t-sub" x="670" y="336" text-anchor="middle" font-size="9"> </text>

  <!-- 캡션 -->
  <rect class="box" x="40" y="370" width="820" height="130" rx="6"/>
  <text class="t-title" x="60" y="394">무엇이 바뀌었나</text>
  <text class="t-sub" x="60" y="416">자원 소모 — 파드마다 프록시를 두지 않고 노드마다 하나(ztunnel)만 두어 메모리·CPU 오버헤드를 크게 줄인다.</text>
  <text class="t-sub" x="60" y="436">무중단 적용 — 사이드카 주입처럼 파드 재시작이 필요 없다. 기존 워크로드에 그대로 적용된다.</text>
  <text class="t-sub" x="60" y="456">단계적 도입 — 기본은 L4(mTLS·기본 인가)만 켜고, HTTP 라우팅 같은 L7 기능이 필요한 네임스페이스에만 waypoint를 얹는다.</text>
  <text class="t-sub" x="60" y="476">컨트롤 플레인은 그대로 — istiod 하나가 양쪽 모드를 다 관리한다. 원서가 나열한 Mixer는 2020년(1.5)에 이미 폐지됐다.</text>

  <text class="t-cap" x="450" y="512" text-anchor="middle">둘 다 같은 것(mTLS·관찰성·트래픽 제어)을 하지만, 오른쪽이 2026년 현재 신규 도입의 기본 선택지다.</text>
</svg>
