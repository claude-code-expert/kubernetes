<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow211" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrow211b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .cp { fill: #fafaf8; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-lbl { font-size: 11.5px; font-weight: 600; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
    .line-watch { stroke: #2456c4; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>

  <!-- 유저 -->
  <rect class="box" x="20" y="150" width="140" height="70" rx="4"/>
  <text class="t-title" x="90" y="180" text-anchor="middle">유저</text>
  <text class="t-sub" x="90" y="198" text-anchor="middle">CRUD 커맨드</text>

  <line class="line" x1="160" y1="185" x2="206" y2="185" marker-end="url(#arrow211)"/>

  <!-- 컨트롤 플레인 -->
  <rect class="cp" x="210" y="40" width="300" height="320" rx="6"/>
  <text class="t-sub" x="226" y="62">컨트롤 플레인</text>

  <rect class="box" x="230" y="76" width="260" height="70" rx="4"/>
  <text class="t-title" x="360" y="102" text-anchor="middle">K8s API 서버</text>
  <text class="t-sub" x="360" y="120" text-anchor="middle">CRUD 요청 처리 · 검증(21.5)</text>

  <line class="line" x1="360" y1="146" x2="360" y2="182" marker-end="url(#arrow211)"/>

  <rect class="box" x="230" y="186" width="260" height="70" rx="4"/>
  <text class="t-title" x="360" y="212" text-anchor="middle">etcd</text>
  <text class="t-sub" x="360" y="230" text-anchor="middle">커스텀 리소스도 여기 저장</text>

  <!-- 감시: 오퍼레이터 → API 서버 -->
  <path class="line-watch" d="M 620 190 C 550 190, 530 140, 494 115" marker-end="url(#arrow211b)"/>
  <text class="t-lbl" x="570" y="170" text-anchor="middle">① 와처(Watch)</text>

  <!-- 생성/수정: 오퍼레이터 → API 서버 -->
  <path class="line" d="M 620 250 C 560 250, 530 130, 494 107" marker-end="url(#arrow211)"/>
  <text class="t-sub" x="560" y="270" text-anchor="middle">② 생성 · 수정 (CRUD)</text>

  <!-- 오퍼레이터 -->
  <rect class="box-accent" x="620" y="150" width="260" height="140" rx="6"/>
  <text class="t-title" x="750" y="180" text-anchor="middle">커스텀 리소스 오퍼레이터</text>
  <text class="t-sub" x="750" y="202" text-anchor="middle">관심 있는 리소스의 이벤트를</text>
  <text class="t-sub" x="750" y="218" text-anchor="middle">계속 감시(Watch)</text>
  <text class="t-sub" x="750" y="240" text-anchor="middle">이벤트 발생 시 Reconcile 실행</text>
  <text class="t-sub" x="750" y="256" text-anchor="middle">→ 의도한 상태로 조정</text>
  <text class="t-sub" x="750" y="272" text-anchor="middle">(그림 21-2)</text>

  <text class="t-cap" x="450" y="392" text-anchor="middle">유저는 API 서버에만 말을 건다 — 오퍼레이터는 그 결과를 옆에서 지켜보다가 스스로 개입하는 제3의 행위자다.</text>
</svg>
