<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-title { font-size: 14px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 11.5px; fill: #555555; }
    .t-side { font-size: 12px; fill: #555555; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <!-- Deployment -->
  <rect class="box-accent" x="270" y="20" width="180" height="56" rx="4"/>
  <text class="t-title" x="360" y="44" text-anchor="middle">Deployment</text>
  <text class="t-sub" x="360" y="63" text-anchor="middle">frontend · replicas: 3</text>
  <text class="t-side" x="470" y="50">이미지·버전 교체, 롤아웃 담당</text>

  <!-- ReplicaSet -->
  <rect class="box" x="270" y="118" width="180" height="56" rx="4"/>
  <text class="t-title" x="360" y="142" text-anchor="middle">ReplicaSet</text>
  <text class="t-sub" x="360" y="161" text-anchor="middle">파드 수 유지 담당</text>
  <text class="t-side" x="470" y="148">파드가 죽으면 새로 채운다</text>

  <!-- 연결: Deployment → ReplicaSet -->
  <line class="line" x1="360" y1="76" x2="360" y2="114" marker-end="url(#arrow)"/>

  <!-- 버스 라인: ReplicaSet → Pods -->
  <line class="line" x1="360" y1="174" x2="360" y2="200"/>
  <line class="line" x1="130" y1="200" x2="590" y2="200"/>
  <line class="line" x1="130" y1="200" x2="130" y2="226" marker-end="url(#arrow)"/>
  <line class="line" x1="360" y1="200" x2="360" y2="226" marker-end="url(#arrow)"/>
  <line class="line" x1="590" y1="200" x2="590" y2="226" marker-end="url(#arrow)"/>

  <!-- Pods -->
  <rect class="box" x="60" y="230" width="140" height="52" rx="4"/>
  <text class="t-title" x="130" y="252" text-anchor="middle">Pod</text>
  <text class="t-sub" x="130" y="270" text-anchor="middle">frontend-abc12</text>

  <rect class="box" x="290" y="230" width="140" height="52" rx="4"/>
  <text class="t-title" x="360" y="252" text-anchor="middle">Pod</text>
  <text class="t-sub" x="360" y="270" text-anchor="middle">frontend-def34</text>

  <rect class="box" x="520" y="230" width="140" height="52" rx="4"/>
  <text class="t-title" x="590" y="252" text-anchor="middle">Pod</text>
  <text class="t-sub" x="590" y="270" text-anchor="middle">frontend-ghi56</text>

  <text class="t-side" x="360" y="314" text-anchor="middle">사용자는 Deployment만 다루면 된다. ReplicaSet과 Pod는 Deployment가 만들어 관리한다.</text>
</svg>
