<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow102" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-axis { font-size: 12px; font-weight: 700; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.4; fill: none; }
  </style>

  <!-- 축 -->
  <line class="line" x1="60" y1="200" x2="840" y2="200" marker-end="url(#arrow102)"/>
  <text class="t-axis" x="450" y="230" text-anchor="middle">격리 강도 · 오버헤드 증가 →</text>

  <!-- runc -->
  <rect class="box" x="40" y="90" width="180" height="90" rx="4"/>
  <text class="t-title" x="130" y="118" text-anchor="middle">runc (기본값)</text>
  <text class="t-sub" x="130" y="138" text-anchor="middle">네임스페이스 + cgroup</text>
  <text class="t-sub" x="130" y="154" text-anchor="middle">커널을 호스트와 공유</text>
  <line class="line" x1="130" y1="180" x2="130" y2="196"/>

  <!-- gVisor -->
  <rect class="box" x="260" y="90" width="180" height="90" rx="4"/>
  <text class="t-title" x="350" y="118" text-anchor="middle">gVisor</text>
  <text class="t-sub" x="350" y="138" text-anchor="middle">유저 공간 커널이</text>
  <text class="t-sub" x="350" y="154" text-anchor="middle">시스템 콜을 가로챔</text>
  <line class="line" x1="350" y1="180" x2="350" y2="196"/>

  <!-- Kata -->
  <rect class="box" x="480" y="90" width="180" height="90" rx="4"/>
  <text class="t-title" x="570" y="118" text-anchor="middle">카타 컨테이너</text>
  <text class="t-sub" x="570" y="138" text-anchor="middle">경량 VM — 컨테이너처럼</text>
  <text class="t-sub" x="570" y="154" text-anchor="middle">쓰지만 커널은 별도</text>
  <line class="line" x1="570" y1="180" x2="570" y2="196"/>

  <!-- Firecracker -->
  <rect class="box-accent" x="700" y="90" width="180" height="90" rx="4"/>
  <text class="t-title" x="790" y="118" text-anchor="middle">파이어크래커</text>
  <text class="t-sub" x="790" y="138" text-anchor="middle">KVM 기반 마이크로VM</text>
  <text class="t-sub" x="790" y="154" text-anchor="middle">가장 강한 격리</text>
  <line class="line" x1="790" y1="180" x2="790" y2="196"/>

  <!-- 지정 방법 -->
  <rect class="box" x="260" y="250" width="380" height="66" rx="4"/>
  <text class="t-title" x="450" y="274" text-anchor="middle">파드 스펙에서 지정</text>
  <text class="t-sub" x="450" y="294" text-anchor="middle">spec.runtimeClassName: gvisor</text>
  <text class="t-sub" x="450" y="308" text-anchor="middle">클러스터 관리자가 미리 RuntimeClass를 등록해 둬야 함</text>

  <text class="t-cap" x="450" y="336" text-anchor="middle" font-size="12" fill="#444">신뢰할 수 없는 코드를 돌릴수록 오른쪽으로 — 단, 워크로드마다 다른 런타임을 섞으면 운영 복잡도가 커진다(10.2.3).</text>
</svg>
