<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .hdr { fill: #f7f7f5; stroke: #c8c8c8; stroke-width: 1; }
    .t-title { font-size: 13px; font-weight: 700; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-hdr { font-size: 12.5px; font-weight: 700; fill: #333333; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .t-cell { font-size: 10.5px; fill: #555555; }
  </style>

  <!-- 축 제목 -->
  <text class="t-hdr" x="20" y="26">보안 수준 (얼마나 엄격한가)</text>
  <text class="t-hdr" x="700" y="26" text-anchor="end">활성화 모드 (위반 시 무엇을 하는가)</text>

  <!-- 열 헤더: enforce / warn / audit -->
  <rect class="hdr" x="220" y="40" width="220" height="40" rx="4"/>
  <text class="t-title" x="330" y="65" text-anchor="middle">enforce</text>
  <rect class="hdr" x="450" y="40" width="220" height="40" rx="4"/>
  <text class="t-title" x="560" y="65" text-anchor="middle">warn</text>
  <rect class="hdr" x="680" y="40" width="200" height="40" rx="4"/>
  <text class="t-title" x="780" y="65" text-anchor="middle">audit</text>

  <!-- 행: privileged -->
  <rect class="hdr" x="20" y="88" width="190" height="90" rx="4"/>
  <text class="t-title" x="115" y="118" text-anchor="middle">privileged</text>
  <text class="t-sub" x="115" y="138" text-anchor="middle">제한 없음</text>
  <text class="t-sub" x="115" y="154" text-anchor="middle">(클러스터 기본값)</text>

  <rect class="box" x="220" y="88" width="220" height="90" rx="4"/>
  <text class="t-cell" x="330" y="130" text-anchor="middle">위반 파드도</text>
  <text class="t-cell" x="330" y="146" text-anchor="middle">그냥 생성됨</text>
  <rect class="box" x="450" y="88" width="220" height="90" rx="4"/>
  <text class="t-cell" x="560" y="130" text-anchor="middle">경고할 것도</text>
  <text class="t-cell" x="560" y="146" text-anchor="middle">없음</text>
  <rect class="box" x="680" y="88" width="200" height="90" rx="4"/>
  <text class="t-cell" x="780" y="130" text-anchor="middle">기록할 것도</text>
  <text class="t-cell" x="780" y="146" text-anchor="middle">없음</text>

  <!-- 행: baseline -->
  <rect class="hdr" x="20" y="182" width="190" height="90" rx="4"/>
  <text class="t-title" x="115" y="212" text-anchor="middle">baseline</text>
  <text class="t-sub" x="115" y="232" text-anchor="middle">권한 상승 등</text>
  <text class="t-sub" x="115" y="248" text-anchor="middle">주요 취약점 차단</text>

  <rect class="box" x="220" y="182" width="220" height="90" rx="4"/>
  <text class="t-cell" x="330" y="224" text-anchor="middle">위반 파드</text>
  <text class="t-cell" x="330" y="240" text-anchor="middle">생성 거부</text>
  <rect class="box" x="450" y="182" width="220" height="90" rx="4"/>
  <text class="t-cell" x="560" y="224" text-anchor="middle">생성은 되지만</text>
  <text class="t-cell" x="560" y="240" text-anchor="middle">경고 메시지 표시</text>
  <rect class="box" x="680" y="182" width="200" height="90" rx="4"/>
  <text class="t-cell" x="780" y="224" text-anchor="middle">감사 로그에만</text>
  <text class="t-cell" x="780" y="240" text-anchor="middle">기록</text>

  <!-- 행: restricted -->
  <rect class="hdr" x="20" y="276" width="190" height="90" rx="4"/>
  <text class="t-title" x="115" y="306" text-anchor="middle">restricted</text>
  <text class="t-sub" x="115" y="326" text-anchor="middle">현재 파드 보안</text>
  <text class="t-sub" x="115" y="342" text-anchor="middle">모범 사례 전체</text>

  <rect class="box-accent" x="220" y="276" width="220" height="90" rx="4"/>
  <text class="t-cell" x="330" y="312" text-anchor="middle" font-weight="700">신규 네임스페이스에</text>
  <text class="t-cell" x="330" y="328" text-anchor="middle" font-weight="700">권장하는 조합</text>
  <text class="t-cell" x="330" y="344" text-anchor="middle">기존 네임스페이스는</text>
  <text class="t-cell" x="330" y="358" text-anchor="middle">warn·audit로 먼저 검증</text>
  <rect class="box" x="450" y="276" width="220" height="90" rx="4"/>
  <text class="t-cell" x="560" y="318" text-anchor="middle">전환 전 점검 단계로</text>
  <text class="t-cell" x="560" y="334" text-anchor="middle">흔히 사용</text>
  <rect class="box" x="680" y="276" width="200" height="90" rx="4"/>
  <text class="t-cell" x="780" y="318" text-anchor="middle">영향 범위 파악</text>
  <text class="t-cell" x="780" y="334" text-anchor="middle">단계에 유용</text>

  <text class="t-cap" x="450" y="398" text-anchor="middle">세 수준 × 세 모드를 자유롭게 조합한다 — 같은 네임스페이스에 enforce=baseline, warn=restricted처럼 겹쳐 걸 수도 있다.</text>
</svg>
