<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="루프백 바인딩일 때 스크레이프 실패, 0.0.0.0 바인딩일 때 성공하는 비교">
