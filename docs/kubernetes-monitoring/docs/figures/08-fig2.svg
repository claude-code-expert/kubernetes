<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="애플리케이션 표준 출력에서 Alloy를 거쳐 로키에 저장되고 그라파나가 조회하는 경로">
      <rect width="960" height="300" fill="#ffffff"/>

      <rect x="24" y="60" width="200" height="90" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="40" y="88" font-size="13.5" fill="#15181d">애플리케이션</text>
      <text x="40" y="112" font-size="11.5" fill="#585f6b">표준 출력에 로그를 쓴다</text>
      <text x="40" y="132" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">System.out / Logback</text>

      <path d="M226 105 L286 105" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#k1)"/>

      <rect x="288" y="60" width="200" height="90" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="304" y="88" font-size="13.5" fill="#15181d">컨테이너 런타임</text>
      <text x="304" y="112" font-size="11.5" fill="#585f6b">노드 디스크에 파일로 보관</text>
      <text x="304" y="132" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">/var/log/pods/...</text>

      <path d="M490 105 L550 105" fill="none" stroke="#b4621a" stroke-width="1.5" marker-end="url(#k2)"/>

      <rect x="552" y="60" width="200" height="90" fill="#ffffff" stroke="#b4621a" stroke-width="1.5"/>
      <text x="568" y="88" font-size="13.5" fill="#15181d">Alloy</text>
      <text x="568" y="112" font-size="11.5" fill="#585f6b">DaemonSet · 노드마다 1개</text>
      <text x="568" y="132" font-size="11.5" fill="#585f6b">라벨을 붙여 밀어 넣는다</text>

      <path d="M754 105 L814 105" fill="none" stroke="#b4621a" stroke-width="1.5" marker-end="url(#k2)"/>

      <rect x="816" y="60" width="120" height="90" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="876" y="98" text-anchor="middle" font-size="13.5" fill="#15181d">Loki</text>
      <text x="876" y="120" text-anchor="middle" font-size="11.5" fill="#585f6b">단일 바이너리</text>
      <text x="876" y="138" text-anchor="middle" font-size="11.5" fill="#585f6b">파일시스템 저장</text>

      <rect x="552" y="196" width="384" height="64" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="568" y="222" font-size="13.5" fill="#15181d">Grafana</text>
      <text x="568" y="244" font-size="11.5" fill="#585f6b">LogQL로 조회 — 프로메테우스와 같은 화면에서</text>

      <path d="M876 152 L876 194" fill="none" stroke="#1f4d8f" stroke-width="1.5" marker-end="url(#k3)"/>

      <text x="24" y="222" font-size="12.5" fill="#15181d">애플리케이션은 로그를</text>
      <text x="24" y="244" font-size="12.5" fill="#15181d">어디로도 보내지 않는다</text>
      <text x="24" y="268" font-size="12" fill="#585f6b">메트릭과 같은 원칙이다</text>

      <defs>
        <marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#585f6b"/>
        </marker>
        <marker id="k2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#b4621a"/>
        </marker>
        <marker id="k3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#1f4d8f"/>
        </marker>
      </defs>
    </svg>