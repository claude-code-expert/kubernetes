<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="macOS에서 브라우저가 NodePort로 그라파나에 도달하는 경로">
      <rect width="960" height="340" fill="#ffffff"/>

      <!-- 브라우저 -->
      <rect x="24" y="128" width="150" height="64" fill="#f5f6f7" stroke="#585f6b" stroke-width="1.5"/>
      <text x="99" y="154" text-anchor="middle" font-size="13.5" fill="#15181d">브라우저</text>
      <text x="99" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#585f6b">127.0.0.1:30300</text>

      <path d="M176 160 L226 160" fill="none" stroke="#6a4a9c" stroke-width="1.5" marker-end="url(#a1)"/>

      <!-- Docker VM -->
      <rect x="228" y="52" width="708" height="240" fill="none" stroke="#9aa1ad" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="244" y="42" font-family="ui-monospace,monospace" font-size="12" fill="#585f6b">Docker Desktop VM (Apple Virtualization)</text>

      <!-- control-plane 컨테이너 -->
      <rect x="252" y="88" width="238" height="168" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="268" y="112" font-family="ui-monospace,monospace" font-size="12.5" fill="#1f4d8f">obs-control-plane</text>
      <line x1="252" y1="124" x2="490" y2="124" stroke="#d8dbe0" stroke-width="1"/>
      <text x="268" y="148" font-family="ui-monospace,monospace" font-size="12" fill="#15181d">:30300 (extraPortMapping)</text>
      <rect x="268" y="166" width="204" height="42" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="370" y="192" text-anchor="middle" font-size="12.5" fill="#15181d">kube-proxy</text>
      <text x="268" y="232" font-size="11.5" fill="#585f6b">NodePort 규칙으로 목적지 재작성</text>

      <path d="M492 187 L560 187" fill="none" stroke="#6a4a9c" stroke-width="1.5" marker-end="url(#a1)"/>
      <text x="526" y="177" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6a4a9c">파드 IP</text>

      <!-- worker2 컨테이너 -->
      <rect x="562" y="88" width="238" height="168" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="578" y="112" font-family="ui-monospace,monospace" font-size="12.5" fill="#1f4d8f">obs-worker2</text>
      <line x1="562" y1="124" x2="800" y2="124" stroke="#d8dbe0" stroke-width="1"/>
      <rect x="578" y="152" width="204" height="56" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="680" y="176" text-anchor="middle" font-size="13" fill="#15181d">Grafana 파드</text>
      <text x="680" y="195" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" fill="#585f6b">containerPort 3000</text>
      <text x="578" y="232" font-size="11.5" fill="#585f6b">파드는 어느 노드에 있어도 된다</text>

      <!-- 하단 설명 -->
      <text x="252" y="284" font-size="12" fill="#585f6b">호스트 30300 → 컨테이너 30300 → NodePort 서비스 → 파드 3000</text>

      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#6a4a9c"/>
        </marker>
      </defs>
    </svg>