<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="계속 증가하는 카운터 그래프와 rate 적용 후의 초당 증가량 그래프 비교">
      <rect width="960" height="330" fill="#ffffff"/>

      <text x="60" y="34" font-size="13" fill="#15181d">원본 카운터 — <tspan font-family="ui-monospace,monospace" font-size="12">orders_created_total</tspan></text>
      <line x1="60" y1="150" x2="600" y2="150" stroke="#585f6b" stroke-width="1.2"/>
      <line x1="60" y1="50" x2="60" y2="150" stroke="#585f6b" stroke-width="1.2"/>
      <polyline points="60,142 128,142 128,130 196,130 196,112 264,112 264,104 332,104 332,84 400,84 400,72 468,72 468,60 536,60 536,56 600,56"
                fill="none" stroke="#1f4d8f" stroke-width="1.8"/>
      <text x="612" y="60" font-size="12" fill="#585f6b">계속 증가하기만 한다</text>
      <text x="612" y="80" font-size="12" fill="#585f6b">"지금 트래픽이 많은가"를</text>
      <text x="612" y="100" font-size="12" fill="#585f6b">읽어낼 수 없다</text>

      <text x="60" y="204" font-size="13" fill="#15181d">rate() 적용 — <tspan font-family="ui-monospace,monospace" font-size="12">rate(orders_created_total[2m])</tspan></text>
      <line x1="60" y1="300" x2="600" y2="300" stroke="#585f6b" stroke-width="1.2"/>
      <line x1="60" y1="220" x2="60" y2="300" stroke="#585f6b" stroke-width="1.2"/>
      <polyline points="60,278 128,278 196,262 264,286 332,244 400,258 468,250 536,272 600,264"
                fill="none" stroke="#2e7d4f" stroke-width="1.8"/>
      <text x="612" y="240" font-size="12" fill="#585f6b">초당 증가량 — 트래픽의 모양</text>
      <text x="612" y="260" font-size="12" fill="#585f6b">파드가 재시작해 카운터가</text>
      <text x="612" y="280" font-size="12" fill="#585f6b">0으로 돌아가도 보정해준다</text>
    </svg>