<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .t-title { font-size: 13.5px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 11px; fill: #555555; }
    .t-step { font-size: 11.5px; font-weight: 700; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <text class="t-step" x="115" y="58" text-anchor="middle">STEP 1</text>
  <rect class="box" x="20" y="70" width="190" height="86" rx="4"/>
  <text class="t-title" x="115" y="100" text-anchor="middle">신원 인증</text>
  <text class="t-sub" x="115" y="120" text-anchor="middle">인증서 발급, 또는</text>
  <text class="t-sub" x="115" y="137" text-anchor="middle">OIDC · 클라우드 IAM 연동</text>

  <line class="line" x1="210" y1="113" x2="246" y2="113" marker-end="url(#arrow22)"/>

  <text class="t-step" x="345" y="58" text-anchor="middle">STEP 2</text>
  <rect class="box" x="250" y="70" width="190" height="86" rx="4"/>
  <text class="t-title" x="345" y="100" text-anchor="middle">kubeconfig 전달</text>
  <text class="t-sub" x="345" y="120" text-anchor="middle">접속 프로필(컨텍스트)</text>
  <text class="t-sub" x="345" y="137" text-anchor="middle">사용자 로컬에 설치</text>

  <line class="line" x1="440" y1="113" x2="476" y2="113" marker-end="url(#arrow22)"/>

  <text class="t-step" x="575" y="58" text-anchor="middle">STEP 3</text>
  <rect class="box" x="480" y="70" width="190" height="86" rx="4"/>
  <text class="t-title" x="575" y="100" text-anchor="middle">네임스페이스 생성</text>
  <text class="t-sub" x="575" y="120" text-anchor="middle">담당자 애너테이션 부착</text>
  <text class="t-sub" x="575" y="137" text-anchor="middle">리소스쿼터 · TTL 지정</text>

  <line class="line" x1="670" y1="113" x2="706" y2="113" marker-end="url(#arrow22)"/>

  <text class="t-step" x="795" y="58" text-anchor="middle">STEP 4</text>
  <rect class="box-accent" x="710" y="70" width="170" height="86" rx="4"/>
  <text class="t-title" x="795" y="100" text-anchor="middle">권한 부여</text>
  <text class="t-sub" x="795" y="120" text-anchor="middle">RoleBinding으로 해당</text>
  <text class="t-sub" x="795" y="137" text-anchor="middle">네임스페이스만 edit</text>

  <text class="t-cap" x="450" y="210" text-anchor="middle">네 단계를 스크립트 하나로 묶는다. "신입이 30분 안에 첫 배포" 같은 온보딩 KPI는 자동화 없이는 지킬 수 없다.</text>
  <text class="t-cap" x="450" y="232" text-anchor="middle">권한은 클러스터 전체가 아니라 자기 네임스페이스 범위로만 — 격리가 곧 안전이다.</text>
</svg>
