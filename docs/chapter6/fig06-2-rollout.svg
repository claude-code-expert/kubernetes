<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrow62b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .box-dim { fill: #fafaf8; stroke: #d8d8d8; stroke-width: 1; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-hash { font-size: 10px; font-family: monospace; fill: #2456c4; }
    .t-note { font-size: 12px; font-weight: 600; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
    .line-back { stroke: #2456c4; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
  </style>

  <!-- Deployment -->
  <rect class="box-accent" x="350" y="20" width="200" height="60" rx="4"/>
  <text class="t-title" x="450" y="45" text-anchor="middle">Deployment: frontend</text>
  <text class="t-sub" x="450" y="64" text-anchor="middle">image: journal:v1.5.9</text>

  <line class="line" x1="450" y1="80" x2="450" y2="108" marker-end="url(#arrow62)"/>

  <!-- ReplicaSet 이력 3개 -->
  <rect class="box-dim" x="60" y="112" width="230" height="100" rx="4"/>
  <text class="t-title" x="175" y="136" text-anchor="middle">ReplicaSet rev.1</text>
  <text class="t-hash" x="175" y="154" text-anchor="middle">pod-template-hash: 7c9f4</text>
  <text class="t-sub" x="175" y="172" text-anchor="middle">v1.5.7 · replicas: 0</text>
  <text class="t-sub" x="175" y="190" text-anchor="middle">(보관 중 — revisionHistoryLimit)</text>

  <rect class="box-dim" x="335" y="112" width="230" height="100" rx="4"/>
  <text class="t-title" x="450" y="136" text-anchor="middle">ReplicaSet rev.2</text>
  <text class="t-hash" x="450" y="154" text-anchor="middle">pod-template-hash: a12de</text>
  <text class="t-sub" x="450" y="172" text-anchor="middle">v1.5.8 · replicas: 0</text>
  <text class="t-sub" x="450" y="190" text-anchor="middle">(보관 중)</text>

  <rect class="box-accent" x="610" y="112" width="230" height="100" rx="4"/>
  <text class="t-title" x="725" y="136" text-anchor="middle">ReplicaSet rev.3</text>
  <text class="t-hash" x="725" y="154" text-anchor="middle">pod-template-hash: f930b</text>
  <text class="t-sub" x="725" y="172" text-anchor="middle">v1.5.9 · replicas: 4</text>
  <text class="t-note" x="725" y="190" text-anchor="middle">현재 활성</text>

  <line class="line" x1="290" y1="162" x2="331" y2="162" marker-end="url(#arrow62)"/>
  <line class="line" x1="565" y1="162" x2="606" y2="162" marker-end="url(#arrow62)"/>

  <!-- rollout undo -->
  <path class="line-back" d="M 725 216 C 725 254, 175 254, 175 216" marker-end="url(#arrow62b)"/>
  <text class="t-note" x="450" y="272" text-anchor="middle">kubectl rollout undo — 직전 ReplicaSet을 다시 확장</text>

  <!-- maxSurge/maxUnavailable 인셋 -->
  <rect class="box" x="60" y="312" width="780" height="130" rx="6"/>
  <text class="t-title" x="80" y="336">전환 중 파드 수 — maxSurge: 25% · maxUnavailable: 25% (기본값)</text>

  <text class="t-sub" x="80" y="362">rev.2 (구버전)</text>
  <rect class="box-dim" x="80" y="370" width="26" height="26" rx="3"/>
  <rect class="box-dim" x="112" y="370" width="26" height="26" rx="3"/>
  <rect class="box-dim" x="144" y="370" width="26" height="26" rx="3"/>
  <text class="t-sub" x="220" y="388">3개 유지 (4개 중 1개까지만 동시 중단 허용)</text>

  <text class="t-sub" x="500" y="362">rev.3 (신버전)</text>
  <rect class="box-accent" x="500" y="370" width="26" height="26" rx="3"/>
  <text class="t-sub" x="620" y="388">1개 먼저 추가 (surge — 총합이 잠깐 5개까지 늘어남)</text>

  <text class="t-sub" x="80" y="422">→ 이 비율이 클수록 전환은 빠르지만 신버전 결함의 영향 범위도 커진다.</text>

  <text class="t-cap" x="450" y="458" text-anchor="middle">디플로이먼트 하나 뒤에는 리비전마다 ReplicaSet이 새로 생긴다 — 롤백은 되돌리는 게 아니라 "이전 리비전을 다시 키우는" 동작이다.</text>
</svg>
