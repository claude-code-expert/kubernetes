<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .group { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-shared { font-size: 10.5px; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .t-cmd { font-size: 12px; font-family: monospace; fill: #2456c4; }
    .line { stroke: #2456c4; stroke-width: 1.2; fill: none; }
  </style>

  <!-- 릴리스 그룹 프레임 -->
  <rect class="group" x="30" y="20" width="840" height="230" rx="6"/>
  <text class="t-sub" x="46" y="42">release: journal-stable · release-number: 34e57f01 · app: journal (세 리소스 공통)</text>

  <rect class="box" x="60" y="60" width="230" height="150" rx="4"/>
  <text class="t-title" x="175" y="88" text-anchor="middle">Deployment</text>
  <text class="t-title" x="175" y="106" text-anchor="middle">journal-web</text>
  <text class="t-shared" x="175" y="128" text-anchor="middle">공통: release · release-number</text>
  <text class="t-sub" x="175" y="148" text-anchor="middle">고유: component=web</text>
  <text class="t-sub" x="175" y="166" text-anchor="middle">ver=1.5.9</text>
  <text class="t-sub" x="175" y="188" text-anchor="middle">strategy: RollingUpdate</text>

  <rect class="box" x="335" y="60" width="230" height="150" rx="4"/>
  <text class="t-title" x="450" y="88" text-anchor="middle">Deployment</text>
  <text class="t-title" x="450" y="106" text-anchor="middle">journal-db</text>
  <text class="t-shared" x="450" y="128" text-anchor="middle">공통: release · release-number</text>
  <text class="t-sub" x="450" y="148" text-anchor="middle">고유: component=db</text>
  <text class="t-sub" x="450" y="166" text-anchor="middle">ver=5.7</text>
  <text class="t-sub" x="450" y="188" text-anchor="middle">strategy: Recreate (상태 보유)</text>

  <rect class="box" x="610" y="60" width="230" height="150" rx="4"/>
  <text class="t-title" x="725" y="88" text-anchor="middle">Job</text>
  <text class="t-title" x="725" y="106" text-anchor="middle">journal-db-backup</text>
  <text class="t-shared" x="725" y="128" text-anchor="middle">공통: release · release-number</text>
  <text class="t-sub" x="725" y="148" text-anchor="middle">고유: component=backup</text>
  <text class="t-sub" x="725" y="166" text-anchor="middle">batch/v1</text>
  <text class="t-sub" x="725" y="188" text-anchor="middle">1회성 실행</text>

  <!-- 조회 명령 -->
  <line class="line" x1="450" y1="254" x2="450" y2="290" marker-end="url(#arrow63)"/>
  <rect class="box-accent" x="220" y="294" width="460" height="56" rx="4"/>
  <text class="t-cmd" x="450" y="328" text-anchor="middle">kubectl get all -l release=journal-stable</text>

  <text class="t-cap" x="450" y="380" text-anchor="middle">각 리소스는 자기 종류(컴포넌트·버전)를 가리키는 레이블과, 릴리스 전체를 가리키는 공통 레이블을 함께 가진다 — 후자가 "이 배포 묶음 전체"를 한 번에 조회·롤백하는 손잡이가 된다.</text>
</svg>
