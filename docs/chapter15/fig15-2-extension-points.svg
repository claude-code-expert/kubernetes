<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow152" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .box-app { fill: #ffffff; stroke: #3a8a5c; stroke-width: 1.2; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-eg { font-size: 10.5px; font-weight: 600; fill: #2456c4; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <!-- ① 사이드카 -->
  <rect class="box" x="20" y="30" width="270" height="170" rx="6"/>
  <text class="t-title" x="155" y="54" text-anchor="middle">① 사이드카</text>
  <rect class="box" x="40" y="66" width="230" height="80" rx="4"/>
  <text class="t-sub" x="155" y="86" text-anchor="middle">파드</text>
  <rect class="box-app" x="55" y="96" width="90" height="36" rx="3"/>
  <text class="t-sub" x="100" y="118" text-anchor="middle">메인 앱</text>
  <rect class="box-accent" x="155" y="96" width="100" height="36" rx="3"/>
  <text class="t-sub" x="205" y="118" text-anchor="middle">사이드카</text>
  <text class="t-sub" x="155" y="164" text-anchor="middle">메인 컨테이너 옆에 부가 기능을</text>
  <text class="t-sub" x="155" y="180" text-anchor="middle">덧붙인다 (mTLS, 캐싱 등)</text>
  <text class="t-eg" x="155" y="196" text-anchor="middle">예: Dapr (CNCF)</text>

  <!-- ② 어드미션 컨트롤러 -->
  <rect class="box" x="315" y="30" width="270" height="170" rx="6"/>
  <text class="t-title" x="450" y="54" text-anchor="middle">② 어드미션 컨트롤러</text>
  <rect class="box" x="335" y="76" width="100" height="50" rx="4"/>
  <text class="t-sub" x="385" y="96" text-anchor="middle">API 서버로</text>
  <text class="t-sub" x="385" y="112" text-anchor="middle">제출된 오브젝트</text>
  <line class="line" x1="435" y1="101" x2="471" y2="101" marker-end="url(#arrow152)"/>
  <rect class="box-accent" x="475" y="76" width="100" height="50" rx="4"/>
  <text class="t-sub" x="525" y="96" text-anchor="middle">검사·변형</text>
  <text class="t-sub" x="525" y="112" text-anchor="middle">(11장 참고)</text>
  <text class="t-sub" x="450" y="154" text-anchor="middle">모범 사례 강제, 사이드카 자동 주입</text>
  <text class="t-sub" x="450" y="170" text-anchor="middle">개발자는 존재조차 몰라도 됨</text>
  <text class="t-eg" x="450" y="188" text-anchor="middle">예: 리소스 미지정 파드 거부(린팅)</text>

  <!-- ③ CRD -->
  <rect class="box" x="610" y="30" width="270" height="170" rx="6"/>
  <text class="t-title" x="745" y="54" text-anchor="middle">③ CRD + 제어 루프</text>
  <rect class="box-accent" x="630" y="70" width="230" height="44" rx="4"/>
  <text class="t-sub" x="745" y="96" text-anchor="middle">ReplicatedService (예시)</text>
  <line class="line" x1="745" y1="114" x2="745" y2="134" marker-end="url(#arrow152)"/>
  <rect class="box" x="630" y="138" width="230" height="44" rx="4"/>
  <text class="t-sub" x="745" y="164" text-anchor="middle">Deployment + Service 자동 생성</text>

  <!-- 하단: 세 접점 공통 설명 -->
  <rect class="box" x="20" y="230" width="860" height="100" rx="6"/>
  <text class="t-title" x="40" y="256">세 접점의 공통점 — 개발자가 몰라도 되게 만든다</text>
  <text class="t-sub" x="40" y="280">사이드카는 파드 옆에, 어드미션 컨트롤러는 제출 순간에, CRD는 아예 새로운 어휘로 끼어든다 — 방식은 다르지만</text>
  <text class="t-sub" x="40" y="298">전부 "개발자가 복잡함을 직접 다루지 않아도 되게 한다"는 15.1절의 확장(extend) 전략을 구현하는 손잡이다.</text>
  <text class="t-sub" x="40" y="316">셋을 조합하면(예: CRD로 새 리소스 정의 + 어드미션 컨트롤러로 기본값 주입) 더 강력한 추상화가 된다.</text>

  <text class="t-cap" x="450" y="362" text-anchor="middle">쿠버네티스 UX 자체를 넓히는 kubectl 플러그인·Headlamp 같은 도구(15.2.2)는 이 접점들 위에 사람이 보는 층을 씌운다.</text>
</svg>
