<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow71" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c8c8c8; stroke-width: 1; }
    .box-accent { fill: #ffffff; stroke: #2456c4; stroke-width: 1.5; }
    .lane { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; }
    .t-lane { font-size: 12.5px; font-weight: 700; fill: #333333; }
    .t-title { font-size: 13px; font-weight: 600; fill: #111111; }
    .t-sub { font-size: 10.5px; fill: #555555; }
    .t-cap { font-size: 12.5px; fill: #444444; }
    .line { stroke: #444444; stroke-width: 1.2; fill: none; }
  </style>

  <!-- 7.1 이미지 분산 -->
  <text class="t-lane" x="20" y="30">7.1 이미지 분산 배포 — 한 번 빌드, 지역별 레지스트리로 복제</text>

  <rect class="box-accent" x="20" y="46" width="180" height="70" rx="4"/>
  <text class="t-title" x="110" y="72" text-anchor="middle">이미지 빌드 1회</text>
  <text class="t-sub" x="110" y="92" text-anchor="middle">journal:1.5.9-34e57f0</text>

  <line class="line" x1="200" y1="81" x2="236" y2="81" marker-end="url(#arrow71)"/>

  <rect class="box" x="240" y="46" width="620" height="70" rx="4"/>
  <text class="t-title" x="550" y="72" text-anchor="middle">지리 복제 레지스트리 (자동 동기화)</text>
  <text class="t-sub" x="550" y="92" text-anchor="middle">리전마다 이미지를 다시 빌드하지 않는다</text>

  <!-- 3개 리전 레지스트리 -->
  <line class="line" x1="360" y1="116" x2="360" y2="140"/>
  <line class="line" x1="250" y1="140" x2="850" y2="140"/>
  <line class="line" x1="330" y1="140" x2="330" y2="160" marker-end="url(#arrow71)"/>
  <line class="line" x1="550" y1="140" x2="550" y2="160" marker-end="url(#arrow71)"/>
  <line class="line" x1="770" y1="140" x2="770" y2="160" marker-end="url(#arrow71)"/>

  <rect class="box" x="250" y="164" width="160" height="50" rx="4"/>
  <text class="t-title" x="330" y="194" text-anchor="middle">us-east 레지스트리</text>

  <rect class="box" x="470" y="164" width="160" height="50" rx="4"/>
  <text class="t-title" x="550" y="194" text-anchor="middle">eu-west 레지스트리</text>

  <rect class="box" x="690" y="164" width="160" height="50" rx="4"/>
  <text class="t-title" x="770" y="194" text-anchor="middle">ap-ne 레지스트리</text>

  <!-- 구분선 -->
  <line class="line" x1="20" y1="240" x2="880" y2="240" stroke-dasharray="2 4"/>

  <!-- 7.2 배포 파라미터화 -->
  <text class="t-lane" x="20" y="266">7.2 배포 파라미터화 — 같은 이미지, 리전마다 다른 구성</text>

  <line class="line" x1="330" y1="214" x2="330" y2="300" marker-end="url(#arrow71)"/>
  <line class="line" x1="550" y1="214" x2="550" y2="300" marker-end="url(#arrow71)"/>
  <line class="line" x1="770" y1="214" x2="770" y2="300" marker-end="url(#arrow71)"/>

  <rect class="box" x="250" y="304" width="160" height="90" rx="4"/>
  <text class="t-title" x="330" y="328" text-anchor="middle">us-east 배포</text>
  <text class="t-sub" x="330" y="348" text-anchor="middle">replicas: 12</text>
  <text class="t-sub" x="330" y="364" text-anchor="middle">region: us-east</text>

  <rect class="box" x="470" y="304" width="160" height="90" rx="4"/>
  <text class="t-title" x="550" y="328" text-anchor="middle">eu-west 배포</text>
  <text class="t-sub" x="550" y="348" text-anchor="middle">replicas: 6</text>
  <text class="t-sub" x="550" y="364" text-anchor="middle">locale: de-DE 기본값</text>

  <rect class="box" x="690" y="304" width="160" height="90" rx="4"/>
  <text class="t-title" x="770" y="328" text-anchor="middle">ap-ne 배포</text>
  <text class="t-sub" x="770" y="348" text-anchor="middle">replicas: 4</text>
  <text class="t-sub" x="770" y="364" text-anchor="middle">data-residency: jp</text>

  <text class="t-cap" x="450" y="412" text-anchor="middle">이미지는 하나로 고정하고(불변 태그), 헬름 values나 Kustomize 오버레이로 리전별 차이만 분리한다.</text>
</svg>
