apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
spec:
  replicas: 3
  selector:
    matchLabels: {app: order-api}
  template:
    metadata:
      labels: {app: order-api}
    spec:
      containers:
        - name: order-api
          image: order-api        # 태그·레지스트리는 overlay 가 정한다
          ports:
            - containerPort: 8080
