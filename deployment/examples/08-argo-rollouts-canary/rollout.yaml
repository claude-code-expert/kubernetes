# 3부 3회차 · Argo Rollouts 카나리, 트래픽 라우터 없이 (kind v1.37, Argo Rollouts v1.10.0 에서 확인)
# 라우터가 없으면 가중치를 파드 수로 맞춘다: 10개 중 20% = 2개
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web-canary
spec:
  replicas: 10
  selector:
    matchLabels: {app: web-canary}
  template:
    metadata:
      labels: {app: web-canary}
    spec:
      containers:
        - name: web
          image: nginx:1.26
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 2}
  strategy:
    canary:
      canaryService: web-canary-canary   # 카나리 파드만 가리키는 서비스 (판정, 직접 호출용)
      stableService: web-canary-stable   # 안정 버전만 가리키는 서비스
      maxSurge: "25%"                    # 단계 사이 파드를 바꿀 때 쓰는 값 (Deployment와 같은 뜻)
      maxUnavailable: 0
      steps:
        - setWeight: 20                  # 라우터가 없으면 10개 중 2개를 새 버전으로
        - pause: {}                      # 시간 없이 멈춤 → promote 해야 다음 단계
        - setWeight: 50
        - pause: {duration: 20s}         # 20초 뒤 자동으로 다음 단계
---
apiVersion: v1
kind: Service
metadata: {name: web-canary-stable}
spec: {selector: {app: web-canary}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: web-canary-canary}
spec: {selector: {app: web-canary}, ports: [{port: 80}]}
