# 3부 2회차 · Argo Rollouts 블루/그린 (kind v1.37, Argo Rollouts v1.10.0 에서 확인)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web-bg
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: web-bg}
  template:
    metadata:
      labels: {app: web-bg}
    spec:
      containers:
        - name: web
          image: nginx:1.26
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 2}
  strategy:
    blueGreen:
      activeService: web-bg-active      # 실제 사용자 트래픽
      previewService: web-bg-preview    # 그린만 따로 보는 주소
      autoPromotionEnabled: false       # promote 해야 전환 (기본 true)
      scaleDownDelaySeconds: 600        # 전환 뒤 블루를 10분 남김 (기본 30)
---
apiVersion: v1
kind: Service
metadata: {name: web-bg-active}
spec:
  selector: {app: web-bg}               # 컨트롤러가 pod-template-hash 를 덧붙여 관리
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web-bg-preview}
spec:
  selector: {app: web-bg}
  ports: [{port: 80}]
