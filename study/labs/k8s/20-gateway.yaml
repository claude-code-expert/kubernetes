apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: obs-study
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: obs-study
    spec:
      nodeSelector:
        workload: apps
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: obs/gateway:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # 02단계에서 ${ORDER_API_URI:...} 로 열어둔 자리.
            # 클러스터 안에서는 서비스 이름이 곧 DNS 이름이다.
            - name: ORDER_API_URI
              value: http://order-api.apps.svc.cluster.local:8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: obs-study
spec:
  # 01단계에서 뚫어둔 호스트 포트 30080과 짝을 이룬다
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
