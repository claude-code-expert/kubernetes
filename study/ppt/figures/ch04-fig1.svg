<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="오퍼레이터가 ServiceMonitor를 읽어 프로메테우스 설정을 생성하고, 프로메테우스가 대상을 스크레이프하는 흐름">
      <rect width="960" height="340" fill="#ffffff"/>

      <rect x="24" y="52" width="212" height="96" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="40" y="78" font-size="13.5" fill="#15181d">1. 사람이 선언</text>
      <text x="40" y="100" font-family="ui-monospace,monospace" font-size="11.5" fill="#585f6b">ServiceMonitor</text>
      <text x="40" y="120" font-family="ui-monospace,monospace" font-size="11.5" fill="#585f6b">PrometheusRule</text>
      <text x="40" y="140" font-size="11.5" fill="#585f6b">kubectl apply</text>

      <path d="M238 100 L296 100" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#q1)"/>

      <rect x="298" y="52" width="212" height="96" fill="#ffffff" stroke="#6a4a9c" stroke-width="1.5"/>
      <text x="314" y="78" font-size="13.5" fill="#15181d">2. 오퍼레이터</text>
      <text x="314" y="100" font-size="11.5" fill="#585f6b">CRD를 감시하다가</text>
      <text x="314" y="120" font-size="11.5" fill="#585f6b">스크레이프 설정을 만들어</text>
      <text x="314" y="140" font-size="11.5" fill="#585f6b">Secret으로 저장</text>

      <path d="M512 100 L570 100" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#q1)"/>

      <rect x="572" y="52" width="212" height="96" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="588" y="78" font-size="13.5" fill="#15181d">3. 프로메테우스</text>
      <text x="588" y="100" font-size="11.5" fill="#585f6b">설정을 리로드하고</text>
      <text x="588" y="120" font-size="11.5" fill="#585f6b">직접 HTTP 요청을 보내</text>
      <text x="588" y="140" font-size="11.5" fill="#585f6b">메트릭을 가져온다</text>

      <path d="M678 150 L678 196" fill="none" stroke="#2e7d4f" stroke-width="1.5" marker-end="url(#q2)"/>
      <text x="690" y="178" font-family="ui-monospace,monospace" font-size="11" fill="#2e7d4f">GET /metrics</text>

      <rect x="572" y="198" width="212" height="62" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="588" y="224" font-size="13" fill="#15181d">타깃 (파드·노드·컨트롤 플레인)</text>
      <text x="588" y="246" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">여기서 실패하면 up == 0</text>

      <line x1="24" y1="286" x2="936" y2="286" stroke="#d8dbe0" stroke-width="1"/>
      <text x="24" y="312" font-size="12.5" fill="#15181d">타깃이 안 보일 때 의심할 곳: ① 선언이 잘못됨 ② 오퍼레이터가 선택하지 않음 ③ 네트워크·인증 실패</text>

      <defs>
        <marker id="q1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#585f6b"/>
        </marker>
        <marker id="q2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#2e7d4f"/>
        </marker>
      </defs>
    </svg>
