<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-label="UI에서 편집하고 JSON으로 내보내 ConfigMap으로 저장하는 순환 흐름">
      <rect width="960" height="240" fill="#ffffff"/>

      <rect x="24" y="60" width="196" height="72" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="40" y="88" font-size="13" fill="#15181d">1. UI에서 편집</text>
      <text x="40" y="112" font-size="11.5" fill="#585f6b">패널·질의를 눈으로 조정</text>

      <path d="M222 96 L272 96" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#v1)"/>

      <rect x="274" y="60" width="196" height="72" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="290" y="88" font-size="13" fill="#15181d">2. JSON 내보내기</text>
      <text x="290" y="112" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">Export → Save to file</text>

      <path d="M472 96 L522 96" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#v1)"/>

      <rect x="524" y="60" width="196" height="72" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="540" y="88" font-size="13" fill="#15181d">3. ConfigMap 갱신</text>
      <text x="540" y="112" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">git commit → apply</text>

      <path d="M722 96 L772 96" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#v1)"/>

      <rect x="774" y="60" width="162" height="72" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="790" y="88" font-size="13" fill="#15181d">4. 자동 반영</text>
      <text x="790" y="112" font-size="11.5" fill="#585f6b">사이드카가 감지</text>

      <path d="M855 134 L855 176 L122 176 L122 134" fill="none" stroke="#585f6b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#v1)"/>
      <text x="489" y="196" text-anchor="middle" font-size="12" fill="#585f6b">다시 고칠 일이 생기면 1번으로</text>

      <text x="24" y="38" font-size="13" fill="#15181d">UI는 편집기로만 쓰고, 진실의 원본은 저장소에 둔다</text>

      <defs>
        <marker id="v1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#585f6b"/>
        </marker>
      </defs>
    </svg>
