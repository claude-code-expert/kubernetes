<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="아홉 단계를 거쳐 완성된 관측 스택의 전체 구조">
      <rect width="960" height="430" fill="#ffffff"/>

      <rect x="16" y="34" width="928" height="380" fill="none" stroke="#9aa1ad" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="32" y="26" font-family="ui-monospace,monospace" font-size="12" fill="#585f6b">kind 클러스터 — 노드 3개 (01장)</text>

      <!-- apps -->
      <rect x="40" y="60" width="264" height="150" fill="#ffffff" stroke="#15181d" stroke-width="1.5"/>
      <text x="56" y="84" font-family="ui-monospace,monospace" font-size="12" fill="#585f6b">namespace: apps</text>
      <rect x="56" y="98" width="232" height="40" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="70" y="123" font-size="12.5" fill="#15181d">gateway · order-api ×2</text>
      <text x="56" y="160" font-size="11.5" fill="#585f6b">02 계측 · 03 배포</text>
      <text x="56" y="182" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">/actuator/prometheus</text>

      <!-- monitoring -->
      <rect x="330" y="60" width="290" height="320" fill="#ffffff" stroke="#15181d" stroke-width="1.5"/>
      <text x="346" y="84" font-family="ui-monospace,monospace" font-size="12" fill="#585f6b">namespace: monitoring</text>
      <rect x="346" y="98" width="258" height="38" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="360" y="122" font-size="12.5" fill="#15181d">Prometheus (04)</text>
      <rect x="346" y="146" width="258" height="38" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="360" y="170" font-size="12.5" fill="#15181d">Alertmanager (07)</text>
      <rect x="346" y="194" width="258" height="38" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="360" y="218" font-size="12.5" fill="#15181d">Grafana (05)</text>
      <rect x="346" y="242" width="258" height="38" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="360" y="266" font-size="12.5" fill="#15181d">kube-state-metrics</text>
      <rect x="346" y="290" width="258" height="38" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="360" y="314" font-size="12.5" fill="#15181d">node-exporter</text>
      <text x="346" y="356" font-size="11.5" fill="#585f6b">ServiceMonitor · PrometheusRule (06·07)</text>

      <!-- logging -->
      <rect x="646" y="60" width="264" height="150" fill="#ffffff" stroke="#15181d" stroke-width="1.5"/>
      <text x="662" y="84" font-family="ui-monospace,monospace" font-size="12" fill="#585f6b">namespace: logging</text>
      <rect x="662" y="98" width="232" height="38" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="676" y="122" font-size="12.5" fill="#15181d">Alloy · Loki (08)</text>
      <text x="662" y="160" font-size="11.5" fill="#585f6b">Promtail 아님</text>
      <text x="662" y="182" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">LogQL</text>

      <!-- 화살표 -->
      <path d="M344 118 L312 118" fill="none" stroke="#6a4a9c" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#o1)"/>
      <text x="328" y="106" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#6a4a9c">pull</text>

      <path d="M606 214 L648 214 L648 150" fill="none" stroke="#1f4d8f" stroke-width="1.5" marker-end="url(#o2)"/>
      <text x="656" y="234" font-family="ui-monospace,monospace" font-size="10.5" fill="#1f4d8f">LogQL 질의</text>

      <path d="M170 212 L170 404 L778 404 L778 212" fill="none" stroke="#b4621a" stroke-width="1.5" marker-end="url(#o3)"/>
      <text x="186" y="300" font-family="ui-monospace,monospace" font-size="11" fill="#b4621a">파드 로그 수집 → push</text>
      <text x="186" y="322" font-size="11.5" fill="#585f6b">앱은 표준 출력에만</text>

      <defs>
        <marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#6a4a9c"/>
        </marker>
        <marker id="o2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#1f4d8f"/>
        </marker>
        <marker id="o3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#b4621a"/>
        </marker>
      </defs>
    </svg>
