<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="Gradle 빌드에서 kind 노드 적재를 거쳐 파드가 뜨기까지의 경로">
      <rect width="960" height="330" fill="#ffffff"/>

      <rect x="24" y="40" width="200" height="76" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="40" y="66" font-size="13.5" fill="#15181d">1. 이미지 빌드</text>
      <text x="40" y="88" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">./gradlew bootBuildImage</text>
      <text x="40" y="106" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">→ 맥의 도커 이미지 목록</text>

      <path d="M226 78 L286 78" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#p1)"/>

      <rect x="288" y="40" width="200" height="76" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="304" y="66" font-size="13.5" fill="#15181d">2. 노드에 적재</text>
      <text x="304" y="88" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">kind load docker-image</text>
      <text x="304" y="106" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">→ 각 노드 containerd</text>

      <path d="M490 78 L550 78" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#p1)"/>

      <rect x="552" y="40" width="200" height="76" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="568" y="66" font-size="13.5" fill="#15181d">3. 매니페스트 적용</text>
      <text x="568" y="88" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">kubectl apply -f k8s/</text>
      <text x="568" y="106" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">→ Deployment 생성</text>

      <!-- 적재 버스: 세 노드 모두에 복사된다 -->
      <path d="M388 116 L388 134" fill="none" stroke="#585f6b" stroke-width="1.5"/>
      <line x1="170" y1="134" x2="790" y2="134" stroke="#585f6b" stroke-width="1.5"/>
      <path d="M170 134 L170 174" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#p1)"/>
      <path d="M480 134 L480 174" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#p1)"/>
      <path d="M790 134 L790 174" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#p1)"/>
      <text x="520" y="128" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">세 노드 모두에 복사된다</text>
      <text x="24" y="168" font-family="ui-monospace,monospace" font-size="12" fill="#585f6b">kind 클러스터</text>

      <rect x="24" y="178" width="292" height="104" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="40" y="202" font-family="ui-monospace,monospace" font-size="12" fill="#1f4d8f">obs-control-plane</text>
      <text x="40" y="226" font-size="12" fill="#585f6b">이미지는 적재되지만</text>
      <text x="40" y="246" font-size="12" fill="#585f6b">앱 파드는 뜨지 않는다</text>
      <text x="40" y="268" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">(control-plane 테인트)</text>

      <rect x="334" y="178" width="292" height="104" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="350" y="202" font-family="ui-monospace,monospace" font-size="12" fill="#1f4d8f">obs-worker · workload=apps</text>
      <rect x="350" y="216" width="122" height="34" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="411" y="238" text-anchor="middle" font-size="12" fill="#15181d">order-api ×2</text>
      <rect x="482" y="216" width="128" height="34" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="546" y="238" text-anchor="middle" font-size="12" fill="#15181d">gateway ×1</text>
      <text x="350" y="270" font-size="11.5" fill="#585f6b">노드셀렉터로 여기에 모은다</text>

      <rect x="644" y="178" width="292" height="104" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="660" y="202" font-family="ui-monospace,monospace" font-size="12" fill="#1f4d8f">obs-worker2 · observability</text>
      <text x="660" y="228" font-size="12" fill="#585f6b">04장에서 관측 스택이</text>
      <text x="660" y="248" font-size="12" fill="#585f6b">들어올 자리</text>

      <text x="24" y="312" font-size="12" fill="#8f4408">적재는 노드별로 이뤄진다 — 노드를 추가하면 이미지를 다시 적재해야 한다</text>

      <defs>
        <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#585f6b"/>
        </marker>
      </defs>
    </svg>
