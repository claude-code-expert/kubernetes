<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="프로메테우스 CR, ServiceMonitor, Service, 파드로 이어지는 라벨 연결 구조">
      <rect width="960" height="430" fill="#ffffff"/>

      <!-- Prometheus CR -->
      <rect x="24" y="30" width="400" height="86" fill="#ffffff" stroke="#6a4a9c" stroke-width="1.5"/>
      <text x="40" y="56" font-size="13.5" fill="#15181d">Prometheus (CR)</text>
      <text x="40" y="80" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">serviceMonitorSelector:</text>
      <text x="52" y="100" font-family="ui-monospace,monospace" font-size="11" fill="#6a4a9c">release: kps</text>

      <!-- ① -->
      <path d="M224 118 L224 152" fill="none" stroke="#6a4a9c" stroke-width="1.5" marker-end="url(#z1)"/>
      <circle cx="248" cy="135" r="11" fill="#ffffff" stroke="#6a4a9c" stroke-width="1.5"/>
      <text x="248" y="140" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#6a4a9c">1</text>
      <text x="268" y="140" font-size="12" fill="#585f6b">오퍼레이터가 고를 것인가</text>

      <!-- ServiceMonitor -->
      <rect x="24" y="154" width="400" height="126" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="40" y="180" font-size="13.5" fill="#15181d">ServiceMonitor</text>
      <text x="40" y="204" font-family="ui-monospace,monospace" font-size="11" fill="#6a4a9c">labels: {release: kps}</text>
      <text x="40" y="226" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">selector.matchLabels:</text>
      <text x="52" y="246" font-family="ui-monospace,monospace" font-size="11" fill="#1f4d8f">app.kubernetes.io/name: order-api</text>
      <text x="40" y="268" font-family="ui-monospace,monospace" font-size="11" fill="#2e7d4f">endpoints[0].port: http</text>

      <!-- ② -->
      <path d="M224 282 L224 316" fill="none" stroke="#1f4d8f" stroke-width="1.5" marker-end="url(#z2)"/>
      <circle cx="248" cy="299" r="11" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="248" y="304" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#1f4d8f">2</text>
      <text x="268" y="304" font-size="12" fill="#585f6b">이 라벨을 가진 Service가 있는가</text>

      <!-- Service -->
      <rect x="24" y="318" width="400" height="94" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="40" y="344" font-size="13.5" fill="#15181d">Service (03장에서 만든 것)</text>
      <text x="40" y="368" font-family="ui-monospace,monospace" font-size="11" fill="#1f4d8f">labels: {app.kubernetes.io/name: order-api}</text>
      <text x="40" y="390" font-family="ui-monospace,monospace" font-size="11" fill="#2e7d4f">ports: [{name: http, port: 8080}]</text>

      <!-- ③ -->
      <path d="M428 365 L494 365" fill="none" stroke="#2e7d4f" stroke-width="1.5" marker-end="url(#z3)"/>
      <circle cx="461" cy="345" r="11" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="461" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#2e7d4f">3</text>

      <rect x="496" y="318" width="440" height="94" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="512" y="344" font-size="13.5" fill="#15181d">파드의 엔드포인트</text>
      <text x="512" y="368" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">10.244.1.7:8080/actuator/prometheus</text>
      <text x="512" y="390" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">10.244.1.9:8080/actuator/prometheus</text>

      <!-- 우측 설명 -->
      <rect x="496" y="30" width="440" height="250" fill="#f5f6f7" stroke="#d8dbe0" stroke-width="1"/>
      <text x="516" y="58" font-size="13.5" fill="#15181d">어긋났을 때의 증상</text>
      <text x="516" y="88" font-family="ui-monospace,monospace" font-size="11.5" fill="#6a4a9c">1 실패</text>
      <text x="516" y="108" font-size="12" fill="#585f6b">타깃 목록에 아예 나타나지 않는다. 오류도 없다</text>
      <text x="516" y="140" font-family="ui-monospace,monospace" font-size="11.5" fill="#1f4d8f">2 실패</text>
      <text x="516" y="160" font-size="12" fill="#585f6b">타깃 그룹은 생기지만 대상이 0개다</text>
      <text x="516" y="192" font-family="ui-monospace,monospace" font-size="11.5" fill="#2e7d4f">3 실패</text>
      <text x="516" y="212" font-size="12" fill="#585f6b">포트 이름이 없어 스크레이프 주소가 만들어지지 않는다</text>
      <text x="516" y="248" font-size="12" fill="#8f4408">셋 다 "조용히" 실패한다 — 그래서 확인 순서가 중요하다</text>

      <defs>
        <marker id="z1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#6a4a9c"/>
        </marker>
        <marker id="z2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#1f4d8f"/>
        </marker>
        <marker id="z3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#2e7d4f"/>
        </marker>
      </defs>
    </svg>
