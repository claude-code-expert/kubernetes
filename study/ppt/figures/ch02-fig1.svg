<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="게이트웨이와 주문 API의 호출 관계 및 메트릭 노출 지점">
      <rect width="960" height="320" fill="#ffffff"/>

      <rect x="24" y="110" width="130" height="60" fill="#f5f6f7" stroke="#585f6b" stroke-width="1.5"/>
      <text x="89" y="136" text-anchor="middle" font-size="13" fill="#15181d">클라이언트</text>
      <text x="89" y="155" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">curl · k6</text>

      <path d="M156 140 L214 140" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#m1)"/>

      <!-- gateway -->
      <rect x="216" y="72" width="240" height="136" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="234" y="98" font-size="14" fill="#15181d">gateway</text>
      <text x="234" y="117" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">:8080 · WebFlux</text>
      <line x1="216" y1="130" x2="456" y2="130" stroke="#d8dbe0" stroke-width="1"/>
      <text x="234" y="152" font-family="ui-monospace,monospace" font-size="11.5" fill="#15181d">http.server.requests</text>
      <text x="234" y="171" font-family="ui-monospace,monospace" font-size="11" fill="#15181d">spring.cloud.gateway.requests</text>
      <text x="234" y="194" font-family="ui-monospace,monospace" font-size="11" fill="#1a4fa0">/actuator/prometheus</text>

      <path d="M458 140 L516 140" fill="none" stroke="#585f6b" stroke-width="1.5" marker-end="url(#m1)"/>
      <text x="487" y="130" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#585f6b">HTTP</text>

      <!-- order-api -->
      <rect x="518" y="72" width="240" height="136" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="536" y="98" font-size="14" fill="#15181d">order-api</text>
      <text x="536" y="117" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">:8080 · MVC</text>
      <line x1="518" y1="130" x2="758" y2="130" stroke="#d8dbe0" stroke-width="1"/>
      <text x="536" y="152" font-family="ui-monospace,monospace" font-size="11.5" fill="#15181d">http.server.requests</text>
      <text x="536" y="171" font-family="ui-monospace,monospace" font-size="11" fill="#15181d">orders.created · orders.processing</text>
      <text x="536" y="194" font-family="ui-monospace,monospace" font-size="11" fill="#1a4fa0">/actuator/prometheus</text>

      <!-- prometheus -->
      <rect x="790" y="100" width="146" height="80" fill="#ffffff" stroke="#6a4a9c" stroke-width="1.5"/>
      <text x="863" y="128" text-anchor="middle" font-size="13" fill="#15181d">Prometheus</text>
      <text x="863" y="148" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" fill="#6a4a9c">04장에서 연결</text>

      <path d="M863 182 L863 244 L336 244" fill="none" stroke="#6a4a9c" stroke-width="1.5" stroke-dasharray="5 3"/>
      <path d="M638 244 L638 212" fill="none" stroke="#6a4a9c" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#m2)"/>
      <path d="M336 244 L336 212" fill="none" stroke="#6a4a9c" stroke-width="1.5" marker-end="url(#m2)"/>
      <text x="700" y="266" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6a4a9c">두 서비스를 각각 스크레이프</text>

      <text x="24" y="300" font-size="12" fill="#585f6b">애플리케이션은 메트릭을 어디로도 보내지 않는다. 엔드포인트를 열어두고 기다릴 뿐이다.</text>

      <defs>
        <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#585f6b"/>
        </marker>
        <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#6a4a9c"/>
        </marker>
      </defs>
    </svg>
