<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="startupProbe, readinessProbe, livenessProbe가 동작하는 시간 구간">
      <rect width="960" height="330" fill="#ffffff"/>

      <!-- 타임라인 -->
      <line x1="120" y1="290" x2="920" y2="290" stroke="#585f6b" stroke-width="1.5"/>
      <text x="120" y="314" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">0초</text>
      <text x="400" y="314" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">기동 완료(약 8초)</text>
      <text x="880" y="314" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">운영 중</text>
      <line x1="440" y1="60" x2="440" y2="290" stroke="#d8dbe0" stroke-width="1" stroke-dasharray="4 3"/>

      <!-- startup -->
      <rect x="120" y="70" width="320" height="52" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="136" y="92" font-family="ui-monospace,monospace" font-size="12.5" fill="#1f4d8f">startupProbe</text>
      <text x="136" y="112" font-size="12" fill="#15181d">기동이 끝날 때까지 다른 프로브를 막아준다</text>
      <text x="452" y="100" font-size="12" fill="#585f6b">성공하면 역할이 끝나고 다시 실행되지 않는다</text>

      <!-- readiness -->
      <rect x="440" y="140" width="480" height="52" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="456" y="162" font-family="ui-monospace,monospace" font-size="12.5" fill="#2e7d4f">readinessProbe</text>
      <text x="456" y="182" font-size="12" fill="#15181d">실패하면 서비스 엔드포인트에서 빠진다 — 재시작은 없음</text>
      <text x="128" y="172" font-size="12" fill="#585f6b">기동 중에는 판정하지 않음</text>

      <!-- liveness -->
      <rect x="440" y="210" width="480" height="52" fill="#ffffff" stroke="#8f4408" stroke-width="1.5"/>
      <text x="456" y="232" font-family="ui-monospace,monospace" font-size="12.5" fill="#8f4408">livenessProbe</text>
      <text x="456" y="252" font-size="12" fill="#15181d">실패하면 컨테이너를 재시작한다 — 가장 위험한 프로브</text>
      <text x="128" y="242" font-size="12" fill="#585f6b">기동 중에는 판정하지 않음</text>

      <text x="120" y="42" font-size="13" fill="#15181d">세 프로브가 겹치지 않게 시간을 나눠 갖는다</text>
    </svg>
