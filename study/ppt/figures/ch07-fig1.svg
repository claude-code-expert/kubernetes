<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="대시보드를 요약, RED 지표, 상세 순서로 배치하는 레이아웃 구조">
      <rect width="960" height="380" fill="#ffffff"/>

      <!-- 변수 줄 -->
      <rect x="24" y="30" width="640" height="38" fill="#f5f6f7" stroke="#585f6b" stroke-width="1.5"/>
      <text x="40" y="55" font-family="ui-monospace,monospace" font-size="12" fill="#15181d">namespace: apps ▾   service: All ▾</text>
      <text x="680" y="55" font-size="12" fill="#585f6b">변수 — 대시보드 하나를 여러 대상에 재사용</text>

      <!-- 1행: 요약 -->
      <rect x="24" y="82" width="152" height="70" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="100" y="112" text-anchor="middle" font-size="12.5" fill="#15181d">초당 요청</text>
      <text x="100" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">stat</text>

      <rect x="186" y="82" width="152" height="70" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="262" y="112" text-anchor="middle" font-size="12.5" fill="#15181d">에러율</text>
      <text x="262" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">stat</text>

      <rect x="348" y="82" width="152" height="70" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="424" y="112" text-anchor="middle" font-size="12.5" fill="#15181d">P95 지연</text>
      <text x="424" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">stat</text>

      <rect x="510" y="82" width="154" height="70" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
      <text x="587" y="112" text-anchor="middle" font-size="12.5" fill="#15181d">분당 주문</text>
      <text x="587" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">stat</text>

      <text x="680" y="122" font-size="12" fill="#15181d">① 지금 문제가 있는가 — 3초</text>

      <!-- 2행: 시계열 -->
      <rect x="24" y="166" width="316" height="96" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="182" y="204" text-anchor="middle" font-size="12.5" fill="#15181d">서비스별 처리율 추이</text>
      <text x="182" y="226" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">timeseries</text>

      <rect x="348" y="166" width="316" height="96" fill="#ffffff" stroke="#1f4d8f" stroke-width="1.5"/>
      <text x="506" y="204" text-anchor="middle" font-size="12.5" fill="#15181d">서비스별 P95 / P99</text>
      <text x="506" y="226" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">timeseries</text>

      <text x="680" y="216" font-size="12" fill="#15181d">② 언제부터, 어느 서비스인가</text>

      <!-- 3행: 상세 -->
      <rect x="24" y="276" width="640" height="80" fill="#ffffff" stroke="#585f6b" stroke-width="1.5"/>
      <text x="344" y="310" text-anchor="middle" font-size="12.5" fill="#15181d">엔드포인트별 P99 상위 5개</text>
      <text x="344" y="332" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#585f6b">timeseries</text>

      <text x="680" y="316" font-size="12" fill="#15181d">③ 어느 요청이 범인인가</text>
    </svg>
