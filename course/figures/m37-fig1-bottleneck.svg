<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:12.5px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="430" rx="6"/>
  <text class="t-h" x="40" y="46">같은 부하, 다른 곳에서 잰 값</text>

  <!-- 측정 경로 -->
  <rect class="node" x="40" y="70" width="120" height="50" rx="4"/>
  <text class="t-title" x="100" y="90" text-anchor="middle">k6</text>
  <text class="t-mono" x="100" y="108" text-anchor="middle">p95 70.49ms</text>
  <path class="line" d="M 160 95 L 194 95" marker-end="url(#ar1)"/>
  <rect class="box" x="196" y="70" width="140" height="50" rx="4"/>
  <text class="t-title" x="266" y="90" text-anchor="middle">인그레스</text>
  <text class="t-sub" x="266" y="108" text-anchor="middle">여기서 약 22ms</text>
  <path class="line" d="M 336 95 L 370 95" marker-end="url(#ar1)"/>
  <rect class="accent" x="372" y="70" width="150" height="50" rx="4"/>
  <text class="t-title" x="447" y="90" text-anchor="middle">journal-api</text>
  <text class="t-mono" x="447" y="108" text-anchor="middle">p95 48.42ms</text>
  <path class="line" d="M 522 95 L 556 95" marker-end="url(#ar1)"/>
  <rect class="box" x="558" y="70" width="120" height="50" rx="4"/>
  <text class="t-title" x="618" y="97" text-anchor="middle">redis</text>

  <rect class="box" x="700" y="70" width="160" height="50" rx="4"/>
  <text class="t-mono" x="710" y="90">k6 300 req/s</text>
  <text class="t-mono" x="710" y="108">앱  258.7 req/s</text>
  <text class="t-sub" x="710" y="122">15% 는 정적 파일로 간다</text>

  <!-- 병목 -->
  <rect class="soft" x="40" y="146" width="820" height="150" rx="4"/>
  <text class="t-h" x="56" y="170">cpu limit 하나가 만든 차이 (같은 150 rps)</text>

  <rect class="box" x="56" y="182" width="252" height="46" rx="3"/>
  <text class="t-mono" x="66" y="202">limit 없음</text>
  <text class="t-acc" x="66" y="220">p99 3.54ms · 150 rps 달성</text>

  <rect class="warnbox" x="322" y="182" width="252" height="46" rx="3"/>
  <text class="t-mono" x="332" y="202">limit 50m</text>
  <text class="t-warn" x="332" y="220">p99 14.74s · 121 rps</text>

  <rect class="box" x="588" y="182" width="256" height="46" rx="3"/>
  <text class="t-mono" x="598" y="202">limit 500m</text>
  <text class="t-acc" x="598" y="220">p99 7.71ms · 150 rps 달성</text>

  <rect class="warnbox" x="56" y="238" width="788" height="46" rx="3"/>
  <text class="t-mono" x="66" y="258">kubectl top 은 20~36m — 한가해 보인다. 스로틀링은 top 에 나타나지 않는다</text>
  <text class="t-warn" x="66" y="275">container_cpu_cfs_throttled_periods_total / _periods_total  =  88~96%</text>

  <!-- 한계 -->
  <text class="t-h" x="56" y="326">무너지는 지점을 읽는 법</text>
  <rect class="warnbox" x="56" y="338" width="392" height="86" rx="3"/>
  <text class="t-mono" x="66" y="358">목표 800 rps</text>
  <text class="t-mono" x="66" y="376">http_req_failed: 0.00%</text>
  <text class="t-warn" x="66" y="394">그런데 386 rps 만 나갔다</text>
  <text class="t-warn" x="66" y="412">dropped_iterations 24,069 — 절반이 발사되지 못했다</text>

  <rect class="box" x="468" y="338" width="376" height="86" rx="3"/>
  <text class="t-title" x="478" y="358">에러율만 보면 정상으로 읽힌다</text>
  <text class="t-sub" x="478" y="376">보내지 못한 요청은 실패로 세지 않는다</text>
  <text class="t-sub" x="478" y="394">실제 사용자에게는 그것도 장애다</text>
  <text class="t-acc" x="478" y="412">달성 rps 와 dropped 를 항상 함께 본다</text>
</svg>
