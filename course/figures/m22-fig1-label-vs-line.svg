<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .t-mono-s { font-size:9.5px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="410" rx="6"/>
  <text class="t-h" x="40" y="46">로키에서 라벨과 로그 본문은 값이 다르다</text>
  <text class="t-sub" x="40" y="66">같은 정보를 어디에 두느냐가 저장 비용을 정한다</text>

  <!-- 왼쪽: 올바른 방식 -->
  <rect class="accent" x="40" y="86" width="390" height="180" rx="4"/>
  <text class="t-title" x="235" y="110" text-anchor="middle">라벨은 적게, 본문은 그대로</text>
  <rect class="box" x="56" y="122" width="358" height="46" rx="3"/>
  <text class="t-mono" x="66" y="140">라벨  {namespace, app, container, pod}</text>
  <text class="t-sub" x="66" y="158">값의 가짓수가 유한하고 미리 안다</text>
  <rect class="box" x="56" y="176" width="358" height="76" rx="3"/>
  <text class="t-mono-s" x="66" y="194">{"msg":"request","path":"/api/entries?req=1",</text>
  <text class="t-mono-s" x="66" y="209"> "status":200,"durationMs":1}</text>
  <text class="t-sub" x="66" y="230">path 는 본문 안에 있다. 조회는 | json 으로</text>
  <text class="t-acc" x="66" y="246">스트림 3개</text>

  <!-- 오른쪽: 잘못된 방식 -->
  <rect class="warnbox" x="470" y="86" width="390" height="180" rx="4"/>
  <text class="t-title" x="665" y="110" text-anchor="middle">본문 필드를 라벨로 승격시키면</text>
  <rect class="box" x="486" y="122" width="358" height="46" rx="3"/>
  <text class="t-mono" x="496" y="140">라벨  {…, path, status}</text>
  <text class="t-warn" x="496" y="158">path 는 요청마다 다르다</text>
  <rect class="box" x="486" y="176" width="358" height="76" rx="3"/>
  <text class="t-mono-s" x="496" y="194">{app=journal-api, path="/api/entries?req=1"}</text>
  <text class="t-mono-s" x="496" y="209">{app=journal-api, path="/api/entries?req=2"}</text>
  <text class="t-mono-s" x="496" y="224">{app=journal-api, path="/api/entries?req=3"}  …</text>
  <text class="t-warn" x="496" y="246">스트림 66개 — 요청 60건이 스트림 60개</text>

  <path class="line" d="M 430 176 L 464 176" marker-end="url(#ar1)"/>
  <text class="t-warn" x="447" y="168" text-anchor="middle">stage.labels</text>

  <!-- 아래: 왜 그런가 -->
  <rect class="soft" x="40" y="284" width="820" height="122" rx="4"/>
  <text class="t-h" x="56" y="308">라벨 하나가 스트림 하나다</text>
  <text class="t-sub" x="56" y="330">로키는 라벨 조합마다 별도의 인덱스와 청크를 만든다. 라벨 값의 가짓수가 곱해지면 그만큼 스트림이 생긴다.</text>

  <rect class="box" x="56" y="342" width="256" height="52" rx="3"/>
  <text class="t-title" x="184" y="362" text-anchor="middle">라벨에 넣을 것</text>
  <text class="t-sub" x="184" y="380" text-anchor="middle">네임스페이스 · 앱 · 컨테이너 · 파드</text>

  <rect class="warnbox" x="322" y="342" width="256" height="52" rx="3"/>
  <text class="t-warn" x="450" y="362" text-anchor="middle">라벨에 넣지 말 것</text>
  <text class="t-sub" x="450" y="380" text-anchor="middle">경로 · 사용자 ID · 요청 ID · 타임스탬프</text>

  <rect class="box" x="588" y="342" width="272" height="52" rx="3"/>
  <text class="t-title" x="724" y="362" text-anchor="middle">그것들은 어디에</text>
  <text class="t-sub" x="724" y="380" text-anchor="middle">로그 본문. 조회는 | json · | pattern 으로</text>
</svg>
