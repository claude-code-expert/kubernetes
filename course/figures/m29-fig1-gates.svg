<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1442a"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:12.5px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .wline { stroke:#a1442a; stroke-width:1.4; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="410" rx="6"/>
  <text class="t-h" x="40" y="46">싼 검사가 앞에, 정확한 검사가 뒤에</text>
  <text class="t-sub" x="40" y="66">각 관문은 앞의 관문이 잡지 못하는 것을 잡는다. 하나라도 빼면 그만큼이 클러스터에서 터진다</text>

  <rect class="accent" x="40" y="88" width="140" height="58" rx="4"/>
  <text class="t-title" x="110" y="110" text-anchor="middle">① 타입·테스트</text>
  <text class="t-mono" x="110" y="128" text-anchor="middle">수 초</text>
  <text class="t-sub" x="110" y="141" text-anchor="middle">컨테이너 없이</text>
  <path class="line" d="M 180 117 L 208 117" marker-end="url(#ar1)"/>

  <rect class="accent" x="210" y="88" width="140" height="58" rx="4"/>
  <text class="t-title" x="280" y="110" text-anchor="middle">② 렌더링</text>
  <text class="t-mono" x="280" y="128" text-anchor="middle">helm lint · kustomize</text>
  <text class="t-sub" x="280" y="141" text-anchor="middle">클러스터 없이</text>
  <path class="line" d="M 350 117 L 378 117" marker-end="url(#ar1)"/>

  <rect class="accent" x="380" y="88" width="150" height="58" rx="4"/>
  <text class="t-title" x="455" y="110" text-anchor="middle">③ 이미지 + 스캔</text>
  <text class="t-mono" x="455" y="128" text-anchor="middle">분 단위</text>
  <text class="t-sub" x="455" y="141" text-anchor="middle">테스트가 안에서 다시</text>
  <path class="line" d="M 530 117 L 558 117" marker-end="url(#ar1)"/>

  <rect class="accent" x="560" y="88" width="150" height="58" rx="4"/>
  <text class="t-title" x="635" y="110" text-anchor="middle">④ 어드미션</text>
  <text class="t-mono" x="635" y="128" text-anchor="middle">--dry-run=server</text>
  <text class="t-sub" x="635" y="141" text-anchor="middle">정책이 여기서 건다</text>
  <path class="line" d="M 710 117 L 738 117" marker-end="url(#ar1)"/>

  <rect class="warnbox" x="740" y="88" width="120" height="58" rx="4"/>
  <text class="t-title" x="800" y="110" text-anchor="middle">⑤ 일회용 클러스터</text>
  <text class="t-mono" x="800" y="128" text-anchor="middle">helm test</text>
  <text class="t-warn" x="800" y="141" text-anchor="middle">가장 비싸다</text>

  <!-- 각 관문이 잡는 것 -->
  <rect class="soft" x="40" y="166" width="820" height="112" rx="4"/>
  <text class="t-h" x="56" y="190">앞 관문이 절대 잡지 못하는 것</text>
  <rect class="box" x="56" y="202" width="392" height="30" rx="3"/>
  <text class="t-mono" x="66" y="222">② 는 잡는다 — 스키마 위반, 템플릿 문법</text>
  <rect class="box" x="468" y="202" width="392" height="30" rx="3"/>
  <text class="t-mono" x="478" y="222">③ 은 잡는다 — 베이스 이미지의 CVE</text>
  <rect class="box" x="56" y="238" width="392" height="30" rx="3"/>
  <text class="t-mono" x="66" y="258">④ 는 잡는다 — latest 태그, 금지된 레지스트리</text>
  <rect class="warnbox" x="468" y="238" width="392" height="30" rx="3"/>
  <text class="t-warn" x="478" y="258">⑤ 만 잡는다 — 이름이 안 맞아 붙지 못하는 레디스</text>

  <!-- 게이트 실측 -->
  <text class="t-h" x="56" y="308">실제로 멈춘 두 지점</text>
  <rect class="warnbox" x="56" y="320" width="392" height="88" rx="3"/>
  <text class="t-mono" x="66" y="340">테스트 실패</text>
  <text class="t-sub" x="66" y="358">not ok 5 · # fail 1</text>
  <text class="t-sub" x="66" y="376">exit code 1 로 빌드가 멈춘다</text>
  <text class="t-warn" x="66" y="396">태그가 만들어지지 않는다 = 배포할 것이 없다</text>

  <rect class="warnbox" x="468" y="320" width="392" height="88" rx="3"/>
  <text class="t-mono" x="478" y="340">CRITICAL 취약점</text>
  <text class="t-sub" x="478" y="358">tar 7.5.11 · CVE-2026-59873</text>
  <text class="t-sub" x="478" y="376">우리 코드가 아니라 베이스 이미지의 것</text>
  <text class="t-warn" x="478" y="396">node:22-alpine → node:24-alpine 으로 통과</text>
</svg>
