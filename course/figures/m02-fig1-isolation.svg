<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .vm { fill:#fafaf8; stroke:#999999; stroke-width:1; stroke-dasharray:5 4; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
  </style>

  <!-- 왼쪽: 가상 머신과 컨테이너 -->
  <rect class="outer" x="20" y="20" width="430" height="390" rx="6"/>
  <text class="t-h" x="40" y="46">가상 머신과 컨테이너 — 커널이 몇 개인가</text>

  <text class="t-sub" x="132" y="72" text-anchor="middle">가상 머신</text>
  <rect class="box" x="44" y="330" width="176" height="40" rx="3"/>
  <text class="t-title" x="132" y="355" text-anchor="middle">하드웨어</text>
  <rect class="box" x="44" y="266" width="176" height="56" rx="3"/>
  <text class="t-title" x="132" y="289" text-anchor="middle">호스트 OS + 하이퍼바이저</text>
  <text class="t-sub" x="132" y="307" text-anchor="middle">가상 CPU · 디스크를 흉내낸다</text>
  <rect class="vm" x="44" y="186" width="176" height="72" rx="3"/>
  <text class="t-title" x="132" y="212" text-anchor="middle">게스트 OS 커널</text>
  <text class="t-sub" x="132" y="230" text-anchor="middle">VM마다 하나씩 따로 부팅</text>
  <text class="t-sub" x="132" y="246" text-anchor="middle">수십 초 · 수백 MB</text>
  <rect class="box" x="44" y="130" width="176" height="48" rx="3"/>
  <text class="t-title" x="132" y="150" text-anchor="middle">앱 프로세스</text>
  <text class="t-mono" x="132" y="168" text-anchor="middle">uname -r → 게스트 커널</text>

  <text class="t-sub" x="336" y="72" text-anchor="middle">컨테이너</text>
  <rect class="box" x="248" y="330" width="176" height="40" rx="3"/>
  <text class="t-title" x="336" y="355" text-anchor="middle">하드웨어</text>
  <rect class="accent" x="248" y="266" width="176" height="56" rx="3"/>
  <text class="t-title" x="336" y="289" text-anchor="middle">호스트 리눅스 커널 하나</text>
  <text class="t-sub" x="336" y="307" text-anchor="middle">모든 컨테이너가 공유한다</text>
  <rect class="vm" x="248" y="212" width="176" height="46" rx="3"/>
  <text class="t-title" x="336" y="231" text-anchor="middle">네임스페이스 · cgroup</text>
  <text class="t-sub" x="336" y="248" text-anchor="middle">보이는 범위 · 쓸 수 있는 양</text>
  <rect class="box" x="248" y="130" width="176" height="74" rx="3"/>
  <text class="t-title" x="336" y="152" text-anchor="middle">프로세스 (nginx)</text>
  <text class="t-sub" x="336" y="170" text-anchor="middle">부팅 없음 · 밀리초 · 수 MB</text>
  <text class="t-mono" x="336" y="190" text-anchor="middle">uname -r → 호스트 커널</text>

  <text class="t-sub" x="235" y="395" text-anchor="middle">맥 · 윈도우에서는 이 "호스트 커널"이 런타임의 리눅스 VM이다 (M01 그림 1.1)</text>

  <!-- 오른쪽: 이미지 → 컨테이너 → 프로세스 -->
  <rect class="outer" x="470" y="20" width="410" height="390" rx="6"/>
  <text class="t-h" x="490" y="46">이미지 → 컨테이너 → 프로세스</text>

  <rect class="node" x="494" y="66" width="362" height="92" rx="4"/>
  <text class="t-title" x="508" y="88">① 이미지 — 읽기 전용 레이어의 묶음</text>
  <rect class="box" x="508" y="98" width="200" height="14" rx="2"/>
  <rect class="box" x="508" y="114" width="200" height="14" rx="2"/>
  <rect class="box" x="508" y="130" width="200" height="14" rx="2"/>
  <text class="t-mono" x="722" y="109">nginx:1.29-alpine</text>
  <text class="t-mono" x="722" y="125">sha256:5616…</text>
  <text class="t-sub" x="722" y="143">디스크에만 있다 · M03</text>

  <path class="line" d="M 675 158 L 675 186" marker-end="url(#ar1)"/>
  <text class="t-mono" x="686" y="176">docker run -d --name web</text>

  <rect class="node" x="494" y="188" width="362" height="100" rx="4"/>
  <text class="t-title" x="508" y="210">② 컨테이너 — 이미지 위에 얹은 실행 환경</text>
  <rect class="accent" x="508" y="220" width="200" height="14" rx="2"/>
  <text class="t-sub" x="722" y="231">쓰기 가능 레이어 (rm 하면 사라진다)</text>
  <rect class="box" x="508" y="238" width="200" height="14" rx="2"/>
  <rect class="box" x="508" y="254" width="200" height="14" rx="2"/>
  <text class="t-sub" x="722" y="249">읽기 전용 레이어 (①과 공유)</text>
  <text class="t-mono" x="508" y="282">--name web  -p 8081:80  --memory=32m  → 네임스페이스 · cgroup 설정</text>

  <path class="line" d="M 675 288 L 675 316" marker-end="url(#ar1)"/>
  <text class="t-mono" x="686" y="306">= 실행 중인 상태</text>

  <rect class="node" x="494" y="318" width="362" height="80" rx="4"/>
  <text class="t-title" x="508" y="340">③ 프로세스 — 호스트 커널이 스케줄하는 실체</text>
  <text class="t-mono" x="508" y="360">안에서:  docker exec web ps   →  PID 1   nginx</text>
  <text class="t-mono" x="508" y="378">밖에서:  docker top web       →  PID 98137  nginx: master</text>
  <text class="t-sub" x="508" y="394">같은 프로세스에 번호가 둘. 이 프로세스가 끝나면 컨테이너도 Exited</text>
</svg>
