<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a1442a" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .gap { fill:url(#hatch); stroke:#a1442a; stroke-width:1; stroke-dasharray:4 3; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .tick { stroke:#c8c8c8; stroke-width:1; stroke-dasharray:3 3; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="390" rx="6"/>
  <text class="t-h" x="40" y="46">파드 하나가 종료될 때 — 두 경로는 동시에 끝나지 않는다</text>

  <!-- t0 기준선 -->
  <line class="tick" x1="150" y1="60" x2="150" y2="382"/>
  <text class="t-mono" x="150" y="74" text-anchor="middle">t = 0</text>
  <text class="t-sub" x="150" y="392" text-anchor="middle">apiserver 가 파드를 Terminating 으로 표시</text>

  <!-- 경로 A : 엔드포인트 제거 -->
  <text class="t-title" x="40" y="112">경로 A</text>
  <text class="t-sub" x="40" y="129">트래픽 차단</text>
  <rect class="node" x="150" y="94" width="170" height="44" rx="4"/>
  <text class="t-title" x="235" y="114" text-anchor="middle">EndpointSlice 갱신</text>
  <text class="t-sub" x="235" y="130" text-anchor="middle">엔드포인트 컨트롤러</text>
  <rect class="node" x="330" y="94" width="250" height="44" rx="4"/>
  <text class="t-title" x="455" y="114" text-anchor="middle">kube-proxy · 인그레스 컨트롤러</text>
  <text class="t-sub" x="455" y="130" text-anchor="middle">규칙을 다시 읽어 이 파드를 뺀다</text>
  <line class="tick" x1="580" y1="94" x2="580" y2="382"/>
  <text class="t-warn" x="596" y="112">여기서야 트래픽이 끊긴다</text>

  <!-- 경로 B : 프로세스 종료 -->
  <text class="t-title" x="40" y="192">경로 B</text>
  <text class="t-sub" x="40" y="209">프로세스 종료</text>
  <rect class="node" x="150" y="174" width="110" height="44" rx="4"/>
  <text class="t-title" x="205" y="194" text-anchor="middle">kubelet</text>
  <text class="t-mono" x="205" y="210" text-anchor="middle">SIGTERM</text>
  <rect class="warnbox" x="270" y="174" width="110" height="44" rx="4"/>
  <text class="t-title" x="325" y="194" text-anchor="middle">프로세스 종료</text>
  <text class="t-mono" x="325" y="210" text-anchor="middle">server.close()</text>
  <line class="tick" x1="380" y1="174" x2="380" y2="382"/>

  <!-- 실패 구간 -->
  <rect class="gap" x="380" y="234" width="200" height="40" rx="3"/>
  <text class="t-warn" x="480" y="250" text-anchor="middle">실패 구간</text>
  <text class="t-warn" x="480" y="266" text-anchor="middle">규칙에는 남아 있는데 받을 프로세스가 없다</text>
  <text class="t-sub" x="596" y="258">→ 502 · 커넥션 거부</text>

  <!-- preStop 적용 -->
  <text class="t-title" x="40" y="322">preStop 을</text>
  <text class="t-title" x="40" y="338">넣으면</text>
  <rect class="node" x="150" y="304" width="110" height="44" rx="4"/>
  <text class="t-title" x="205" y="324" text-anchor="middle">kubelet</text>
  <text class="t-mono" x="205" y="340" text-anchor="middle">preStop 먼저</text>
  <rect class="accent" x="270" y="304" width="340" height="44" rx="4"/>
  <text class="t-title" x="440" y="324" text-anchor="middle">preStop: sleep 5 — 프로세스는 아직 살아서 응답한다</text>
  <text class="t-sub" x="440" y="340" text-anchor="middle">경로 A 가 끝날 시간을 벌어 준다</text>
  <rect class="box" x="620" y="304" width="120" height="44" rx="4"/>
  <text class="t-title" x="680" y="324" text-anchor="middle">그다음 SIGTERM</text>
  <text class="t-sub" x="680" y="340" text-anchor="middle">실패 구간 없음</text>

  <path class="line" d="M 150 366 L 820 366" marker-end="url(#ar1)"/>
  <text class="t-mono" x="828" y="370">시간</text>
</svg>
