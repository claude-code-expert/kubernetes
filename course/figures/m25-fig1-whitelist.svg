<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1442a"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .nsbox { fill:#ffffff; stroke:#999999; stroke-width:1; stroke-dasharray:5 4; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .wline { stroke:#a1442a; stroke-width:1.4; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="430" rx="6"/>
  <text class="t-h" x="40" y="46">정책이 붙는 순간 그 파드는 화이트리스트로 바뀐다</text>

  <!-- 왼쪽: 정책 없음 -->
  <rect class="nsbox" x="40" y="66" width="380" height="150" rx="4"/>
  <text class="t-title" x="56" y="88">정책이 하나도 없을 때</text>
  <rect class="node" x="60" y="102" width="100" height="40" rx="3"/>
  <text class="t-mono" x="110" y="126" text-anchor="middle">apps 파드</text>
  <rect class="node" x="240" y="102" width="100" height="40" rx="3"/>
  <text class="t-mono" x="290" y="126" text-anchor="middle">journal-api</text>
  <rect class="node" x="240" y="158" width="100" height="40" rx="3"/>
  <text class="t-mono" x="290" y="182" text-anchor="middle">redis</text>
  <path class="line" d="M 160 122 L 234 122" marker-end="url(#ar1)"/>
  <path class="line" d="M 160 130 L 234 176" marker-end="url(#ar1)"/>
  <text class="t-sub" x="56" y="210">네임스페이스는 이름의 경계일 뿐 네트워크 경계가 아니다</text>

  <!-- 오른쪽: 정책 있음 -->
  <rect class="nsbox" x="480" y="66" width="380" height="150" rx="4"/>
  <text class="t-title" x="496" y="88">그 파드에 정책이 하나라도 붙으면</text>
  <rect class="node" x="500" y="102" width="100" height="40" rx="3"/>
  <text class="t-mono" x="550" y="126" text-anchor="middle">apps 파드</text>
  <rect class="warnbox" x="680" y="102" width="100" height="40" rx="3"/>
  <text class="t-mono" x="730" y="126" text-anchor="middle">journal-api</text>
  <rect class="warnbox" x="680" y="158" width="100" height="40" rx="3"/>
  <text class="t-mono" x="730" y="182" text-anchor="middle">redis</text>
  <path class="wline" d="M 600 122 L 664 122" marker-end="url(#ar2)"/>
  <text class="t-warn" x="640" y="114" text-anchor="middle">000</text>
  <path class="wline" d="M 600 130 L 664 176" marker-end="url(#ar2)"/>
  <text class="t-sub" x="496" y="210">거부 규칙은 없다. 허용에 없으면 막힌 것이다</text>

  <!-- AND/OR -->
  <rect class="soft" x="40" y="234" width="820" height="118" rx="4"/>
  <text class="t-h" x="56" y="258">하이픈 하나가 범위를 바꾼다</text>
  <rect class="accent" x="56" y="270" width="386" height="66" rx="3"/>
  <text class="t-mono" x="66" y="290">- namespaceSelector: ingress-nginx</text>
  <text class="t-mono" x="66" y="306">  podSelector: name=ingress-nginx</text>
  <text class="t-acc" x="66" y="326">AND — 그 네임스페이스의 그 파드만</text>
  <rect class="warnbox" x="458" y="270" width="386" height="66" rx="3"/>
  <text class="t-mono" x="468" y="290">- namespaceSelector: ingress-nginx</text>
  <text class="t-mono" x="468" y="306">- podSelector: name=ingress-nginx</text>
  <text class="t-warn" x="468" y="326">OR — 그 네임스페이스 전체가 열린다</text>

  <!-- 한계 -->
  <text class="t-h" x="56" y="382">정책이 보는 것과 보지 못하는 것</text>
  <rect class="box" x="56" y="394" width="386" height="40" rx="3"/>
  <text class="t-sub" x="66" y="419">본다 — 출발지 IP가 어느 파드·네임스페이스인가, 포트 번호</text>
  <rect class="warnbox" x="458" y="394" width="386" height="40" rx="3"/>
  <text class="t-warn" x="468" y="419">못 본다 — HTTP 경로·메서드, 호출자의 신원 증명, 암호화</text>
</svg>
