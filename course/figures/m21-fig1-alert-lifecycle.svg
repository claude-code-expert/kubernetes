<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .load { fill:#e8e8e6; stroke:#777777; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .tick { stroke:#c8c8c8; stroke-width:1; stroke-dasharray:3 3; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="400" rx="6"/>
  <text class="t-h" x="40" y="46">알림 하나가 울리고 꺼지기까지 — 무엇이 각 구간의 길이를 정하는가</text>

  <!-- 부하 구간 -->
  <text class="t-sub" x="40" y="82">부하</text>
  <rect class="node" x="120" y="66" width="720" height="26" rx="3"/>
  <rect class="load" x="150" y="66" width="300" height="26" rx="3"/>
  <text class="t-sub" x="300" y="84" text-anchor="middle">카오스 (에러 70% · 800ms 지연)</text>
  <text class="t-mono" x="150" y="106" text-anchor="middle">22:00:20</text>
  <text class="t-mono" x="450" y="106" text-anchor="middle">22:05:59</text>

  <line class="tick" x1="150" y1="60" x2="150" y2="330"/>
  <line class="tick" x1="450" y1="60" x2="450" y2="330"/>

  <!-- 에러율 알림 -->
  <text class="t-title" x="40" y="146">에러율</text>
  <text class="t-mono" x="40" y="162">for: 2m</text>
  <rect class="node" x="120" y="126" width="720" height="34" rx="3"/>
  <rect class="accent" x="186" y="126" width="120" height="34" rx="3"/>
  <text class="t-acc" x="246" y="147" text-anchor="middle">pending</text>
  <rect class="warnbox" x="306" y="126" width="304" height="34" rx="3"/>
  <text class="t-warn" x="458" y="147" text-anchor="middle">firing</text>
  <text class="t-mono" x="186" y="176" text-anchor="middle">22:01:00</text>
  <text class="t-mono" x="306" y="176" text-anchor="middle">22:03:18</text>
  <text class="t-mono" x="610" y="176" text-anchor="middle">22:11:04</text>

  <!-- 지연 알림 -->
  <text class="t-title" x="40" y="212">지연 P95</text>
  <text class="t-mono" x="40" y="228">for: 3m</text>
  <rect class="node" x="120" y="192" width="720" height="34" rx="3"/>
  <rect class="accent" x="186" y="192" width="180" height="34" rx="3"/>
  <text class="t-acc" x="276" y="213" text-anchor="middle">pending</text>
  <rect class="warnbox" x="366" y="192" width="244" height="34" rx="3"/>
  <text class="t-warn" x="488" y="213" text-anchor="middle">firing</text>
  <text class="t-mono" x="366" y="242" text-anchor="middle">22:04:18</text>

  <!-- 구간 설명 -->
  <line class="line" x1="150" y1="266" x2="186" y2="266" marker-start="url(#ar1)" marker-end="url(#ar1)"/>
  <text class="t-sub" x="168" y="284" text-anchor="middle">40초</text>
  <text class="t-sub" x="168" y="300" text-anchor="middle">평가 주기</text>

  <line class="line" x1="186" y1="266" x2="306" y2="266" marker-start="url(#ar1)" marker-end="url(#ar1)"/>
  <text class="t-acc" x="246" y="284" text-anchor="middle">2분 18초</text>
  <text class="t-sub" x="246" y="300" text-anchor="middle">규칙의 for</text>

  <line class="line" x1="450" y1="266" x2="610" y2="266" marker-start="url(#ar1)" marker-end="url(#ar1)"/>
  <text class="t-warn" x="530" y="284" text-anchor="middle">5분 5초</text>
  <text class="t-sub" x="530" y="300" text-anchor="middle">rate 창 길이 — for 가 아니다</text>

  <!-- 결론 -->
  <rect class="soft" x="40" y="322" width="818" height="84" rx="4"/>
  <text class="t-h" x="56" y="346">세 값이 각각 다른 구간을 정한다</text>
  <rect class="box" x="56" y="356" width="256" height="40" rx="3"/>
  <text class="t-mono" x="184" y="373" text-anchor="middle">interval: 30s</text>
  <text class="t-sub" x="184" y="389" text-anchor="middle">얼마나 자주 확인할까</text>
  <rect class="accent" x="322" y="356" width="256" height="40" rx="3"/>
  <text class="t-mono" x="450" y="373" text-anchor="middle">for: 2m</text>
  <text class="t-sub" x="450" y="389" text-anchor="middle">얼마나 지속돼야 부를까</text>
  <rect class="warnbox" x="588" y="356" width="270" height="40" rx="3"/>
  <text class="t-mono" x="723" y="373" text-anchor="middle">rate(...[5m])</text>
  <text class="t-sub" x="723" y="389" text-anchor="middle">얼마나 오래 기억할까</text>
</svg>
