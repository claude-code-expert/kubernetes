<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:12.5px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="430" rx="6"/>
  <text class="t-h" x="40" y="46">가설을 먼저 쓴다 — 그래야 실험이다</text>

  <!-- 4단계 -->
  <rect class="accent" x="40" y="66" width="190" height="58" rx="4"/>
  <text class="t-title" x="135" y="88" text-anchor="middle">① 가설</text>
  <text class="t-sub" x="135" y="106" text-anchor="middle">정상 상태를 숫자로</text>
  <path class="line" d="M 230 95 L 256 95" marker-end="url(#ar1)"/>
  <rect class="accent" x="258" y="66" width="190" height="58" rx="4"/>
  <text class="t-title" x="353" y="88" text-anchor="middle">② 이벤트</text>
  <text class="t-sub" x="353" y="106" text-anchor="middle">폭발 반경 · 중단 조건</text>
  <path class="line" d="M 448 95 L 474 95" marker-end="url(#ar1)"/>
  <rect class="accent" x="476" y="66" width="184" height="58" rx="4"/>
  <text class="t-title" x="568" y="88" text-anchor="middle">③ 대조</text>
  <text class="t-sub" x="568" y="106" text-anchor="middle">같은 도구로 전후 비교</text>
  <path class="line" d="M 660 95 L 686 95" marker-end="url(#ar1)"/>
  <rect class="accent" x="688" y="66" width="172" height="58" rx="4"/>
  <text class="t-title" x="774" y="88" text-anchor="middle">④ 판정</text>
  <text class="t-sub" x="774" y="106" text-anchor="middle">틀렸으면 왜 틀렸는지</text>

  <!-- 실험 결과 -->
  <rect class="soft" x="40" y="140" width="820" height="182" rx="4"/>
  <text class="t-h" x="56" y="164">실험 다섯과 실측</text>

  <rect class="box" x="56" y="176" width="392" height="40" rx="3"/>
  <text class="t-mono" x="66" y="194">① 파드 킬 (mode: one)</text>
  <text class="t-sub" x="66" y="210">요청 16,971건 전부 200 — preStop 과 PDB 가 지켰다</text>

  <rect class="box" x="468" y="176" width="392" height="40" rx="3"/>
  <text class="t-mono" x="478" y="194">② 지연 200ms → 응답 404ms</text>
  <text class="t-acc" x="478" y="210">두 배다 = 요청당 레디스를 2회 부른다</text>

  <rect class="warnbox" x="56" y="222" width="392" height="40" rx="3"/>
  <text class="t-mono" x="66" y="240">②-b 지연 1500ms (왕복 3초 &gt; 타임아웃 2초)</text>
  <text class="t-warn" x="66" y="256">2,368건/20초 → 109건/40초 (76건 실패)</text>

  <rect class="warnbox" x="468" y="222" width="392" height="40" rx="3"/>
  <text class="t-mono" x="478" y="240">③ CPU 한 파드 → HPA 1051% → 4에서 8로</text>
  <text class="t-warn" x="478" y="256">HPA 는 평균을 본다. 나머지 7개는 놀고 있었다</text>

  <rect class="box" x="56" y="268" width="392" height="42" rx="3"/>
  <text class="t-mono" x="66" y="286">④ FAULT_RATE 0.5 → 에러율 48.6%</text>
  <text class="t-acc" x="66" y="303">AppHighErrorRate firing (2분 뒤)</text>

  <rect class="box" x="468" y="268" width="392" height="42" rx="3"/>
  <text class="t-mono" x="478" y="286">⑤ 퍼즈 26회 — 500 은 0건</text>
  <text class="t-warn" x="478" y="303">그런데 {} 와 [] 가 201 로 저장된다</text>

  <!-- 관측 지점 -->
  <rect class="soft" x="56" y="336" width="784" height="88" rx="4"/>
  <text class="t-h" x="70" y="360">알림은 관측 지점 뒤의 고장만 본다</text>
  <rect class="warnbox" x="70" y="372" width="370" height="42" rx="3"/>
  <text class="t-mono" x="80" y="390">HTTPChaos abort — 요청이 앱에 닿지 않는다</text>
  <text class="t-warn" x="80" y="407">전부 000 · 인그레스 502 · 알림은 울리지 않았다</text>
  <rect class="accent" x="456" y="372" width="384" height="42" rx="3"/>
  <text class="t-mono" x="466" y="390">앱이 스스로 500 — 메트릭에 기록된다</text>
  <text class="t-acc" x="466" y="407">2분 뒤 알림 발화</text>
</svg>
