<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="m11aa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="m11aa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
    <marker id="m11aa3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1442a"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .dash { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; stroke-dasharray:4 3; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.5; fill:none; }
    .wline { stroke:#a1442a; stroke-width:1.5; fill:none; }
    .tick { stroke:#c8c8c8; stroke-width:1; stroke-dasharray:3 3; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="400" rx="6"/>
  <text class="t-h" x="40" y="46">요청이 파드에 닿기까지 — 중간에 프록시 서버는 없다</text>
  <text class="t-sub" x="40" y="66">서비스는 프로세스가 아니다. 이름을 IP로 바꾸는 일과 그 IP를 실제 파드로 바꾸는 일이 각각 다른 곳에서 일어난다.</text>

  <rect class="soft" x="40" y="84" width="390" height="230" rx="5"/>
  <text class="t-sub" x="54" y="102">워커 노드 1</text>
  <rect class="accent" x="60" y="112" width="150" height="52" rx="4"/>
  <text class="t-acc" x="74" y="134">호출자 파드</text>
  <text class="t-mono" x="74" y="152">10.244.1.5</text>

  <rect class="box" x="252" y="112" width="160" height="52" rx="4"/>
  <text class="t-title" x="266" y="134">CoreDNS</text>
  <text class="t-mono" x="266" y="152">journal-api → 10.96.0.15</text>

  <line class="line" x1="210" y1="132" x2="250" y2="132" marker-end="url(#m11aa1)"/>
  <text class="t-acc" x="230" y="124" text-anchor="middle">①</text>

  <rect class="box" x="60" y="196" width="352" height="46" rx="4"/>
  <text class="t-title" x="74" y="216">노드 커널 규칙 — kube-proxy 가 심는다</text>
  <text class="t-mono" x="74" y="234">DNAT  10.96.0.15 → 10.244.2.7</text>
  <line class="line" x1="135" y1="164" x2="135" y2="194" marker-end="url(#m11aa1)"/>
  <text class="t-acc" x="146" y="184">③</text>

  <rect class="box" x="60" y="256" width="352" height="42" rx="4"/>
  <text class="t-title" x="74" y="282">CNI — 노드 간 배달</text>
  <line class="line" x1="135" y1="242" x2="135" y2="254" marker-end="url(#m11aa1)"/>

  <rect class="dash" x="470" y="98" width="390" height="66" rx="5"/>
  <text class="t-sub" x="484" y="120">Service journal-api  ·  ClusterIP 10.96.0.15</text>
  <text class="t-warn" x="484" y="142">이 IP를 가진 네트워크 인터페이스는 어디에도 없다</text>
  <text class="t-acc" x="446" y="136" text-anchor="middle">②</text>

  <rect class="box" x="470" y="180" width="390" height="62" rx="5"/>
  <text class="t-title" x="484" y="202">EndpointSlice</text>
  <text class="t-mono" x="484" y="222">10.244.2.7 · 10.244.2.8</text>
  <text class="t-sub" x="684" y="222">준비된 파드만 들어간다</text>
  <line class="tick" x1="665" y1="164" x2="665" y2="178"/>
  <line class="tick" x1="412" y1="212" x2="468" y2="212"/>

  <rect class="soft" x="470" y="258" width="390" height="56" rx="5"/>
  <text class="t-sub" x="484" y="276">워커 노드 2</text>
  <rect class="accent" x="486" y="282" width="170" height="26" rx="4"/>
  <text class="t-mono" x="498" y="300">파드 10.244.2.7</text>
  <rect class="box" x="670" y="282" width="170" height="26" rx="4"/>
  <text class="t-mono" x="682" y="300">파드 10.244.2.8</text>
  <line class="aline" x1="412" y1="277" x2="468" y2="277" marker-end="url(#m11aa2)"/>
  <text class="t-acc" x="440" y="270" text-anchor="middle">④</text>

  <rect class="warnbox" x="40" y="330" width="820" height="62" rx="5"/>
  <text class="t-warn" x="54" y="351">① 이름 조회  ② 가상 IP로 출발  ③ 커널이 주소 변환  ④ 파드 도착 — 어느 단계가 깨졌는지 아는 것이 진단의 전부다.</text>
  <text class="t-sub" x="54" y="369">이름이 안 풀리면 ①, 이름은 풀리는데 연결이 안 되면 ③ 아래의 EndpointSlice 가 비었는지 본다.</text>
  <text class="t-sub" x="54" y="385">컨트롤 플레인은 이 경로에 개입하지 않는다. 규칙을 미리 심어 둘 뿐이다.</text>
</svg>
