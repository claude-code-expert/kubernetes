<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="m11aa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="m11aa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.6; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:12.5px; font-weight:600; fill:#111111; }
    .t-sub { font-size:10.5px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .t-mono-a { font-size:11.5px; font-weight:600; fill:#2456c4; font-family:ui-monospace,Consolas,monospace; }
    .t-mono-w { font-size:11.5px; font-weight:600; fill:#a1442a; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.6; fill:none; }
    .tick { stroke:#c8c8c8; stroke-width:1; stroke-dasharray:3 3; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="400" rx="6"/>
  <text class="t-h" x="40" y="46">요청 하나가 지나가는 길 — 목적지 주소가 도중에 바뀐다</text>
  <text class="t-sub" x="40" y="64">아래 띠가 이 그림의 요점이다. 같은 패킷의 목적지가 ③에서 달라진다.</text>

  <!-- 단계 5개 -->
  <text class="t-acc" x="42"  y="88">① 이름 조회</text>
  <text class="t-acc" x="208" y="88">② 패킷 생성</text>
  <text class="t-acc" x="374" y="88">③ 커널 규칙</text>
  <text class="t-acc" x="540" y="88">④ 노드 간 배달</text>
  <text class="t-acc" x="706" y="88">⑤ 도착</text>

  <rect class="box"    x="42"  y="96" width="146" height="84" rx="5"/>
  <text class="t-title" x="56" y="118">호출자 파드</text>
  <text class="t-sub"   x="56" y="138">CoreDNS 에 묻는다</text>
  <text class="t-mono"  x="56" y="158">journal-api 가</text>
  <text class="t-mono"  x="56" y="172">어느 주소냐</text>

  <rect class="box"    x="208" y="96" width="146" height="84" rx="5"/>
  <text class="t-title" x="222" y="118">호출자 파드</text>
  <text class="t-sub"   x="222" y="138">받은 주소로 보낸다</text>
  <text class="t-sub"   x="222" y="158">패킷은 아직 노드</text>
  <text class="t-sub"   x="222" y="172">안에 있다</text>

  <rect class="accent" x="374" y="96" width="146" height="84" rx="5"/>
  <text class="t-acc"   x="388" y="118">노드의 커널</text>
  <text class="t-sub"   x="388" y="138">노드를 떠나기 전에</text>
  <text class="t-sub"   x="388" y="158">목적지를 바꾼다</text>
  <text class="t-mono"  x="388" y="174">iptables · nftables</text>

  <rect class="box"    x="540" y="96" width="146" height="84" rx="5"/>
  <text class="t-title" x="554" y="118">CNI</text>
  <text class="t-sub"   x="554" y="138">바뀐 주소 그대로</text>
  <text class="t-sub"   x="554" y="158">노드 사이를 건넌다</text>

  <rect class="box"    x="706" y="96" width="146" height="84" rx="5"/>
  <text class="t-title" x="720" y="118">journal-api 파드</text>
  <text class="t-sub"   x="720" y="138">자기 IP 로 온 것이라</text>
  <text class="t-sub"   x="720" y="158">그냥 받는다</text>
  <text class="t-mono"  x="720" y="174">10.244.2.7</text>

  <line class="line" x1="188" y1="138" x2="206" y2="138" marker-end="url(#m11aa1)"/>
  <line class="aline" x1="354" y1="138" x2="372" y2="138" marker-end="url(#m11aa2)"/>
  <line class="aline" x1="520" y1="138" x2="538" y2="138" marker-end="url(#m11aa2)"/>
  <line class="aline" x1="686" y1="138" x2="704" y2="138" marker-end="url(#m11aa2)"/>

  <!-- CoreDNS 응답 -->
  <rect class="soft" x="42" y="196" width="146" height="34" rx="4"/>
  <text class="t-mono" x="56" y="217">→ 10.96.0.15</text>
  <line class="tick" x1="115" y1="180" x2="115" y2="194"/>

  <!-- 패킷 목적지 띠 -->
  <text class="t-h" x="208" y="212">패킷의 목적지 주소</text>
  <rect class="soft" x="208" y="222" width="146" height="40" rx="4"/>
  <text class="t-mono-w" x="222" y="240">dst 10.96.0.15</text>
  <text class="t-sub"    x="222" y="256">가상 — 실체 없음</text>

  <rect class="accent" x="374" y="222" width="146" height="40" rx="4"/>
  <text class="t-acc"  x="388" y="240">여기서 바뀐다</text>
  <text class="t-mono" x="388" y="256">DNAT</text>

  <rect class="soft" x="540" y="222" width="312" height="40" rx="4"/>
  <text class="t-mono-a" x="554" y="240">dst 10.244.2.7</text>
  <text class="t-sub"    x="554" y="256">실제 파드 — 이제 갈 곳이 있다</text>

  <line class="tick" x1="354" y1="242" x2="372" y2="242"/>
  <line class="aline" x1="520" y1="242" x2="538" y2="242" marker-end="url(#m11aa2)"/>

  <!-- EndpointSlice -->
  <rect class="box" x="374" y="282" width="478" height="44" rx="5"/>
  <text class="t-title" x="388" y="302">EndpointSlice — ③의 규칙을 만드는 재료</text>
  <text class="t-mono"  x="388" y="319">10.244.2.7 · 10.244.2.8</text>
  <text class="t-sub"   x="560" y="319">준비된(ready) 파드만 들어간다. 비어 있으면 ③이 바꿔 줄 주소가 없다</text>
  <line class="tick" x1="447" y1="262" x2="447" y2="280"/>

  <rect class="warnbox" x="40" y="338" width="820" height="70" rx="5"/>
  <text class="t-warn" x="54" y="359">“인터페이스가 없는 주소로 왜 보내나” — 패킷은 그 주소에 도달하지 않는다. ③에서 목적지가 실제 파드 IP 로 바뀌기 때문이다.</text>
  <text class="t-sub"  x="54" y="379">ClusterIP 는 갈 곳이 아니라 <tspan font-weight="700">커널 규칙을 촉발하는 표식</tspan>이다. 그래서 어느 랜카드에도 붙어 있지 않아도 호출이 성립한다.</text>
  <text class="t-sub"  x="54" y="398">컨트롤 플레인은 ①에만 관여한다. ②~⑤는 노드 안에서만 일어나고, API 서버가 죽어 있어도 이 경로는 계속 돈다.</text>
</svg>
