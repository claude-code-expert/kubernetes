<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .nsbox { fill:#ffffff; stroke:#999999; stroke-width:1; stroke-dasharray:5 4; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.5; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="410" rx="6"/>
  <text class="t-h" x="40" y="46">권한의 정의와 범위는 따로 정해진다</text>

  <!-- 주체 -->
  <rect class="accent" x="40" y="70" width="180" height="70" rx="4"/>
  <text class="t-title" x="130" y="94" text-anchor="middle">주체 (누가)</text>
  <text class="t-mono" x="130" y="112" text-anchor="middle">ServiceAccount</text>
  <text class="t-mono" x="130" y="128" text-anchor="middle">journal:dev</text>

  <!-- 바인딩 -->
  <rect class="accent" x="330" y="70" width="200" height="70" rx="4"/>
  <text class="t-title" x="430" y="94" text-anchor="middle">바인딩 (어디서)</text>
  <text class="t-mono" x="430" y="112" text-anchor="middle">RoleBinding — 한 네임스페이스</text>
  <text class="t-mono" x="430" y="128" text-anchor="middle">ClusterRoleBinding — 전체</text>

  <!-- 역할 -->
  <rect class="accent" x="640" y="70" width="200" height="70" rx="4"/>
  <text class="t-title" x="740" y="94" text-anchor="middle">역할 (무엇을)</text>
  <text class="t-mono" x="740" y="112" text-anchor="middle">Role / ClusterRole</text>
  <text class="t-mono" x="740" y="128" text-anchor="middle">동사 + 리소스 목록</text>

  <path class="aline" d="M 220 105 L 324 105" marker-end="url(#ar2)"/>
  <text class="t-acc" x="272" y="97" text-anchor="middle">subjects</text>
  <path class="aline" d="M 530 105 L 634 105" marker-end="url(#ar2)"/>
  <text class="t-acc" x="582" y="97" text-anchor="middle">roleRef</text>

  <!-- 네 조합 -->
  <rect class="soft" x="40" y="160" width="800" height="150" rx="4"/>
  <text class="t-h" x="56" y="184">바인딩 × 역할 — 네 조합</text>

  <rect class="box" x="56" y="196" width="380" height="46" rx="3"/>
  <text class="t-mono" x="66" y="214">RoleBinding + Role</text>
  <text class="t-sub" x="66" y="232">그 네임스페이스 안에서만. 가장 흔한 조합</text>

  <rect class="warnbox" x="448" y="196" width="380" height="46" rx="3"/>
  <text class="t-mono" x="458" y="214">RoleBinding + ClusterRole</text>
  <text class="t-warn" x="458" y="232">정의는 클러스터 것을 쓰지만 효력은 그 네임스페이스뿐</text>

  <rect class="box" x="56" y="250" width="380" height="46" rx="3"/>
  <text class="t-mono" x="66" y="268">ClusterRoleBinding + ClusterRole</text>
  <text class="t-sub" x="66" y="286">클러스터 전체. 노드·네임스페이스 같은 전역 리소스에 필요</text>

  <rect class="box" x="448" y="250" width="380" height="46" rx="3"/>
  <text class="t-mono" x="458" y="268">ClusterRoleBinding + Role</text>
  <text class="t-sub" x="458" y="286">성립하지 않는다 — Role 은 네임스페이스에 속한다</text>

  <!-- 요청 경로 -->
  <text class="t-h" x="56" y="342">요청 하나가 지나가는 길</text>
  <rect class="node" x="56" y="354" width="150" height="44" rx="3"/>
  <text class="t-title" x="131" y="374" text-anchor="middle">인증</text>
  <text class="t-mono" x="131" y="390" text-anchor="middle">토큰이 유효한가</text>
  <path class="line" d="M 206 376 L 246 376" marker-end="url(#ar1)"/>
  <rect class="accent" x="248" y="354" width="180" height="44" rx="3"/>
  <text class="t-title" x="338" y="374" text-anchor="middle">인가 — Node, RBAC</text>
  <text class="t-mono" x="338" y="390" text-anchor="middle">이 동사를 허용하는가</text>
  <path class="line" d="M 428 376 L 468 376" marker-end="url(#ar1)"/>
  <rect class="node" x="470" y="354" width="170" height="44" rx="3"/>
  <text class="t-title" x="555" y="374" text-anchor="middle">어드미션</text>
  <text class="t-mono" x="555" y="390" text-anchor="middle">M24 · M26</text>
  <path class="line" d="M 640 376 L 680 376" marker-end="url(#ar1)"/>
  <rect class="node" x="682" y="354" width="146" height="44" rx="3"/>
  <text class="t-title" x="755" y="374" text-anchor="middle">etcd 에 기록</text>

  <text class="t-sub" x="56" y="416">인증 실패는 <tspan font-family="ui-monospace,Consolas,monospace">Unauthorized</tspan>, 인가 실패는 <tspan font-family="ui-monospace,Consolas,monospace">Forbidden</tspan> — 메시지로 어느 단계에서 막혔는지 알 수 있다</text>
</svg>
