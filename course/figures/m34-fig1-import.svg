<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .nsbox { fill:#ffffff; stroke:#999999; stroke-width:1; stroke-dasharray:5 4; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:12.5px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.4; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="420" rx="6"/>
  <text class="t-h" x="40" y="46">앱은 상대가 어디 있는지 모른다 — 서비스가 그것을 감춘다</text>

  <!-- study 클러스터 -->
  <rect class="nsbox" x="40" y="66" width="420" height="176" rx="4"/>
  <text class="t-title" x="56" y="88">study 클러스터</text>
  <rect class="node" x="56" y="100" width="110" height="44" rx="3"/>
  <text class="t-mono" x="111" y="127" text-anchor="middle">파드</text>
  <path class="aline" d="M 166 122 L 200 122" marker-end="url(#ar2)"/>
  <text class="t-acc" x="183" y="114" text-anchor="middle">이름</text>
  <rect class="accent" x="202" y="100" width="240" height="44" rx="3"/>
  <text class="t-mono" x="212" y="120">Service (selector 없음)</text>
  <text class="t-sub" x="212" y="136">ClusterIP 10.96.140.114</text>

  <rect class="accent" x="202" y="156" width="240" height="66" rx="3"/>
  <text class="t-mono" x="212" y="176">EndpointSlice (손으로 씀)</text>
  <text class="t-mono" x="212" y="194">addresses: 172.20.0.5</text>
  <text class="t-mono" x="212" y="212">conditions.ready: true</text>
  <path class="line" d="M 322 144 L 322 152" marker-end="url(#ar1)"/>

  <!-- 밖 -->
  <rect class="box" x="500" y="100" width="160" height="44" rx="3"/>
  <text class="t-mono" x="580" y="120" text-anchor="middle">클러스터 밖 레디스</text>
  <text class="t-sub" x="580" y="136" text-anchor="middle">172.20.0.5:6379</text>
  <path class="line" d="M 442 122 L 496 122" marker-end="url(#ar1)"/>

  <rect class="box" x="690" y="100" width="170" height="44" rx="3"/>
  <text class="t-mono" x="775" y="120" text-anchor="middle">edge 클러스터</text>
  <text class="t-sub" x="775" y="136" text-anchor="middle">NodePort 31080 고정</text>
  <path class="line" d="M 442 178 C 560 178 600 150 686 136" marker-end="url(#ar1)"/>
  <text class="t-sub" x="560" y="196">같은 방법으로 다른 클러스터의 서비스도 가져온다</text>

  <!-- ExternalName -->
  <rect class="soft" x="40" y="256" width="400" height="120" rx="4"/>
  <text class="t-h" x="56" y="280">ExternalName 은 다르다</text>
  <rect class="box" x="56" y="292" width="368" height="30" rx="3"/>
  <text class="t-mono" x="66" y="312">DNS 가 CNAME 을 돌려주고 끝난다 (ClusterIP 없음)</text>
  <rect class="warnbox" x="56" y="328" width="368" height="38" rx="3"/>
  <text class="t-warn" x="66" y="346">포트를 못 바꾼다 — 16379 로 걸면 Connection refused</text>
  <text class="t-warn" x="66" y="361">엔드포인트가 없어 상태를 알 방법이 없다</text>

  <!-- 한계 -->
  <rect class="soft" x="456" y="256" width="384" height="120" rx="4"/>
  <text class="t-h" x="472" y="280">손으로 쓴 엔드포인트의 대가</text>
  <rect class="warnbox" x="472" y="292" width="352" height="38" rx="3"/>
  <text class="t-mono" x="482" y="310">docker stop ext-redis</text>
  <text class="t-warn" x="482" y="325">ready=true 그대로 · 접속은 timeout</text>
  <rect class="box" x="472" y="336" width="352" height="30" rx="3"/>
  <text class="t-sub" x="482" y="356">상대 노드가 늘면 목록을 사람이 고쳐야 한다</text>

  <rect class="soft" x="56" y="390" width="784" height="34" rx="4"/>
  <text class="t-sub" x="70" y="411">MCS API(ServiceExport · ServiceImport)가 표준화하려는 것이 이 손작업이다. 기본으로는 없고 컨트롤러를 설치해야 한다</text>
</svg>
