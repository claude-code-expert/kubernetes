<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="m12a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="m12a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
    <marker id="m12a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1442a"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .dash { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; stroke-dasharray:4 3; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.5; fill:none; }
    .wline { stroke:#a1442a; stroke-width:1.5; fill:none; }
    .tick { stroke:#c8c8c8; stroke-width:1; stroke-dasharray:3 3; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="380" rx="6"/>
  <text class="t-h" x="40" y="46">밖에서 안으로 — 규칙을 적는 것과 트래픽을 받는 것은 다르다</text>
  <text class="t-sub" x="40" y="66">Ingress 와 HTTPRoute 는 트래픽이 지나가는 길이 아니다. 규칙을 읽고 실제로 프록시하는 것은 컨트롤러 파드다.</text>

  <rect class="dash" x="40" y="96" width="820" height="76" rx="5"/>
  <text class="t-sub" x="54" y="116">규칙을 적은 오브젝트 — etcd 에 저장될 뿐, 패킷은 여기로 흐르지 않는다</text>
  <rect class="soft" x="60" y="124" width="360" height="38" rx="4"/>
  <text class="t-title" x="74" y="140">Ingress</text>
  <text class="t-mono" x="74" y="156">ingressClassName · host · path → service:port</text>
  <rect class="soft" x="440" y="124" width="400" height="38" rx="4"/>
  <text class="t-title" x="454" y="140">Gateway + HTTPRoute</text>
  <text class="t-mono" x="454" y="156">리스너는 인프라 팀 · 라우트는 애플리케이션 팀</text>

  <line class="tick" x1="240" y1="172" x2="240" y2="216"/>
  <line class="tick" x1="640" y1="172" x2="640" y2="216"/>
  <text class="t-sub" x="452" y="192" text-anchor="middle">읽는다 (watch)</text>

  <rect class="box" x="40" y="216" width="120" height="120" rx="5"/>
  <text class="t-title" x="56" y="238">클라이언트</text>
  <text class="t-sub" x="56" y="258">브라우저</text>
  <text class="t-sub" x="56" y="276">외부 시스템</text>
  <text class="t-mono" x="56" y="300">curl -H</text>
  <text class="t-mono" x="56" y="316">"Host: ..."</text>

  <line class="line" x1="160" y1="276" x2="196" y2="276" marker-end="url(#m12a1)"/>

  <rect class="box" x="198" y="216" width="150" height="120" rx="5"/>
  <text class="t-title" x="212" y="238">노드 진입점</text>
  <text class="t-sub" x="212" y="258">LoadBalancer</text>
  <text class="t-sub" x="212" y="276">또는 NodePort</text>
  <text class="t-mono" x="212" y="300">kind 에서는</text>
  <text class="t-mono" x="212" y="316">extraPortMappings</text>

  <line class="line" x1="348" y1="276" x2="384" y2="276" marker-end="url(#m12a1)"/>

  <rect class="accent" x="386" y="216" width="180" height="120" rx="5"/>
  <text class="t-acc" x="400" y="238">컨트롤러 파드</text>
  <text class="t-sub" x="400" y="258">ingress-nginx 또는</text>
  <text class="t-sub" x="400" y="276">Gateway 구현체</text>
  <text class="t-sub" x="400" y="300">여기가 실제 프록시다.</text>
  <text class="t-sub" x="400" y="318">규칙대로 서비스를 고른다.</text>

  <line class="aline" x1="566" y1="276" x2="602" y2="276" marker-end="url(#m12a2)"/>

  <rect class="box" x="604" y="216" width="120" height="120" rx="5"/>
  <text class="t-title" x="618" y="238">Service</text>
  <text class="t-mono" x="618" y="258">ClusterIP</text>
  <text class="t-sub" x="618" y="280">M11 의 네 단계가</text>
  <text class="t-sub" x="618" y="298">여기서 다시 시작된다</text>

  <line class="aline" x1="724" y1="276" x2="756" y2="276" marker-end="url(#m12a2)"/>

  <rect class="soft" x="758" y="216" width="102" height="120" rx="5"/>
  <text class="t-title" x="772" y="238">파드</text>
  <rect class="box" x="772" y="250" width="74" height="22" rx="3"/>
  <rect class="box" x="772" y="278" width="74" height="22" rx="3"/>
  <rect class="box" x="772" y="306" width="74" height="22" rx="3"/>

  <rect class="warnbox" x="40" y="348" width="820" height="46" rx="5"/>
  <text class="t-warn" x="54" y="370">컨트롤러가 없으면 규칙만 남고 아무 일도 일어나지 않는다. 인그레스를 만들었는데 접속이 안 된다는 신고의 첫 번째 원인이다.</text>
  <text class="t-sub" x="54" y="386">ingressClassName 이 틀려도 같은 결과가 난다 — 어느 컨트롤러도 규칙을 집어 가지 않고, 그 사실을 알려 주는 이벤트도 없다.</text>
</svg>
