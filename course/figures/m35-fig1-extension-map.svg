<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:12.5px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="430" rx="6"/>
  <text class="t-h" x="40" y="46">확장 지점 — 무엇을 바꾸고 싶은가로 고른다</text>

  <rect class="soft" x="40" y="66" width="820" height="176" rx="4"/>
  <rect class="accent" x="56" y="80" width="256" height="70" rx="3"/>
  <text class="t-title" x="66" y="100">새 리소스 종류가 필요하다</text>
  <text class="t-mono" x="66" y="118">CRD + 컨트롤러 (M33)</text>
  <text class="t-sub" x="66" y="136">apiextensions.k8s.io</text>

  <rect class="accent" x="322" y="80" width="256" height="70" rx="3"/>
  <text class="t-title" x="332" y="100">기존 리소스를 검사·수정한다</text>
  <text class="t-mono" x="332" y="118">VAP · MAP · 웹훅 (M26)</text>
  <text class="t-sub" x="332" y="136">admissionregistration.k8s.io</text>

  <rect class="box" x="588" y="80" width="256" height="70" rx="3"/>
  <text class="t-title" x="598" y="100">특수 장치를 요청한다</text>
  <text class="t-mono" x="598" y="118">DRA — resource.k8s.io/v1</text>
  <text class="t-sub" x="598" y="136">드라이버는 벤더가 제공</text>

  <rect class="box" x="56" y="160" width="256" height="70" rx="3"/>
  <text class="t-title" x="66" y="180">스토리지를 붙인다</text>
  <text class="t-mono" x="66" y="198">CSI 드라이버 (M18)</text>
  <text class="t-sub" x="66" y="216">storage.k8s.io</text>

  <rect class="box" x="322" y="160" width="256" height="70" rx="3"/>
  <text class="t-title" x="332" y="180">배치 순서를 바꾼다</text>
  <text class="t-mono" x="332" y="198">PriorityClass · 스케줄러 플러그인</text>
  <text class="t-sub" x="332" y="216">먼저 taint·affinity 로 되는지 본다</text>

  <rect class="box" x="588" y="160" width="256" height="70" rx="3"/>
  <text class="t-title" x="598" y="180">런타임을 고른다</text>
  <text class="t-mono" x="598" y="198">RuntimeClass — node.k8s.io</text>
  <text class="t-sub" x="598" y="216">샌드박스 런타임 등</text>

  <!-- 배치 -->
  <text class="t-h" x="56" y="272">배치 잡의 두 축</text>
  <rect class="accent" x="56" y="284" width="380" height="60" rx="3"/>
  <text class="t-mono" x="66" y="304">completions 6 · parallelism 2</text>
  <text class="t-sub" x="66" y="322">총 조각 수와 동시 실행 수는 다른 값이다</text>
  <text class="t-acc" x="66" y="338">자원과 시간을 맞바꾸는 손잡이</text>

  <rect class="accent" x="456" y="284" width="388" height="60" rx="3"/>
  <text class="t-mono" x="466" y="304">completionMode: Indexed</text>
  <text class="t-sub" x="466" y="322">JOB_COMPLETION_INDEX 로 자기 몫을 정한다</text>
  <text class="t-acc" x="466" y="338">파드 이름에도 인덱스가 들어간다</text>

  <!-- 실패 -->
  <text class="t-h" x="56" y="374">실패를 구분하면 파드 4개가 1개가 된다</text>
  <rect class="warnbox" x="56" y="386" width="380" height="48" rx="3"/>
  <text class="t-mono" x="66" y="406">backoffLimit 만 — 같은 실패를 4번 반복</text>
  <text class="t-warn" x="66" y="424">BackoffLimitExceeded</text>
  <rect class="accent" x="456" y="386" width="388" height="48" rx="3"/>
  <text class="t-mono" x="466" y="406">podFailurePolicy — exit 42 는 즉시 포기</text>
  <text class="t-acc" x="466" y="424">파드 1개로 끝난다</text>
</svg>
