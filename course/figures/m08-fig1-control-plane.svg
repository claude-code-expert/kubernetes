<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>
  <style>
    .b { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .acc { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .t { font-size:13px; font-weight:600; fill:#111111; }
    .s { font-size:11px; fill:#555555; }
    .n { font-size:11.5px; font-weight:700; fill:#2456c4; }
    .l { stroke:#444444; stroke-width:1.2; fill:none; }
    .hd { font-size:13.5px; font-weight:700; fill:#333333; }
    .hs { font-size:11px; fill:#555555; }
    .lg { font-size:11px; fill:#555555; }
    .lgn { font-size:11px; font-weight:700; fill:#2456c4; }
    .frame { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .d { stroke:#999999; stroke-width:1; fill:none; stroke-dasharray:4 3; }
  </style>
  <text class="hd" x="20" y="22">명령 하나가 지나가는 길 — 아무도 지시하지 않는다. 각자 지켜보다 반응한다</text>
  <text class="hs" x="20" y="42">kubectl 은 apiserver 에게만 말한다. 그다음부터는 컨트롤러와 스케줄러가 스스로 알아채고 움직인다.</text>
  <text class="hs" x="20" y="60">점선 화살표(③④)가 그 감시(watch)다 — 누가 시켜서가 아니라 변화를 보고 스스로 나선다.</text>
  <g transform="translate(0,78)">
  <rect class="acc" x="20" y="130" width="120" height="58" rx="4"/>
  <text class="t" x="80" y="154" text-anchor="middle">kubectl</text>
  <text class="s" x="80" y="172" text-anchor="middle">사용자</text>

  <rect class="b" x="185" y="120" width="140" height="78" rx="4"/>
  <text class="t" x="255" y="146" text-anchor="middle">kube-apiserver</text>
  <text class="s" x="255" y="164" text-anchor="middle">인증 · 인가</text>
  <text class="s" x="255" y="181" text-anchor="middle">어드미션 · 검증</text>

  <rect class="b" x="370" y="30" width="120" height="56" rx="4"/>
  <text class="t" x="430" y="54" text-anchor="middle">etcd</text>
  <text class="s" x="430" y="72" text-anchor="middle">의도한 상태 저장</text>

  <rect class="b" x="370" y="130" width="120" height="78" rx="4"/>
  <text class="t" x="430" y="156" text-anchor="middle">controller</text>
  <text class="s" x="430" y="173" text-anchor="middle">Deployment →</text>
  <text class="s" x="430" y="190" text-anchor="middle">ReplicaSet → Pod</text>

  <rect class="b" x="370" y="240" width="120" height="60" rx="4"/>
  <text class="t" x="430" y="264" text-anchor="middle">scheduler</text>
  <text class="s" x="430" y="282" text-anchor="middle">노드 선택</text>

  <rect class="b" x="560" y="130" width="130" height="78" rx="4"/>
  <text class="t" x="625" y="156" text-anchor="middle">kubelet</text>
  <text class="s" x="625" y="173" text-anchor="middle">해당 노드에서</text>
  <text class="s" x="625" y="190" text-anchor="middle">컨테이너 실행</text>

  <rect class="b" x="735" y="130" width="130" height="78" rx="4"/>
  <text class="t" x="800" y="156" text-anchor="middle">containerd</text>
  <text class="s" x="800" y="173" text-anchor="middle">이미지 풀</text>
  <text class="s" x="800" y="190" text-anchor="middle">프로세스 시작</text>

  <path class="l" d="M 140 159 L 178 159" marker-end="url(#a8)"/>
  <text class="n" x="159" y="150" text-anchor="middle">①</text>
  <path class="l" d="M 300 120 L 380 90" marker-end="url(#a8)"/>
  <text class="n" x="333" y="99" text-anchor="middle">②</text>
  <path class="d" d="M 325 150 L 365 150" marker-end="url(#a8)"/>
  <text class="n" x="345" y="142" text-anchor="middle">③</text>
  <path class="d" d="M 325 178 L 372 258" marker-end="url(#a8)"/>
  <text class="n" x="341" y="216" text-anchor="middle">④</text>
  <path class="l" d="M 490 169 L 553 169" marker-end="url(#a8)"/>
  <text class="n" x="521" y="160" text-anchor="middle">⑤</text>
  <path class="l" d="M 690 169 L 728 169" marker-end="url(#a8)"/>
  <text class="n" x="709" y="160" text-anchor="middle">⑥</text>
  </g>

  <rect class="frame" x="20" y="386" width="860" height="84" rx="5"/>
  <text class="hs" x="36" y="406" font-weight="700" fill="#333333">번호가 뜻하는 것</text>
  <text class="lgn" x="36"  y="428">①</text><text class="lg" x="52"  y="428">kubectl 이 apiserver 에 "이런 상태였으면 좋겠다" 를 보낸다</text>
  <text class="lgn" x="36"  y="446">②</text><text class="lg" x="52"  y="446">apiserver 가 검증한 뒤 etcd 에 적는다. 여기까지가 "접수"다</text>
  <text class="lgn" x="36"  y="464">③</text><text class="lg" x="52"  y="464">컨트롤러가 그 변화를 보고 레플리카셋과 파드를 만든다</text>
  <text class="lgn" x="470" y="428">④</text><text class="lg" x="486" y="428">스케줄러가 노드 없는 파드를 찾아 노드를 정해 준다</text>
  <text class="lgn" x="470" y="446">⑤</text><text class="lg" x="486" y="446">그 노드의 kubelet 이 자기 몫을 알아채고 가져간다</text>
  <text class="lgn" x="470" y="464">⑥</text><text class="lg" x="486" y="464">컨테이너 런타임에 실행을 지시한다. 이때 파드가 뜬다</text>

</svg>
