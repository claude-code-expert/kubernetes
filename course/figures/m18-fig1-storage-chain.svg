<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.5; fill:none; }
    .tick { stroke:#c8c8c8; stroke-width:1; stroke-dasharray:3 3; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="410" rx="6"/>
  <text class="t-h" x="40" y="46">누가 무엇을 만드는가 — 파드가 붙기 전에는 볼륨이 없다</text>

  <!-- 1행: 선언 -->
  <text class="t-sub" x="40" y="78">① 사람이 쓰는 것</text>
  <rect class="accent" x="150" y="62" width="170" height="52" rx="4"/>
  <text class="t-title" x="235" y="84" text-anchor="middle">PersistentVolumeClaim</text>
  <text class="t-mono" x="235" y="102" text-anchor="middle">1Gi · RWO · standard</text>

  <path class="line" d="M 320 88 L 374 88" marker-end="url(#ar1)"/>

  <rect class="node" x="376" y="62" width="170" height="52" rx="4"/>
  <text class="t-title" x="461" y="84" text-anchor="middle">StorageClass</text>
  <text class="t-mono" x="461" y="102" text-anchor="middle">누가 · 어떻게 · 지울까</text>

  <rect class="node" x="596" y="62" width="242" height="52" rx="4"/>
  <text class="t-title" x="717" y="84" text-anchor="middle">Pod</text>
  <text class="t-mono" x="717" y="102" text-anchor="middle">volumes.persistentVolumeClaim</text>

  <!-- 대기 상태 -->
  <rect class="warnbox" x="150" y="134" width="688" height="42" rx="4"/>
  <text class="t-warn" x="494" y="152" text-anchor="middle">여기까지는 PVC 가 Pending 이고 PV 는 존재하지 않는다</text>
  <text class="t-sub" x="494" y="168" text-anchor="middle">WaitForFirstConsumer — 파드가 어느 노드로 갈지 정해진 뒤에 만든다</text>

  <path class="aline" d="M 494 176 L 494 210" marker-end="url(#ar2)"/>
  <text class="t-acc" x="506" y="198">파드가 스케줄되는 순간</text>

  <!-- 2행: 실물 -->
  <text class="t-sub" x="40" y="240">② 컨트롤러가 만드는 것</text>
  <rect class="accent" x="150" y="212" width="200" height="56" rx="4"/>
  <text class="t-title" x="250" y="236" text-anchor="middle">PersistentVolume</text>
  <text class="t-mono" x="250" y="254" text-anchor="middle">pvc-4686e4f9-…</text>

  <path class="line" d="M 350 240 L 404 240" marker-end="url(#ar1)"/>

  <rect class="node" x="406" y="212" width="432" height="56" rx="4"/>
  <text class="t-title" x="622" y="234" text-anchor="middle">study-worker 의 디렉터리</text>
  <text class="t-mono" x="622" y="252" text-anchor="middle">nodeAffinity: kubernetes.io/hostname In [study-worker]</text>

  <line class="tick" x1="150" y1="284" x2="838" y2="284"/>

  <!-- 결과 -->
  <rect class="soft" x="42" y="298" width="796" height="112" rx="4"/>
  <text class="t-h" x="58" y="322">그래서 생기는 일</text>

  <rect class="box" x="58" y="334" width="250" height="62" rx="3"/>
  <text class="t-title" x="183" y="354" text-anchor="middle">데이터는 파드보다 오래 산다</text>
  <text class="t-sub" x="183" y="372" text-anchor="middle">파드를 지워도 PVC 와 PV 는 남는다.</text>
  <text class="t-sub" x="183" y="388" text-anchor="middle">새 파드가 같은 PVC 를 붙이면 그대로다</text>

  <rect class="warnbox" x="320" y="334" width="250" height="62" rx="3"/>
  <text class="t-warn" x="445" y="354" text-anchor="middle">파드가 노드에 묶인다</text>
  <text class="t-sub" x="445" y="372" text-anchor="middle">이 PV 를 쓰는 파드는 study-worker</text>
  <text class="t-sub" x="445" y="388" text-anchor="middle">밖으로 못 간다. drain 이 막히는 이유다</text>

  <rect class="box" x="582" y="334" width="256" height="62" rx="3"/>
  <text class="t-title" x="710" y="354" text-anchor="middle">지우는 방식은 SC 가 정한다</text>
  <text class="t-sub" x="710" y="372" text-anchor="middle">Delete — PVC 를 지우면 PV 도 사라진다</text>
  <text class="t-sub" x="710" y="388" text-anchor="middle">Retain — Released 로 남아 손이 필요하다</text>
</svg>
