<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="m11ba1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="m11ba2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.6; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:12.5px; font-weight:600; fill:#111111; }
    .t-sub { font-size:10.5px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .t-mono-w { font-size:11.5px; font-weight:600; fill:#a1442a; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.6; fill:none; }
    .wline { stroke:#a1442a; stroke-width:1.6; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="440" rx="6"/>
  <text class="t-h" x="40" y="46">파드 IP 는 물리망이 모르는 주소다 — 그 간극을 CNI 가 메운다</text>

  <!-- ① 전제: 주소가 두 겹 -->
  <text class="t-acc" x="42" y="72">① 먼저 — 주소 체계가 두 겹이다</text>
  <rect class="box" x="42" y="80" width="396" height="76" rx="5"/>
  <text class="t-title" x="58" y="102">물리 네트워크가 아는 주소</text>
  <text class="t-mono"  x="58" y="122">192.168.0.0/24  ·  노드 IP</text>
  <text class="t-sub"   x="58" y="142">스위치·라우터의 경로표에 들어 있다. 진짜 장비의 주소다.</text>

  <rect class="accent" x="462" y="80" width="396" height="76" rx="5"/>
  <text class="t-acc"   x="478" y="102">쿠버네티스가 지어낸 주소</text>
  <text class="t-mono"  x="478" y="122">10.244.0.0/16  ·  파드 IP</text>
  <text class="t-sub"   x="478" y="142">클러스터가 스스로 나눠 쓴다. <tspan font-weight="700">물리망에 알린 적이 없다.</tspan></text>

  <!-- ② 그래서 못 간다 -->
  <text class="t-acc" x="42" y="182">② 그래서 기본 상태로는 못 간다</text>
  <rect class="box" x="42" y="190" width="816" height="104" rx="5"/>

  <rect class="soft" x="60" y="206" width="180" height="72" rx="4"/>
  <text class="t-title" x="74" y="226">Node A</text>
  <text class="t-mono"  x="74" y="244">노드 192.168.0.5</text>
  <text class="t-mono"  x="74" y="262">order 파드 10.244.1.5</text>

  <rect class="box" x="360" y="206" width="212" height="72" rx="4"/>
  <text class="t-title" x="374" y="226">물리 네트워크의 스위치</text>
  <text class="t-sub"   x="374" y="244">경로표를 뒤진다</text>
  <text class="t-sub"   x="374" y="260">10.244.0.0/16 이 없다</text>
  <text class="t-warn"  x="374" y="276">넘길 곳을 못 찾아 버린다</text>

  <rect class="soft" x="644" y="206" width="196" height="72" rx="4"/>
  <text class="t-title" x="658" y="226">Node B</text>
  <text class="t-mono"  x="658" y="244">노드 192.168.0.6</text>
  <text class="t-mono"  x="658" y="262">payment 파드 10.244.2.7</text>

  <line class="line" x1="240" y1="252" x2="356" y2="252" marker-end="url(#m11ba1)"/>
  <text class="t-mono-w" x="298" y="242" text-anchor="middle" font-size="10">dst 10.244.2.7</text>

  <line class="wline" x1="576" y1="242" x2="640" y2="242" stroke-dasharray="5 4"/>
  <line class="wline" x1="597" y1="232" x2="613" y2="252"/>
  <line class="wline" x1="613" y1="232" x2="597" y2="252"/>

  <!-- ③ 두 해법 -->
  <text class="t-acc" x="42" y="318">③ CNI 가 메우는 두 가지 방법</text>
  <rect class="box" x="42" y="326" width="396" height="94" rx="5"/>
  <text class="t-title" x="58" y="346">감춘다 — 오버레이</text>
  <rect class="accent" x="58" y="354" width="364" height="34" rx="4"/>
  <text class="t-mono" x="70" y="368">겉봉투  192.168.0.5 → 0.6</text>
  <text class="t-mono" x="70" y="383">    속  10.244.1.5 → 10.244.2.7</text>
  <text class="t-sub"  x="58" y="406">물리망은 겉봉투만 본다. 파드 대역을 몰라도 배달된다.</text>

  <rect class="box" x="462" y="326" width="396" height="94" rx="5"/>
  <text class="t-title" x="478" y="346">알려 준다 — 라우팅</text>
  <rect class="soft" x="478" y="354" width="364" height="34" rx="4"/>
  <text class="t-mono" x="490" y="375">10.244.2.0/24 → 192.168.0.6</text>
  <text class="t-sub"  x="478" y="406">경로표에 대역을 넣어 준다. 이제 스위치가 넘길 곳을 안다.</text>

  <rect class="warnbox" x="40" y="422" width="820" height="30" rx="4"/>
  <text class="t-warn" x="54" y="441">쿠버네티스는 “모든 파드가 NAT 없이 서로 통해야 한다”는 요구만 정한다. 어느 방식으로 이룰지는 CNI 플러그인이 고르고, kind 는 kindnet 이 ③-오른쪽으로 해결한다.</text>
</svg>
