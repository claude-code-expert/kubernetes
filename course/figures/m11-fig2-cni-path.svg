<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="m11ba1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="m11ba2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
    <marker id="m11ba3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1442a"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .dash { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; stroke-dasharray:4 3; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.5; fill:none; }
    .wline { stroke:#a1442a; stroke-width:1.5; fill:none; }
    .tick { stroke:#c8c8c8; stroke-width:1; stroke-dasharray:3 3; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="390" rx="6"/>
  <text class="t-h" x="40" y="46">노드가 다르면 길이 필요하다 — 규칙은 쿠버네티스, 구현은 CNI</text>
  <text class="t-sub" x="40" y="66">쿠버네티스는 "모든 파드는 NAT 없이 통신 가능해야 한다"는 규칙만 정한다. 어떻게 통하게 할지는 플러그인의 몫이다.</text>

  <text class="t-sub" x="46" y="96">① 기본 상태로는 통하지 않는다</text>
  <rect class="box" x="40" y="106" width="820" height="104" rx="5"/>
  <rect class="soft" x="58" y="122" width="200" height="72" rx="4"/>
  <text class="t-title" x="72" y="142">Node A</text>
  <text class="t-mono" x="72" y="160">파드 대역 10.244.1.0/24</text>
  <text class="t-mono" x="72" y="180">order 10.244.1.5</text>

  <rect class="box" x="330" y="122" width="240" height="72" rx="4"/>
  <text class="t-title" x="344" y="142">물리 네트워크</text>
  <text class="t-mono" x="344" y="160">192.168.0.0/24</text>
  <text class="t-warn" x="344" y="180">10.244.2.7 이 어디인지 모른다</text>
  <line class="line" x1="258" y1="158" x2="328" y2="158" marker-end="url(#m11ba1)"/>

  <line class="wline" x1="572" y1="158" x2="636" y2="158" stroke-dasharray="5 4"/>
  <line class="wline" x1="596" y1="148" x2="612" y2="168"/>
  <line class="wline" x1="612" y1="148" x2="596" y2="168"/>
  <text class="t-warn" x="604" y="186" text-anchor="middle">전달 불가</text>

  <rect class="soft" x="642" y="122" width="200" height="72" rx="4"/>
  <text class="t-title" x="656" y="142">Node B</text>
  <text class="t-mono" x="656" y="160">파드 대역 10.244.2.0/24</text>
  <text class="t-mono" x="656" y="180">payment 10.244.2.7</text>

  <text class="t-sub" x="46" y="234">② 오버레이 — 감싸서 보낸다</text>
  <rect class="box" x="40" y="244" width="400" height="120" rx="5"/>
  <rect class="accent" x="58" y="260" width="364" height="58" rx="4"/>
  <text class="t-acc" x="72" y="278">노드 패킷 · 겉봉투</text>
  <text class="t-mono" x="230" y="278">192.168.0.5 → 0.6</text>
  <rect class="soft" x="72" y="286" width="336" height="24" rx="3"/>
  <text class="t-mono" x="84" y="303">파드 패킷 · 알맹이  10.244.1.5 → 10.244.2.7</text>
  <text class="t-sub" x="58" y="336">물리망을 고치지 않아도 된다. 대신 캡슐화 오버헤드가 붙는다.</text>
  <text class="t-mono" x="58" y="354">Flannel VXLAN · Calico VXLAN</text>

  <text class="t-sub" x="466" y="234">③ 라우팅 — 길을 알려 준다</text>
  <rect class="box" x="460" y="244" width="400" height="120" rx="5"/>
  <rect class="soft" x="478" y="260" width="364" height="58" rx="4"/>
  <text class="t-title" x="492" y="278">Node A 의 라우팅 테이블</text>
  <text class="t-mono" x="492" y="296">10.244.2.0/24 → 192.168.0.6</text>
  <text class="t-mono" x="492" y="312">10.244.3.0/24 → 192.168.0.7</text>
  <text class="t-sub" x="478" y="336">감싸지 않으므로 오버헤드가 없다. 대신 망 환경의 제약을 받는다.</text>
  <text class="t-mono" x="478" y="354">Calico BGP · Cilium 네이티브 라우팅</text>

  <rect class="warnbox" x="40" y="370" width="820" height="28" rx="4"/>
  <text class="t-warn" x="54" y="389">방식이 달라도 결과는 같다 — 모든 파드가 NAT 없이 통신한다. kind 는 kindnet 을 기본으로 깔아 이 길을 미리 내 둔다.</text>
</svg>
