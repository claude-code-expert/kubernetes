<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="m9a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="m9a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
    <marker id="m9a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1442a"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .dash { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; stroke-dasharray:4 3; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:11px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.5; fill:none; }
    .wline { stroke:#a1442a; stroke-width:1.5; fill:none; }
    .tick { stroke:#c8c8c8; stroke-width:1; stroke-dasharray:3 3; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="360" rx="6"/>
  <text class="t-h" x="40" y="46">파드는 경계다 — 무엇이 공유되고 무엇이 갈리는가</text>
  <text class="t-sub" x="40" y="66">노드 안에 파드가 들어가고, 파드 안에 컨테이너가 들어간다. 경계마다 공유되는 것이 다르다.</text>

  <rect class="soft" x="40" y="84" width="820" height="230" rx="5"/>
  <text class="t-sub" x="54" y="102">노드 study-worker</text>

  <rect class="accent" x="62" y="112" width="430" height="186" rx="5"/>
  <text class="t-acc" x="76" y="132">파드 journal-with-sidecar</text>
  <text class="t-mono" x="76" y="150">IP 10.244.1.5 · 파드마다 하나</text>

  <rect class="box" x="78" y="162" width="188" height="60" rx="4"/>
  <text class="t-title" x="92" y="184">컨테이너 api</text>
  <text class="t-mono" x="92" y="204">:8080</text>

  <rect class="box" x="288" y="162" width="188" height="60" rx="4"/>
  <text class="t-title" x="302" y="184">컨테이너 sidecar</text>
  <text class="t-mono" x="302" y="204">:9090</text>

  <line class="aline" x1="266" y1="192" x2="286" y2="192" marker-end="url(#m9a2)" marker-start="url(#m9a2)"/>
  <text class="t-acc" x="277" y="240" text-anchor="middle">localhost</text>

  <rect class="box" x="78" y="252" width="398" height="34" rx="4"/>
  <text class="t-sub" x="92" y="274">공유: 네트워크 네임스페이스 · 볼륨 · 수명</text>

  <rect class="accent" x="540" y="112" width="296" height="186" rx="5"/>
  <text class="t-acc" x="554" y="132">파드 solo</text>
  <text class="t-mono" x="554" y="150">IP 10.244.1.6 · 다른 파드</text>
  <rect class="box" x="556" y="162" width="264" height="60" rx="4"/>
  <text class="t-title" x="570" y="184">컨테이너 app</text>
  <text class="t-mono" x="570" y="204">:8080</text>
  <rect class="box" x="556" y="252" width="264" height="34" rx="4"/>
  <text class="t-sub" x="570" y="274">여기서는 localhost 가 아니다</text>

  <line class="line" x1="494" y1="192" x2="536" y2="192" marker-end="url(#m9a1)" marker-start="url(#m9a1)"/>
  <text class="t-sub" x="515" y="240" text-anchor="middle">파드 IP</text>

  <rect class="warnbox" x="40" y="326" width="820" height="36" rx="5"/>
  <text class="t-warn" x="54" y="349">갈리는 것 — 파일시스템(볼륨 제외) · 프로세스 목록 · 리소스 제한은 컨테이너마다 따로다. 같은 포트를 두 컨테이너가 쓸 수 없다.</text>
</svg>
