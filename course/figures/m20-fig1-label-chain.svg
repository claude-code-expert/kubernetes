<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:12px; font-weight:700; fill:#2456c4; }
    .t-mono { font-size:10.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.6; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="400" rx="6"/>
  <text class="t-h" x="40" y="46">세 겹이 다 맞아야 연결된다 — 하나만 어긋나면 에러 없이 사라진다</text>

  <!-- Prometheus CR -->
  <rect class="accent" x="40" y="70" width="240" height="80" rx="4"/>
  <text class="t-title" x="160" y="92" text-anchor="middle">Prometheus (CR)</text>
  <text class="t-mono" x="52" y="112">serviceMonitorSelector:</text>
  <text class="t-mono" x="52" y="128">  matchLabels:</text>
  <text class="t-mono" x="52" y="144">    release: kps</text>

  <!-- ServiceMonitor -->
  <rect class="accent" x="330" y="70" width="250" height="164" rx="4"/>
  <text class="t-title" x="455" y="92" text-anchor="middle">ServiceMonitor</text>
  <text class="t-mono" x="342" y="112">metadata.labels:</text>
  <text class="t-mono" x="342" y="128">  release: kps</text>
  <text class="t-mono" x="342" y="152">spec.selector.matchLabels:</text>
  <text class="t-mono" x="342" y="168">  app: journal-api</text>
  <text class="t-mono" x="342" y="192">spec.endpoints[0].port:</text>
  <text class="t-mono" x="342" y="208">  http</text>
  <text class="t-mono" x="342" y="224">  path: /metrics</text>

  <!-- Service -->
  <rect class="accent" x="630" y="70" width="228" height="164" rx="4"/>
  <text class="t-title" x="744" y="92" text-anchor="middle">Service</text>
  <text class="t-mono" x="642" y="112">metadata.labels:</text>
  <text class="t-mono" x="642" y="128">  app: journal-api</text>
  <text class="t-mono" x="642" y="152">spec.ports:</text>
  <text class="t-mono" x="642" y="168">  - name: http</text>
  <text class="t-mono" x="642" y="184">    port: 8080</text>
  <text class="t-mono" x="642" y="212">spec.selector:</text>
  <text class="t-mono" x="642" y="228">  app: journal-api</text>

  <!-- 연결선 -->
  <path class="aline" d="M 280 122 L 324 122" marker-end="url(#ar2)" marker-start="url(#ar2)"/>
  <text class="t-acc" x="302" y="112" text-anchor="middle">①</text>

  <path class="aline" d="M 580 164 L 624 122" marker-end="url(#ar2)" marker-start="url(#ar2)"/>
  <text class="t-acc" x="604" y="132" text-anchor="middle">②</text>

  <path class="aline" d="M 580 206 L 624 168" marker-end="url(#ar2)" marker-start="url(#ar2)"/>
  <text class="t-acc" x="604" y="200" text-anchor="middle">③</text>

  <!-- 주의 -->
  <rect class="warnbox" x="630" y="244" width="228" height="42" rx="3"/>
  <text class="t-warn" x="744" y="262" text-anchor="middle">spec.selector 는 파드를 묶는 것</text>
  <text class="t-sub" x="744" y="278" text-anchor="middle">ServiceMonitor 가 보는 것이 아니다</text>

  <!-- 어긋났을 때 -->
  <rect class="soft" x="40" y="300" width="818" height="106" rx="4"/>
  <text class="t-h" x="56" y="324">어긋났을 때 무엇이 보이나</text>

  <rect class="box" x="56" y="336" width="256" height="58" rx="3"/>
  <text class="t-title" x="184" y="356" text-anchor="middle">① release 라벨 누락</text>
  <text class="t-mono" x="184" y="374" text-anchor="middle">kubectl get servicemonitor → 있음</text>
  <text class="t-warn" x="184" y="388" text-anchor="middle">타깃 0건 · 로그에 아무 말 없음</text>

  <rect class="box" x="322" y="336" width="256" height="58" rx="3"/>
  <text class="t-title" x="450" y="356" text-anchor="middle">② selector 불일치</text>
  <text class="t-mono" x="450" y="374" text-anchor="middle">Service 의 labels 를 본다</text>
  <text class="t-warn" x="450" y="388" text-anchor="middle">타깃 0건 · 에러 없음</text>

  <rect class="box" x="588" y="336" width="270" height="58" rx="3"/>
  <text class="t-title" x="723" y="356" text-anchor="middle">③ port 를 숫자로</text>
  <text class="t-mono" x="723" y="374" text-anchor="middle">port: "8080"  (이름이 아니다)</text>
  <text class="t-warn" x="723" y="388" text-anchor="middle">타깃 0건 · 에러 없음</text>
</svg>
