<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2456c4"/>
    </marker>
  </defs>
  <style>
    .outer { fill:#ffffff; stroke:#444444; stroke-width:1.2; }
    .node { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .box { fill:#ffffff; stroke:#c8c8c8; stroke-width:1; }
    .accent { fill:#ffffff; stroke:#2456c4; stroke-width:1.5; }
    .warnbox { fill:#ffffff; stroke:#a1442a; stroke-width:1.5; }
    .soft { fill:#f7f7f5; stroke:#c8c8c8; stroke-width:1; }
    .t-h { font-size:13px; font-weight:700; fill:#333333; }
    .t-title { font-size:13px; font-weight:600; fill:#111111; }
    .t-sub { font-size:11px; fill:#555555; }
    .t-warn { font-size:11px; font-weight:600; fill:#a1442a; }
    .t-acc { font-size:11px; font-weight:600; fill:#2456c4; }
    .t-mono { font-size:11.5px; fill:#333333; font-family:ui-monospace,Consolas,monospace; }
    .t-mono-s { font-size:10.5px; fill:#555555; font-family:ui-monospace,Consolas,monospace; }
    .line { stroke:#444444; stroke-width:1.2; fill:none; }
    .aline { stroke:#2456c4; stroke-width:1.5; fill:none; }
  </style>

  <rect class="outer" x="20" y="20" width="860" height="410" rx="6"/>
  <text class="t-h" x="40" y="46">HPA 는 15초마다 같은 계산을 되풀이한다</text>

  <!-- 파드 -->
  <rect class="node" x="42" y="74" width="150" height="104" rx="4"/>
  <text class="t-sub" x="54" y="94">파드 3개</text>
  <rect class="box" x="56" y="102" width="122" height="20" rx="3"/>
  <text class="t-mono-s" x="117" y="116" text-anchor="middle">journal-api  48m</text>
  <rect class="box" x="56" y="126" width="122" height="20" rx="3"/>
  <text class="t-mono-s" x="117" y="140" text-anchor="middle">journal-api  47m</text>
  <rect class="box" x="56" y="150" width="122" height="20" rx="3"/>
  <text class="t-mono-s" x="117" y="164" text-anchor="middle">journal-api  49m</text>

  <path class="line" d="M 192 126 L 246 126" marker-end="url(#ar1)"/>
  <text class="t-sub" x="219" y="118" text-anchor="middle">kubelet</text>

  <!-- metrics-server -->
  <rect class="node" x="248" y="98" width="146" height="56" rx="4"/>
  <text class="t-title" x="321" y="122" text-anchor="middle">metrics-server</text>
  <text class="t-sub" x="321" y="140" text-anchor="middle">최근값만. 기록은 없다</text>

  <path class="line" d="M 394 126 L 448 126" marker-end="url(#ar1)"/>

  <!-- HPA -->
  <rect class="accent" x="450" y="74" width="388" height="104" rx="4"/>
  <text class="t-title" x="466" y="96">HPA 컨트롤러</text>
  <text class="t-mono" x="466" y="120">desired = ceil( 현재수 x 현재사용량 / 목표사용량 )</text>
  <text class="t-mono-s" x="466" y="140">= ceil( 3 x 48m / 25m ) = ceil(5.76) = 6</text>
  <text class="t-sub" x="466" y="162">목표 50% 는 requests(50m) 의 50% — 25m 이다. 노드 용량이 아니다.</text>

  <path class="aline" d="M 644 178 L 644 214" marker-end="url(#ar2)"/>
  <text class="t-acc" x="656" y="200">replicas 를 6 으로</text>

  <!-- Deployment -->
  <rect class="node" x="450" y="216" width="388" height="46" rx="4"/>
  <text class="t-title" x="644" y="244" text-anchor="middle">Deployment journal-api</text>

  <path class="line" d="M 450 239 L 200 239 L 200 182" marker-end="url(#ar1)"/>
  <text class="t-sub" x="330" y="256" text-anchor="middle">파드가 늘어나면 파드당 사용량이 내려가고, 다음 주기에 다시 잰다</text>

  <!-- 비대칭 -->
  <rect class="soft" x="42" y="292" width="796" height="118" rx="4"/>
  <text class="t-h" x="58" y="316">늘릴 때와 줄일 때가 다르다</text>

  <rect class="accent" x="58" y="330" width="370" height="64" rx="3"/>
  <text class="t-acc" x="243" y="352" text-anchor="middle">확장 — 곧바로</text>
  <text class="t-sub" x="243" y="370" text-anchor="middle">부족한 상태를 오래 두면 요청이 떨어진다.</text>
  <text class="t-sub" x="243" y="386" text-anchor="middle">기본 안정화 윈도우 0초</text>

  <rect class="warnbox" x="452" y="330" width="370" height="64" rx="3"/>
  <text class="t-warn" x="637" y="352" text-anchor="middle">축소 — 300초 기다린 뒤</text>
  <text class="t-sub" x="637" y="370" text-anchor="middle">그 5분 동안의 권고값 중 <tspan font-weight="600">가장 큰 값</tspan>을 쓴다.</text>
  <text class="t-sub" x="637" y="386" text-anchor="middle">부하가 오르내릴 때 파드 수가 진동하는 것을 막는다</text>
</svg>
