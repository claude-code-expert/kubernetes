apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "journal.fullname" . }}-api
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- /* HPA 가 켜져 있으면 replicas 를 아예 렌더링하지 않는다 (M17).
         값이 들어가면 helm upgrade 마다 HPA 가 정한 수가 되돌아간다. */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "journal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "journal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # 설정 내용의 해시. 컨피그맵이 바뀌면 이 값이 바뀌고, 파드 템플릿이 바뀌어 롤아웃이 일어난다.
        # M13 에서 "컨피그맵을 바꿔도 환경 변수는 그대로"였던 문제를 차트가 해결하는 방식이다.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- if .Values.podSecurity.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurity.apiRunAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      automountServiceAccountToken: false
      {{- if .Values.api.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # 이 줄이 없으면 테인트 걸린 컨트롤 플레인까지 도메인으로 세어 스케줄이 막힌다 (M16)
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              {{- include "journal.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      {{- end }}
      containers:
        - name: api
          image: {{ include "journal.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          env:
            - name: APP_VERSION
              value: {{ include "journal.apiTag" . | quote }}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "journal.fullname" . }}-config
                  key: LOG_LEVEL
{{- if .Values.redis.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "journal.fullname" . }}-secret
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://default:$(REDIS_PASSWORD)@{{ include "journal.fullname" . }}-redis-0.{{ include "journal.fullname" . }}-redis:6379"
{{- end }}
          {{- if .Values.podSecurity.enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- end }}
          # 프로브 3종 (M15). startup 이 끝나기 전에는 liveness 가 돌지 않는다.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          # 엔드포인트에서 빠지는 일과 프로세스가 죽는 일은 동시에 끝나지 않는다 (M15).
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.api.preStopSleep }}"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "journal.fullname" . }}-api
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    # M20 의 ServiceMonitor 가 이 라벨로 이 서비스를 찾는다.
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "journal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
