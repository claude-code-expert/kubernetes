# 운영 — 여유를 두고, 관측을 켜고, 중단을 막는다.
api:
  image:
    tag: "v2"
  logLevel: warn
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 384Mi}
web:
  replicas: 3
redis:
  storage: 5Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 55
pdb:
  enabled: true
  minAvailable: 2
metrics:
  serviceMonitor:
    enabled: true
