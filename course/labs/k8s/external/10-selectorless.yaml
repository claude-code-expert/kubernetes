# M34 — 클러스터 밖의 주소를 서비스처럼 쓴다.
#
# selector 를 쓰지 않으면 쿠버네티스가 엔드포인트를 만들어 주지 않는다.
# 그 자리를 우리가 EndpointSlice 로 직접 채운다.
# 그러면 파드는 "클러스터 안의 서비스"와 똑같이 이름으로 부른다 —
# 주소가 바뀌어도 앱을 고치지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: ext-redis
  namespace: m34
spec:
  # selector 가 없다. 이것이 핵심이다.
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-redis-1
  namespace: m34
  labels:
    # 이 라벨이 슬라이스를 서비스에 붙인다. 틀리면 조용히 아무 데도 안 붙는다.
    kubernetes.io/service-name: ext-redis
addressType: IPv4
ports:
  - name: redis          # 서비스의 포트 이름과 같아야 한다
    port: 6379
    protocol: TCP
endpoints:
  - addresses:
      - "172.20.0.5"     # 클러스터 밖 주소. 환경마다 다르다
    conditions:
      # 준비 상태를 우리가 직접 말해야 한다 — 프로브가 없다.
      # 주소가 죽어도 쿠버네티스는 모른다. 이것이 이 방식의 한계다.
      ready: true
