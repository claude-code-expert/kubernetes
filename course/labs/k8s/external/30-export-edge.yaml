# M34 — edge 클러스터에서 "내보내는" 쪽.
#
# 다른 클러스터가 부를 수 있는 주소가 필요하다.
# 클라우드라면 내부 로드밸런서를, kind 에서는 NodePort 를 쓴다 —
# 어느 쪽이든 **클러스터 밖에서 닿는 고정 주소**를 만드는 것이 목적이다.
apiVersion: v1
kind: Namespace
metadata: {name: shared}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: greeter, namespace: shared}
spec:
  replicas: 2
  selector: {matchLabels: {app: greeter}}
  template:
    metadata: {labels: {app: greeter}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      containers:
        - name: api
          image: journal-api:v1
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_VERSION, value: "edge-greeter"}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: greeter, namespace: shared}
spec:
  type: NodePort
  selector: {app: greeter}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31080      # 고정한다. 임의 포트면 다른 클러스터의 설정이 매번 바뀐다
