# M23 — journal 네임스페이스에서만 일하는 개발자 계정.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev
  namespace: journal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev
  namespace: journal          # Role 은 네임스페이스에 갇힌다. 여기 밖에서는 아무 권한도 없다
rules:
  # 읽기 — 진단에 필요한 최소한
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # 쓰기 — 배포와 롤아웃까지만
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["update", "patch"]
  # 시크릿은 넣지 않는다. 넣으면 base64 를 벗겨 평문을 읽을 수 있다 (M13)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev
  namespace: journal
subjects:
  - kind: ServiceAccount
    name: dev
    namespace: journal
roleRef:
  kind: Role
  name: dev
  apiGroup: rbac.authorization.k8s.io
