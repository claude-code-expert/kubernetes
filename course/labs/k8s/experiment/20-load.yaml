# M38 — 실험용 부하. 두 변형에 같은 트래픽이 가야 비교가 성립한다.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ab-load, namespace: m38}
spec:
  replicas: 2
  selector: {matchLabels: {app: ab-load}}
  template:
    metadata: {labels: {app: ab-load}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      automountServiceAccountToken: false
      containers:
        - name: load
          image: curlimages/curl:8.19.0
          command: ["sh","-c","while true; do curl -s -o /dev/null -m 3 http://journal-ab:8080/api/entries; sleep 0.03; done"]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
