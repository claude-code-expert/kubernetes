# 운영 오버레이 — 같은 base 를 여유 있게.
# 이 오버레이는 base 와 같은 네임스페이스(journal)를 쓰지 않는다.
# 실습 클러스터에서 두 오버레이를 동시에 띄워 비교하기 위한 구성이다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: journal-kprod
nameSuffix: "-kprod"

resources:
  - ../../journal

patches:
  - target: {kind: Namespace, name: journal}
    patch: |-
      - op: replace
        path: /metadata/name
        value: journal-kprod
  # REDIS_URL 은 순서가 중요하므로 JSON 패치 (dev 오버레이의 주석 참조)
  - target: {kind: Deployment, name: journal-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "redis://default:$(REDIS_PASSWORD)@redis-kprod-0.redis-kprod:6379"
  # 리소스는 순서와 무관하므로 전략적 병합 패치가 읽기 쉽다
  - target: {kind: Deployment, name: journal-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: journal-api}
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests: {cpu: 100m, memory: 128Mi}
                  limits: {memory: 384Mi}
  - target: {kind: HorizontalPodAutoscaler}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
  - target: {kind: Ingress}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: journal-kprod.local

images:
  - name: journal-api
    newTag: v2

configMapGenerator:
  - name: journal-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
