# 개발 오버레이 — 같은 base 를 작은 크기로 배포한다.
# kubectl apply -k course/labs/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: journal-kdev
nameSuffix: "-kdev"

resources:
  - ../../journal

# 네임스페이스 리소스는 base 의 이름이 박혀 있어 오버레이에서 새로 만든다.
# (base 의 00-namespace.yaml 은 namespace: 지시로 바뀌지 않는다 — 자기 자신이 네임스페이스이기 때문)
patches:
  - target: {kind: Namespace, name: journal}
    patch: |-
      - op: replace
        path: /metadata/name
        value: journal-kdev
  # 개발은 파드 하나. HPA 를 지우고 replicas 를 되살린다.
  - target: {kind: HorizontalPodAutoscaler}
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: {name: journal-api}
  - target: {kind: PodDisruptionBudget}
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: {name: journal-api}
  - target: {kind: Deployment, name: journal-api}
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      # 노드가 하나뿐인 환경에서는 이 제약이 스케줄을 막는다
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
  - target: {kind: Deployment, name: web-static}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # nameSuffix 로 서비스 이름이 바뀌었는데, 환경 변수 안의 문자열은 바뀌지 않는다.
  # kustomize 는 자기가 아는 필드(serviceName 등)만 고친다 (M28 실패 ①).
  # nameSuffix 로 서비스 이름이 바뀌었는데, 환경 변수 안의 문자열은 바뀌지 않는다.
  # kustomize 는 자기가 아는 필드(serviceName 등)만 고친다 (M28 실패 ①).
  #
  # 여기서 전략적 병합 패치를 쓰면 안 된다. env 목록이 병합되면서 순서가 바뀌고,
  # $(REDIS_PASSWORD) 는 **앞에 정의된 변수만** 치환되므로 값이 그대로 나간다 (M28 실패 ②).
  # 순서를 지키려면 위치를 지정하는 JSON 패치를 쓴다.
  - target: {kind: Deployment, name: journal-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "redis://default:$(REDIS_PASSWORD)@redis-kdev-0.redis-kdev:6379"
  - target: {kind: Ingress}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: journal-kdev.local

# 개발에서는 로그를 자세히
configMapGenerator:
  - name: journal-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
