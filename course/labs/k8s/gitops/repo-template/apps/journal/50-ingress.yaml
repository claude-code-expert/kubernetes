# 진입점. M12 에서 default 에 만든 것과 같은 규칙을 journal 네임스페이스로 옮겼다.
# 인그레스는 자기 네임스페이스의 서비스만 백엔드로 지정할 수 있다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: journal
spec:
  ingressClassName: nginx
  rules:
    - host: journal.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: journal-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-static
                port:
                  name: http
