# 저널 API — M10 의 디플로이먼트에 레디스 연결과 설정 주입을 더했다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-api
  labels:
    app: journal-api
spec:
  # replicas 를 적지 않는다 (M17). HPA 가 이 필드의 주인이다 —
  # 여기에 숫자를 남겨 두면 apply 할 때마다 HPA 가 정한 값이 이 값으로 되돌아간다.
  selector:
    matchLabels:
      app: journal-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: journal-api
    spec:
      # preStop(10초) + 앱이 커넥션을 닫는 시간을 합친 것보다 넉넉해야 한다.
      # 이 시간을 넘기면 kubelet 이 SIGKILL 로 끊는다. 기본값도 30 이지만 명시한다 —
      # preStop 을 늘릴 때 함께 늘려야 하는 값이기 때문이다.
      terminationGracePeriodSeconds: 30
      # ── 파드 수준 보안 (M24) ────────────────────────────────────────
      # restricted 프로파일이 요구하는 셋. seccompProfile 은 파드 수준에서 한 번만 쓰면
      # 모든 컨테이너에 적용된다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # 이 앱은 쿠버네티스 API 를 호출하지 않는다. 토큰을 넣어 둘 이유가 없다 (M23 8절).
      automountServiceAccountToken: false
      # 파드를 노드에 고르게 편다 (M16). 한 노드에 몰려 있으면 그 노드가 빠질 때 전부 같이 빠진다.
      # nodeTaintsPolicy: Honor 가 없으면 테인트 걸린 control-plane 도 도메인으로 세어
      # 어디에 놓아도 skew 가 1 을 넘게 되고, 스케줄이 통째로 막힌다. 기본값은 Ignore 다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: journal-api
      containers:
        - name: api
          image: journal-api:v1
          imagePullPolicy: IfNotPresent      # kind load 로 넣은 로컬 이미지라 당겨오지 않는다
          ports:
            - name: http
              containerPort: 8080
          # requests 가 스케줄링을 결정하고 limits 가 런타임을 제한한다 (M16).
          # cpu limit 을 걸지 않는 이유: 초과하면 죽는 것이 아니라 조여진다(스로틀링).
          # 여유가 있을 때 더 쓰게 두는 편이 낫다. memory 는 초과하면 OOMKilled 이므로 건다.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          env:
            - name: APP_VERSION
              value: "v1"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: journal-config
                  key: LOG_LEVEL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: journal-secret
                  key: REDIS_PASSWORD
            # redis-0.redis 는 스테이트풀셋이 보장하는 고정 이름이다.
            # 파드가 다시 만들어져 IP 가 바뀌어도 이 이름은 그대로다.
            - name: REDIS_URL
              value: "redis://default:$(REDIS_PASSWORD)@redis-0.redis:6379"
          # ── 컨테이너 수준 보안 (M24) ─────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # ── 프로브 3종 (M15) ──────────────────────────────────────────────
          # startup: 느리게 뜨는 동안 liveness 가 죽이지 못하게 막는다.
          #   최대 1초 x 30회 = 30초를 기다린다. 이 시간을 넘기면 그때는 재시작이 맞다.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          # readiness: 트래픽을 받을 준비가 됐는가. 실패하면 엔드포인트에서 빠진다.
          #   레디스에 못 붙으면 앱이 503 을 돌려준다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          # liveness: 살아 있는가. 실패하면 컨테이너를 재시작한다.
          #   startup 이 성공한 뒤에야 시작한다. 임계값을 readiness 보다 느슨하게 잡는다 —
          #   조급한 liveness 는 고치지 못하는 것을 재시작으로 덮으려 든다.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # preStop: 엔드포인트에서 빠지는 일과 프로세스가 죽는 일은 동시에 끝나지 않는다.
          #   그 사이가 종료 창이고, 여기서 요청이 떨어진다. 잠깐 더 살아서 시간을 벌어 준다.
          #   실측(M15): 없을 때 20건 실패 → 5초에서 2~3건 → 10초에서 0건.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: journal-api
  labels:
    # M20 의 ServiceMonitor 가 이 라벨로 이 서비스를 찾는다.
    # spec.selector 는 "어느 파드를 묶을까"이고 metadata.labels 는 "나는 누구인가"다.
    # ServiceMonitor 가 보는 것은 뒤쪽이다.
    app: journal-api
spec:
  type: ClusterIP
  selector:
    app: journal-api
  ports:
    - name: http
      port: 8080
      targetPort: http
