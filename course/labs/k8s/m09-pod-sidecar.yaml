# M09 — 한 파드 안 두 컨테이너. 같은 네트워크 네임스페이스를 공유하므로 localhost 로 통신한다.
apiVersion: v1
kind: Pod
metadata:
  name: journal-with-sidecar
  labels:
    app: journal
    tier: api
spec:
  initContainers:
    # 순서 강제: 이 컨테이너가 끝나야 아래 컨테이너들이 시작한다.
    - name: init-config
      image: alpine:3.22
      command: ["sh", "-c", "echo 'ready at' $(date -u +%H:%M:%S) > /shared/init.txt; echo init done"]
      volumeMounts:
        - name: shared
          mountPath: /shared
  containers:
    - name: api
      image: journal-api:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: shared
          mountPath: /shared
    - name: sidecar
      image: alpine:3.22
      # 사이드카가 같은 파드의 api 를 localhost 로 호출한다.
      command: ["sh", "-c", "apk add --no-cache curl >/dev/null 2>&1; while true; do curl -s localhost:8080/healthz; echo; sleep 10; done"]
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      emptyDir: {}
