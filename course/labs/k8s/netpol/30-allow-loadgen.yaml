# M36 — 진단 도구의 경로.
#
# M25 에서 journal 을 화이트리스트로 만들었기 때문에, 안에서 도는 부하 생성기도
# 명시적으로 열어야 한다. 이것을 잊으면 측정값이 전부 000 으로 나오고
# "앱이 죽었다"고 오진하게 된다 (M36 실패 ①).
#
# 실험이 끝나면 지운다 — 진단용 경로를 상시로 두지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loadgen
  namespace: journal
spec:
  podSelector:
    matchLabels: {app: journal-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: loadgen}
      ports:
        - {protocol: TCP, port: 8080}
---
# 부하 생성기가 나갈 수 있어야 한다 (default-deny 가 양방향이다)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loadgen-egress
  namespace: journal
spec:
  podSelector:
    matchLabels: {role: loadgen}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: journal-api}
      ports:
        - {protocol: TCP, port: 8080}
