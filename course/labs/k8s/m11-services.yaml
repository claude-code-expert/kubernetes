# M11 — 서비스 3종. 같은 파드 집합을 서로 다른 방식으로 노출한다.
apiVersion: v1
kind: Service
metadata:
  name: journal-api            # 이 이름이 클러스터 안 DNS 이름이 된다
spec:
  type: ClusterIP              # 기본값. 클러스터 내부에서만 접근 가능
  selector:
    app: journal-api           # 이 레이블을 가진 파드로 트래픽을 보낸다
  ports:
    - name: http
      port: 8080               # 서비스가 여는 포트
      targetPort: 8080         # 파드의 포트
---
apiVersion: v1
kind: Service
metadata:
  name: journal-api-nodeport
spec:
  type: NodePort               # 노드의 포트를 열어 클러스터 밖에서 접근
  selector:
    app: journal-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080          # 30000~32767 범위. 생략하면 자동 할당
---
apiVersion: v1
kind: Service
metadata:
  name: journal-api-headless
spec:
  clusterIP: None              # 헤드리스 — 가상 IP 없이 파드 IP를 직접 돌려준다
  selector:
    app: journal-api
  ports:
    - port: 8080
