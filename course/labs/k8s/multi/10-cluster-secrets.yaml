# M32 — Argo CD 가 아는 "리전" 목록. 라벨이 곧 리전 메타데이터다.
#
# 로컬 클러스터도 명시적으로 등록한다. Argo CD 는 자기가 사는 클러스터를
# in-cluster 로 자동 인식하지만, 그 항목에는 **라벨을 붙일 수 없어서**
# ApplicationSet 의 클러스터 생성기가 고르지 못한다.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-primary
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    region: primary
    tier: prod
type: Opaque
stringData:
  name: primary
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig": {"insecure": false}}
