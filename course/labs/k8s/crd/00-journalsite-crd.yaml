# M33 — 새 리소스 종류를 정의한다.
#
# 이름 규칙: <복수형>.<그룹>. 그룹은 우리 조직의 도메인을 거꾸로 쓴다.
# 이렇게 해야 남의 CRD 와 이름이 겹치지 않는다.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: journalsites.study.example.com
spec:
  group: study.example.com
  scope: Namespaced
  names:
    plural: journalsites
    singular: journalsite
    kind: JournalSite
    shortNames: [js]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # status 를 별도 서브리소스로 분리한다.
      # 사용자는 spec 을, 컨트롤러는 status 를 쓴다 — 서로의 쓰기가 충돌하지 않는다.
      subresources:
        status: {}
      # kubectl get 에 보이는 열. 이것이 없으면 NAME 과 AGE 만 나온다.
      additionalPrinterColumns:
        - {name: Replicas, type: integer, jsonPath: .spec.replicas}
        - {name: Image,    type: string,  jsonPath: .spec.image}
        - {name: Ready,    type: string,  jsonPath: .status.readyReplicas}
        - {name: Phase,    type: string,  jsonPath: .status.phase}
        - {name: Age,      type: date,    jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  # latest 금지를 스키마 수준에서 건다 (M26 은 어드미션에서 했다).
                  # 정규식이 스키마에 있으면 정책 엔진 없이도 API 서버가 거부한다.
                  pattern: '^[a-z0-9./-]+:[a-zA-Z0-9._-]+$'
                  not:
                    pattern: ':latest$'
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 2
                logLevel:
                  type: string
                  enum: [debug, info, warn, error]
                  default: info
            status:
              type: object
              properties:
                readyReplicas: {type: integer}
                phase:         {type: string}
                observedGeneration: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:    {type: string}
                      status:  {type: string}
                      reason:  {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string}
