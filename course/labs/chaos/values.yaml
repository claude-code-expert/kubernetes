# M36 — Chaos Mesh 설치 값 (kind 용).
#
# kind 는 containerd 를 쓰고 소켓 경로가 도커와 다르다. 기본값(도커)으로 두면
# 카오스 데몬이 컨테이너를 찾지 못한다.
chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock

dashboard:
  # 실습에서는 UI 를 쓰지 않는다. 매니페스트로만 실험한다 —
  # 실험이 코드로 남아야 재현되고 리뷰된다.
  create: false

controllerManager:
  replicaCount: 1

# 실습 클러스터의 자원을 아낀다
dnsServer:
  create: false
