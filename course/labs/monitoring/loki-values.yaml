# course/labs/monitoring/loki-values.yaml
# 로키 단일 인스턴스 설치 값. 차트 7.3.0 / Loki 3.6.12 기준 (2026-09-05 확인).
#
# 검색하면 나오는 loki-stack 차트는 쓰지 않는다 — deprecated 이고 appVersion 이
# v2.9.3 에 멈춰 있다. 확인: helm show chart grafana/loki-stack | grep deprecated

deploymentMode: SingleBinary

loki:
  # 멀티테넌시를 끈다. 켜면 모든 요청에 X-Scope-OrgID 헤더가 필요해진다.
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    # 단일 인스턴스이므로 1. 기본값(3)이면 기동하지 못한다.
    replication_factor: 1
  storage:
    type: filesystem
    # 파일시스템을 써도 차트 템플릿이 이 값을 참조한다. 비워두면 렌더링이 깨진다.
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  # schemaConfig 를 명시하지 않으면 최근 차트는 설치가 실패한다.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    # 구조화 메타데이터 — 라벨을 늘리지 않고 필드를 붙이는 방법 (M22 8절)
    allow_structured_metadata: true
    volume_enabled: true
    # 실습용. 책 3.8 은 운영에서 30~45일을 권한다.
    retention_period: 72h

singleBinary:
  replicas: 1
  nodeSelector:
    workload: observability      # 관측 스택을 한 노드에 모은다 (M16·M19)
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 900Mi}

# ── 다른 배포 모드의 파드가 뜨지 않도록 0으로 ──────────────────────────
# SingleBinary 모드인데도 차트가 마이크로서비스 컴포넌트를 기본으로 켠다.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomPlanner: {replicas: 0}
bloomBuilder: {replicas: 0}
bloomGateway: {replicas: 0}

# ── 노트북을 지키기 위한 설정 ──────────────────────────────────────────
# 캐시는 memcached 파드를 띄우며 기본 요청 메모리가 크다. 실습에서는 끈다.
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}

gateway:
  nodeSelector:
    workload: observability
