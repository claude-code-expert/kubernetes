apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-sample-boot
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-sample-boot
  template:
    metadata:
      labels:
        app: k8s-sample-boot
    spec:
      containers:
        - name: k8s-sample-boot
          image: demo/k8s-sample-boot:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-sample-boot
  namespace: sample-app
spec:
  selector:
    app: k8s-sample-boot
  ports:
    - port: 8080
      targetPort: http
