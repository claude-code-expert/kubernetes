services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: testdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  probe:
    image: mysql:8.4
    command: ["sh","-c","mysqladmin ping -h mysql -uroot -p1234"]
    depends_on:
      mysql:
        condition: service_healthy
