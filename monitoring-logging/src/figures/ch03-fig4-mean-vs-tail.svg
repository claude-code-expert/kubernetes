<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t4 d4">
  <title id="t4">평균 45ms를 겪은 요청은 없다</title>
  <desc id="d4">order-api 응답 시간 분포. 대부분의 요청은 1밀리초 안팎에 끝나고 일부가 800밀리초 근처에 몰린다. 평균 45밀리초는 두 무리 사이 빈 곳에 떨어진다. P50 0.59ms, P95 725ms, P99 790ms는 실측값이다.</desc>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="40" y="60" font-size="34" font-weight="700" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#24292A">order-api 응답 시간 분포</text>
  <text x="40" y="102" font-size="24" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#5A6867">가로축 로그 눈금 · 세로축 요청 수(개략)</text>
  <rect x="252" y="650" width="46" height="40" fill="#DDF3EC" stroke="#0F766E" stroke-width="2"/><rect x="317" y="480" width="46" height="210" fill="#DDF3EC" stroke="#0F766E" stroke-width="2"/><rect x="379" y="260" width="46" height="430" fill="#DDF3EC" stroke="#0F766E" stroke-width="2"/><rect x="442" y="440" width="46" height="250" fill="#DDF3EC" stroke="#0F766E" stroke-width="2"/><rect x="506" y="600" width="46" height="90" fill="#DDF3EC" stroke="#0F766E" stroke-width="2"/><rect x="567" y="660" width="46" height="30" fill="#DDF3EC" stroke="#0F766E" stroke-width="2"/><rect x="632" y="678" width="46" height="12" fill="#DDF3EC" stroke="#0F766E" stroke-width="2"/><rect x="1325" y="656" width="30" height="34" fill="#FCE4E6" stroke="#C2414A" stroke-width="2"/><rect x="1357" y="624" width="30" height="66" fill="#FCE4E6" stroke="#C2414A" stroke-width="2"/>
  <line x1="120" y1="690" x2="1560" y2="690" stroke="#5A6867" stroke-width="2.5"/>
  <line x1="150" y1="690" x2="150" y2="704" stroke="#5A6867" stroke-width="2"/><text x="150" y="738" font-size="26" text-anchor="middle" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">0.1ms</text><line x1="465" y1="690" x2="465" y2="704" stroke="#5A6867" stroke-width="2"/><text x="465" y="738" font-size="26" text-anchor="middle" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">1ms</text><line x1="780" y1="690" x2="780" y2="704" stroke="#5A6867" stroke-width="2"/><text x="780" y="738" font-size="26" text-anchor="middle" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">10ms</text><line x1="1095" y1="690" x2="1095" y2="704" stroke="#5A6867" stroke-width="2"/><text x="1095" y="738" font-size="26" text-anchor="middle" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">100ms</text><line x1="1410" y1="690" x2="1410" y2="704" stroke="#5A6867" stroke-width="2"/><text x="1410" y="738" font-size="26" text-anchor="middle" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">1s</text>
  <line x1="393" y1="690" x2="393" y2="142" stroke="#0B5A54" stroke-width="3"/><text x="407" y="176" font-size="34" font-weight="700" text-anchor="start" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#0B5A54">P50</text><text x="407" y="214" font-size="28" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#0B5A54">0.59ms</text><line x1="986" y1="690" x2="986" y2="292" stroke="#B5761F" stroke-width="3" stroke-dasharray="10 7"/><text x="1000" y="326" font-size="34" font-weight="700" text-anchor="start" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#B5761F">평균</text><text x="1000" y="364" font-size="28" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#B5761F">45ms</text><line x1="1366" y1="690" x2="1366" y2="142" stroke="#C2414A" stroke-width="3"/><text x="1352" y="176" font-size="34" font-weight="700" text-anchor="end" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#C2414A">P95</text><text x="1352" y="214" font-size="28" text-anchor="end" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#C2414A">725ms</text><line x1="1378" y1="690" x2="1378" y2="242" stroke="#C2414A" stroke-width="3"/><text x="1392" y="276" font-size="34" font-weight="700" text-anchor="start" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#C2414A">P99</text><text x="1392" y="314" font-size="28" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#C2414A">790ms</text>
  <text x="402" y="794" font-size="28" font-weight="700" text-anchor="middle" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#0B5A54">정상 요청 대부분</text>
  <text x="986" y="794" font-size="28" font-weight="700" text-anchor="middle" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#B5761F">이 근처 요청은 거의 없다</text>
  <text x="1361" y="794" font-size="28" font-weight="700" text-anchor="middle" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#C2414A">느린 요청 무리</text>
  <text x="40" y="858" font-size="22" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#6F7C79">막대 모양은 개략도, 네 수치는 실측값. k6 부하 중 /api/chaos/slow 요청이 초당 2건 섞여 있었다</text>
</svg>
