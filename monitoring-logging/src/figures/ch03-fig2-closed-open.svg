<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t2 d2">
  <title id="t2">폐쇄형 모니터링과 개방형 모니터링</title>
  <desc id="d2">폐쇄형은 시스템 밖에서 사용자처럼 요청을 보내 응답만 본다. 개방형은 시스템이 스스로 내놓는 내부 수치를 프로메테우스가 긁어 간다.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6867"/></marker>
    <marker id="a2t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
  </defs>
  <style>
    .t{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#24292A}
    .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;fill:#5A6867}
    .h{font-family:'SFMono-Regular',Consolas,monospace;font-size:24px;font-weight:700;letter-spacing:2px}
  </style>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <line x1="740" y1="40" x2="740" y2="860" stroke="#D8DDD6" stroke-width="2"/>

  <!-- LEFT -->
  <text class="h" x="40" y="66" style="fill:#6F7C79">CLOSED-BOX · 폐쇄형</text>
  <text class="t" x="40" y="118" font-size="38" font-weight="700">밖에서 사용자처럼 요청을 보내 본다</text>

  <rect x="40" y="276" width="236" height="200" rx="8" fill="#FFFFFF" stroke="#A7B5AC" stroke-width="2"/>
  <text class="t" x="60" y="326" font-size="32" font-weight="700">점검기</text>
  <text class="m" x="60" y="358" font-size="20">Prober</text>
  <text class="t" x="60" y="408" font-size="24" style="fill:#5A6867">합성 요청</text>
  <text class="m" x="60" y="440" font-size="19">Synthetic request</text>

  <rect x="430" y="200" width="270" height="350" rx="8" fill="#E9ECEA" stroke="#A7B5AC" stroke-width="2"/>
  <text class="t" x="565" y="370" font-size="32" font-weight="700" text-anchor="middle" style="fill:#6F7C79">order-api</text>
  <text class="t" x="565" y="414" font-size="24" text-anchor="middle" style="fill:#6F7C79">안은 보이지 않음</text>

  <path d="M282 344 L424 344" stroke="#5A6867" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <text class="m" x="288" y="330" font-size="20">GET /health</text>
  <path d="M424 414 L282 414" stroke="#5A6867" stroke-width="2.5" fill="none" marker-end="url(#a2)"/>
  <text class="m" x="288" y="450" font-size="20">200 · 38ms</text>

  <text class="t" x="40" y="650" font-size="28" font-weight="700">답하는 질문</text>
  <text class="t" x="40" y="700" font-size="28">사용자가 겪는 대로 동작하는가?</text>
  <text class="t" x="40" y="760" font-size="26" style="fill:#C2414A">증상은 알지만 이유는 모른다</text>

  <!-- RIGHT -->
  <text class="h" x="790" y="66" style="fill:#0F766E">OPEN-BOX · 개방형</text>
  <text class="t" x="790" y="118" font-size="38" font-weight="700">앱이 제공하는 내부 수치를 본다</text>

  <rect x="790" y="170" width="500" height="470" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text class="t" x="816" y="218" font-size="32" font-weight="700" style="fill:#0B5A54">order-api</text>
  <rect x="816" y="240" width="448" height="62" rx="6" fill="#E0EFEB"/>
  <text class="t" x="834" y="282" font-size="26" style="fill:#0B5A54">요청 수 누계</text>
  <text class="m" x="1246" y="282" font-size="26" text-anchor="end" style="fill:#0B5A54">12,408</text>
  <rect x="816" y="312" width="448" height="62" rx="6" fill="#E0EFEB"/>
  <text class="t" x="834" y="354" font-size="26" style="fill:#0B5A54">500 에러 누계</text>
  <text class="m" x="1246" y="354" font-size="26" text-anchor="end" style="fill:#0B5A54">731</text>
  <rect x="816" y="384" width="448" height="62" rx="6" fill="#E0EFEB"/>
  <text class="t" x="834" y="426" font-size="26" style="fill:#0B5A54">처리 중인 요청</text>
  <text class="m" x="1246" y="426" font-size="26" text-anchor="end" style="fill:#0B5A54">7</text>
  <rect x="816" y="456" width="448" height="62" rx="6" fill="#E0EFEB"/>
  <text class="t" x="834" y="498" font-size="26" style="fill:#0B5A54">응답 시간 분포</text>
  <text class="m" x="1246" y="498" font-size="24" text-anchor="end" style="fill:#0B5A54">버킷별</text>
  <rect x="816" y="556" width="448" height="62" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="m" x="834" y="596" font-size="24" style="fill:#0F766E">/actuator/prometheus</text>

  <rect x="1360" y="520" width="210" height="140" rx="8" fill="#FFFFFF" stroke="#A7B5AC" stroke-width="2"/>
  <text class="t" x="1380" y="576" font-size="28" font-weight="700">Prometheus</text>
  <text class="t" x="1380" y="620" font-size="24" style="fill:#5A6867">30초마다 수집</text>
  <path d="M1356 588 L1270 588" stroke="#0F766E" stroke-width="2.5" fill="none" marker-end="url(#a2t)"/>

  <text class="t" x="790" y="710" font-size="28" font-weight="700">답하는 질문</text>
  <text class="t" x="790" y="760" font-size="28">왜 이렇게 됐나? 어디에서 문제가 생겼나?</text>
  <text class="t" x="790" y="816" font-size="26" style="fill:#0F766E">앱에 계측 코드가 있어야 보인다</text>
  <text class="t" x="1570" y="870" font-size="20" text-anchor="end" style="fill:#6F7C79">숫자는 설명용 예시 · 731 / 12,408 = 5.9%</text>
</svg>
