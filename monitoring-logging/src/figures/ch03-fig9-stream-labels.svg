ont-size="24" font-weight="400" text-anchor="start" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#5A6867">스트림마다 인덱스 항목과 청크가 따로 생긴다</text><text x="840" y="700" font-size="24" font-weight="700" text-anchor="start" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#C2414A">실서비스라면 하루 수십만 스트림</text><text x="840" y="736" font-size="24" font-weight="700" text-anchor="start" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#C2414A">→ Loki 인제스터 메모리 고갈</text><text x="1570" y="870" font-size="20" font-weight="400" text-anchor="end" style="font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;fill:#6F7C79">스트림 수는 실측(요청 60건 전송)</text>
