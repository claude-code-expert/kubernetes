ke-width="1"/><text x="76" y="413" font-size="17" font-weight="400" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">{"path":"/api/entries?req=2","status":200 …}</text><rect x="62" y="428" width="676" height="30" rx="4" fill="#FFFFFF" stroke="#A7B5AC" stroke-width="1"/><text x="76" y="449" font-size="17" font-weight="400" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">{"path":"/api/entries?req=20","status":200 …}</text><rect x="62" y="464" width="676" height="30" rx="4" fill="#FFFFFF" stroke="#A7B5AC" stroke-width="1"/><text x="76" y="485" font-size="17" font-weight="400" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">{"path":"/api/entries?req=32","status":200 …}</text><rect x="40" y="530" width="720" height="170" rx="8" fill="#E0EFEB" stroke="#0F766E" stroke-width="2"/><text x="62" y="566" font-size="20" font-weight="700" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#0B5A54">스트림 3  {app="journal-api", pod="…-q7wzt"}</text><rect x="62" y="582" width="676" height="30" rx="4" fill="#FFFFFF" stroke="#A7B5AC" stroke-width="1"/><text x="76" y="603" font-size="17" font-weight="400" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">{"path":"/api/entries?req=2","status":200 …}</text><rect x="62" y="618" width="676" height="30" rx="4" fill="#FFFFFF" stroke="#A7B5AC" stroke-width="1"/><text x="76" y="639" font-size="17" font-weight="400" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">{"path":"/api/entries?req=20","status":200 …}</text><rect x="62" y="654" width="676" height="30" rx="4" fill="#FFFFFF" stroke="#A7B5AC" stroke-width="1"/><text x="76" y="675" font-size="17" font-weight="400" text-anchor="start" style="font-family:'SFMono-Regular',Consolas,monospace;fill:#5A6867">{"path":"/api/entries?req=32","status":200 …}</text><text x="40" y